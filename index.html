     ok:{t:'Dein Formular ist so gut, dass Brockmann es für die ganze Kompanie übernimmt.', fx:{bp:6, rel:{spiess:5}}},
     fail:{t:'„Was ist das? Ein Bastelbogen?“ Zurück auf Anfang.', fx:{bp:-2}}},
   {t:'Beim Spieß nachfragen', out:{t:'Brockmann seufzt, öffnet eine Schublade und reicht dir beide. „Nächstes Mal früher fragen.“', fx:{st:-5, rel:{spiess:2}}}},
   {t:'Den Antrag einfach vergessen', out:{t:'Drei Tage später fragt jemand nach deinem Antrag. Er ist natürlich überfällig.', fx:{bp:-3}}},
  ]},
 {id:'plane', who:'kalle', ctx:['gelaende','uebung','wache'], blockIf:'plane', text:'Es schüttet. Dein Zelt ist undicht. Kalle taucht mit einer nagelneuen Plane auf. „Hab ich organisiert. Frag nicht.“',
  ch:[
   {t:'Plane nehmen', out:{t:'Trocken. Warm. Herrlich. Auf der Plane steht klein „Instandsetzung“.', fx:{st:15, rel:{kalle:5}, flag:'plane'}}},
   {t:'„Woher ist die?“', out:{t:'Kalle verschwindet mit der Plane. Brockmann hat das Gespräch mitbekommen und nickt dir zu.', fx:{bp:2, rel:{kalle:-10, spiess:4}}}},
   {t:'Nass durchziehen', out:{t:'Du bist nass bis auf die Knochen, aber stolz.', fx:{st:-10, bp:4}}},
  ]},
 {id:'rede', who:'chef', minT:2, text:'Nach einer Motivationsrede über „Agilität im Gefecht“ fragt der Kompaniechef: „Und, was nehmen Sie mit?“',
  ch:[
   {t:'„Hervorragend, Herr Hauptmann!“', out:{t:'Der Chef strahlt. Lena verdreht neben dir die Augen.', fx:{rel:{chef:5, lena:-2}}}},
   {t:'Eine ehrliche Rückmeldung geben', roll:{stat:'fuehrung', base:35},
     ok:{t:'„Konstruktiv. Gefällt mir.“ Der Chef macht sich eine Notiz mit deinem Namen.', fx:{bp:5, rel:{chef:8}}},
     fail:{t:'Das kam schärfer raus als geplant. Der Chef notiert sich ebenfalls deinen Namen.', fx:{rel:{chef:-6}}}},
   {t:'Gähnen unterdrücken', roll:{stat:'fitness', base:50},
     ok:{t:'Niemand hat etwas gemerkt. Du nickst bedeutungsvoll.', fx:{}},
     fail:{t:'Ein Gähnen in voller Lautstärke. Mitten in den Satz über Leidenschaft.', fx:{rel:{chef:-6}}}},
  ]},
 {id:'kueche', who:'kalle', text:'Mittag in der Truppenküche: Es gibt „Jägerschnitzel nach Art des Hauses“. Die Soße ist grau. Kalle flüstert: „Ich hab Döner im Spind.“',
  ch:[
   {t:'Mutig das Schnitzel essen', roll:{stat:'fitness', base:60},
     ok:{t:'Erstaunlich gut. Du fühlst dich gestärkt.', fx:{st:12}},
     fail:{t:'Der Nachmittag gehört der Toilette.', fx:{st:-15}}},
   {t:'Kalles Döner kaufen', out:{t:'Acht Euro, aber jeden Cent wert.', fx:{money:-8, st:15, rel:{kalle:3}}}},
   {t:'Heute lieber fasten', out:{t:'Dein Magen knurrt durch den ganzen Unterricht.', fx:{st:-5}}},
  ]},
 {id:'grill', who:'chef', minT:3, text:'Kompaniefest. Der Kompaniechef steht allein am Grill und kämpft mit drei Würstchen und einer Zange.',
  ch:[
   {t:'Small Talk anfangen', roll:{stat:'vitaminb', base:30},
     ok:{t:'Ihr redet über Fußball und Grilltechnik. Am Ende duzt er dich. Fast.', fx:{bp:3, rel:{chef:10}}},
     fail:{t:'Du fragst nach seinen Hobbys. Er erzählt vierzig Minuten über Golf.', fx:{st:-10, rel:{chef:2}}}},
   {t:'Die Grillzange übernehmen', out:{t:'Die Würstchen sind gerettet. Brockmann sieht es und nickt anerkennend.', fx:{st:-5, rel:{chef:5, spiess:3}}}},
   {t:'Wurst holen und weitergehen', out:{t:'Die Wurst ist halb roh. Das hast du jetzt davon.', fx:{}}},
  ]},
 {id:'uvd_schluessel', who:'spiess', ctx:['uvd'], text:'Drei Uhr nachts im UvD-Dienst. Ein Rekrut meldet, dass er den Stubenschlüssel „aus Versehen“ ins Klo hat fallen lassen. Die Stube ist zu.',
  ch:[
   {t:'Den Ersatzschlüssel im Kasten suchen', roll:{stat:'fachwissen', base:40},
     ok:{t:'Gefunden, beschriftet, zurückgehängt. Lehrbuchmäßig.', fx:{bp:6}},
     fail:{t:'Der Kasten ist ein Chaos aus hundert unbeschrifteten Schlüsseln. Es wird Morgen.', fx:{st:-15, bp:-2}}},
   {t:'Den Rekruten auf dem Flur schlafen lassen', out:{t:'Am Morgen fragt Brockmann, warum ein Rekrut im Flur liegt.', fx:{bp:-5, rel:{spiess:-4}}}},
  ]},
 // Kasernenalltag (zweiter Schwung)
 {id:'g_stubenparty', who:'dennis', text:'Dennis hat Geburtstag. Nach dem Zapfenstreich steht plötzlich ein Kuchen mit Wunderkerzen auf der Stube. Licht aus ist eigentlich vor zehn Minuten gewesen.',
  ch:[
   {t:'Leise mitfeiern', roll:{stat:'vitaminb', base:45},
     ok:{t:'Kuchen, Kakao und flüsternde Gratulationen. Niemand hat etwas gemerkt.', fx:{st:-5, rel:{dennis:6, kalle:3}}},
     fail:{t:'Die Tür geht auf. Brockmann bläst die Wunderkerze aus und sagt nur: „Morgen. Sechs Uhr. Mein Büro.“', fx:{bp:-5, rel:{dennis:4, spiess:-5}}}},
   {t:'Schmiere stehen', out:{t:'Du stehst eine Stunde im dunklen Flur. Dennis hebt dir das größte Stück auf.', fx:{st:-5, rel:{dennis:4}}}},
   {t:'Schlafen', out:{t:'Du schläfst wie ein Stein. Dennis ist ein bisschen beleidigt.', fx:{st:10, rel:{dennis:-3}}}},
  ]},
 {id:'g_waschmaschine', who:'kalle', text:'Die einzige Waschmaschine im Block ist seit drei Tagen belegt. Mit Kalles Wäsche. Die längst fertig ist.',
  ch:[
   {t:'Kalles Wäsche rausnehmen', out:{t:'Du legst sie ordentlich zusammen. Kalle findet das trotzdem übergriffig.', fx:{bp:1, rel:{kalle:-4}}}},
   {t:'Kalle 5 € fürs Vordrängeln geben', out:{t:'„Für dich mach ich Platz.“ Die Maschine ist sofort frei. Sie war nie belegt.', fx:{money:-5, rel:{kalle:2}}}},
   {t:'Mit der Hand im Waschbecken waschen', out:{t:'Wie früher. Deine Socken riechen trotzdem nach Turnhalle.', fx:{st:-8}}},
  ]},
 {id:'g_impfung', who:'dennis', text:'Impftermin im Sanitätsbereich. Dennis steht vor dir in der Schlange, sieht die Nadel und wird kreidebleich.',
  ch:[
   {t:'Dennis auffangen', roll:{stat:'fitness', base:50},
     ok:{t:'Gerade noch erwischt. Der Sanitäter nickt dir anerkennend zu.', fx:{bp:2, rel:{dennis:6}}},
     fail:{t:'Ihr liegt jetzt beide auf dem Boden. Der Sanitäter seufzt.', fx:{st:-5, rel:{dennis:3}}}},
   {t:'Einen Witz über Nadeln machen', out:{t:'Lena lacht. Dennis nicht.', fx:{rel:{dennis:-3, lena:2}}}},
   {t:'Den Sanitäter rufen', out:{t:'Dennis bekommt ein Glas Wasser und einen Keks. Er tut so, als wäre nichts gewesen.', fx:{bp:2}}},
  ]},
 {id:'g_uniform', who:'kalle', text:'Neue Uniform aus der Kleiderkammer. Die Hose ist zwei Nummern zu groß, die Jacke eine zu klein.',
  ch:[
   {t:'In der Kammer tauschen', roll:{stat:'vitaminb', base:40},
     ok:{t:'Der Kammerbulle hat einen guten Tag. Alles passt.', fx:{bp:1}},
     fail:{t:'„Tausch ist mittwochs zwischen neun und neun Uhr fünf.“ Heute ist Donnerstag.', fx:{st:-5}}},
   {t:'Gürtel enger schnallen', out:{t:'Du siehst aus wie ein Sack Kartoffeln mit Dienstgrad.', fx:{bp:-1}}},
   {t:'Kalle fragen', out:{t:'Eine Stunde später: perfekte Größe. Das Etikett gehört zu einer anderen Kaserne.', fx:{money:-15, rel:{kalle:3}}}},
  ]},
 {id:'g_formular', who:'spiess', text:'Post vom Personalamt: Ein Formular, mit dem du ein anderes Formular bestätigen sollst, das du nie bekommen hast.',
  ch:[
   {t:'Sorgfältig ausfüllen', roll:{stat:'fachwissen', base:40},
     ok:{t:'Feld 14b, Unterfeld c, Ankreuzoption „trifft nicht zu“. Erledigt.', fx:{bp:3}},
     fail:{t:'Falsches Kästchen. Es kommt ein Formular, das das Formular korrigiert.', fx:{bp:-1}}},
   {t:'Brockmann fragen', out:{t:'Er schaut kurz drauf, knüllt es zusammen und sagt: „Kenn ich. Erledigt sich von selbst.“', fx:{st:-3, rel:{spiess:2}}}},
   {t:'In die Schublade legen', out:{t:'Zwei Wochen später kommt eine Mahnung. Mit Formular.', fx:{bp:-3}}},
  ]},
 {id:'g_currywurst', who:'lena', text:'Currywurst-Tag in der Truppenküche. Die Schlange reicht bis zum Parkplatz.',
  ch:[
   {t:'Anstellen', out:{t:'Zwanzig Minuten. Hat sich gelohnt.', fx:{st:8, money:-4}}},
   {t:'Lena vorlassen', out:{t:'Lena bedankt sich und schenkt dir die Hälfte ihrer Pommes.', fx:{st:4, rel:{lena:4}}}},
   {t:'Über Kalles Beziehungen gehen', roll:{stat:'vitaminb', base:50},
     ok:{t:'Kalle winkt dich durch die Hintertür. Doppelte Portion.', fx:{st:10, rel:{kalle:2}}},
     fail:{t:'Kalle hat dich vergessen. Als du dran bist, ist die Wurst alle.', fx:{st:-3}}},
  ]},
 {id:'g_alarm', who:'spiess', text:'Drei Uhr nachts: Probealarm. In zehn Minuten vollständig angetreten, mit Gepäck.',
  ch:[
   {t:'Blitzschnell fertig machen', roll:{stat:'fitness', base:45},
     ok:{t:'Als Erster draußen. Brockmann notiert sich deinen Namen, diesmal positiv.', fx:{bp:6, rel:{spiess:3}}},
     fail:{t:'Pünktlich, aber die Stiefel stehen auf dem falschen Fuß. Wörtlich.', fx:{bp:-2}}},
   {t:'Erst Dennis wecken', out:{t:'Ihr kommt als Letzte, aber zusammen. Dennis vergisst dir das nie.', fx:{bp:1, rel:{dennis:5}}}},
   {t:'So tun, als hättest du nichts gehört', out:{t:'Brockmann steht zwei Minuten später neben deinem Bett. Mit Trillerpfeife.', fx:{bp:-5, rel:{spiess:-4}}}},
  ]},
 {id:'g_spindschloss', who:'kalle', text:'Du hast die Kombination deines Spindschlosses vergessen. In zwanzig Minuten ist Antreten in Ausgehuniform.',
  ch:[
   {t:'Alle Kombinationen durchprobieren', out:{t:'Bei 7-3-1 springt es auf. Mit drei Minuten Luft.', fx:{st:-15}}},
   {t:'Kalle holen', out:{t:'Nach acht Sekunden ist der Spind offen. Du willst nicht wissen, woher er das kann.', fx:{rel:{kalle:3}}}},
   {t:'Bolzenschneider aus der Werkstatt', roll:{stat:'fachwissen', base:40},
     ok:{t:'Schloss ab, Uniform an, pünktlich. Ein neues Schloss kostet zehn Euro.', fx:{money:-10}},
     fail:{t:'Der Bolzenschneider ist stumpf. Brockmann sieht dir dabei zu.', fx:{bp:-2, money:-10}}},
  ]},
 {id:'g_sportfest', who:'lena', text:'Kompaniesportfest. Lena stellt eine Staffel zusammen und schaut dich auffordernd an.',
  ch:[
   {t:'Mitlaufen', roll:{stat:'fitness', base:40},
     ok:{t:'Ihr gewinnt die Staffel. Lena springt dir in die Arme und ist sofort wieder ernst.', fx:{bp:5, rel:{lena:5}}},
     fail:{t:'Platz drei von drei. Lena sagt: „Nächstes Jahr.“', fx:{st:-10, rel:{lena:2}}}},
   {t:'Mit Plakat anfeuern', out:{t:'Dennis malt das Plakat, du hältst es hoch. Es ist schief, aber laut.', fx:{rel:{lena:2, dennis:2}}}},
   {t:'Würstchenbude organisieren', out:{t:'Kalle besorgt den Grill. Der Erlös geht zur Hälfte in die Stubenkasse, zur Hälfte zu dir.', fx:{money:30, rel:{kalle:3}}}},
  ]},
 {id:'g_handykasten', who:'spiess', text:'Neue Regel: Handys im Unterricht in einen Kasten am Eingang. Kalle verkauft „Ersatzhandys“ aus Pappe.',
  ch:[
   {t:'Ehrlich abgeben', out:{t:'Zwei Stunden Unterricht ohne Handy. Du hast sogar zugehört.', fx:{bp:2, rel:{spiess:2}}}},
   {t:'Pappattrappe kaufen', roll:{stat:'vitaminb', base:40},
     ok:{t:'Die Attrappe liegt im Kasten, das echte Handy in deiner Tasche. Niemand merkt es.', fx:{money:-10, rel:{kalle:3}}},
     fail:{t:'Brockmann nimmt die Attrappe hoch und versucht, sie zu entsperren. Lange.', fx:{money:-10, bp:-5, rel:{spiess:-5}}}},
  ]},
 {id:'g_putzplan', who:'dennis', text:'Neuer Putzplan auf der Stube. Du bist diese Woche mit den Toiletten dran.',
  ch:[
   {t:'Gründlich putzen', out:{t:'Sie glänzen. Brockmann prüft mit dem weißen Handschuh und findet nichts.', fx:{st:-10, bp:4, rel:{spiess:2}}}},
   {t:'Mit Dennis tauschen', roll:{stat:'vitaminb', base:45},
     ok:{t:'Dennis übernimmt, du machst dafür zweimal den Flur. Guter Deal.', fx:{rel:{dennis:1}}},
     fail:{t:'Dennis lacht nur und geht schlafen.', fx:{st:-10, rel:{dennis:-1}}}},
   {t:'Kalle bezahlen', out:{t:'Kalle putzt nicht selbst, aber er kennt jemanden. Es ist sauber.', fx:{money:-20, rel:{kalle:2}}}},
  ]},
 {id:'g_heimfahrt', who:'lena', text:'Freitag, Heimfahrt. Der Zug fällt aus, der nächste kommt in drei Stunden. Vielleicht.',
  ch:[
   {t:'Bei Lena mitfahren', out:{t:'Lena fährt schnell und hört laute Musik. Du zahlst die Hälfte vom Sprit.', fx:{money:-10, rel:{lena:4}}}},
   {t:'Auf den nächsten Zug warten', out:{t:'Drei Stunden auf dem Bahnsteig. Zu Hause gibt es trotzdem noch Abendessen.', fx:{st:-10}}},
   {t:'Mit Dennis’ altem Auto', roll:{stat:'fachwissen', base:45},
     ok:{t:'Nach zehn Minuten Schrauben springt es an. Ihr kommt sogar früher an.', fx:{rel:{dennis:4}}},
     fail:{t:'Es springt nicht an. Ihr nehmt doch den Zug.', fx:{st:-5, rel:{dennis:2}}}},
  ]},
 {id:'g_kaffeemaschine', who:'spiess', text:'Die Kaffeemaschine im Geschäftszimmer ist kaputt. Die Stimmung in der Kompanie sinkt messbar.',
  ch:[
   {t:'Reparieren', roll:{stat:'fachwissen', base:40},
     ok:{t:'Verkalkt. Mit Essig aus der Küche läuft sie wieder. Brockmann trinkt den ersten Becher und sagt: „Gut gemacht.“', fx:{bp:3, rel:{spiess:6, chef:3}}},
     fail:{t:'Jetzt raucht sie. Und es riecht nach Essig.', fx:{rel:{spiess:-2}}}},
   {t:'Kollekte für eine neue', out:{t:'Alle legen zusammen, du am meisten. Die neue macht sogar Milchschaum.', fx:{money:-15, rel:{spiess:3, kalle:1}}}},
   {t:'Nichts tun', out:{t:'Der Vormittag zieht sich. Brockmann ist unerträglich.', fx:{rel:{spiess:-2}}}},
  ]},
 {id:'g_hund', who:'lena', text:'Ein streunender Hund hat sich auf das Kasernengelände geschlichen und wedelt dich an.',
  ch:[
   {t:'Ihm etwas vom Frühstück geben', out:{t:'Er folgt dir den ganzen Tag. Die Kompanie nennt ihn „Gefreiter Bello“.', fx:{rel:{lena:3, dennis:3}}}},
   {t:'Der Wache melden', out:{t:'Der Hund wird abgeholt und kommt ins Tierheim. Vorbildlich, aber ein bisschen traurig.', fx:{bp:2}}},
   {t:'Lena fragen', out:{t:'Lena kennt jemanden, der einen Hund sucht. Am Abend hat Bello ein Zuhause.', fx:{bp:1, rel:{lena:5}}}},
  ]},
 // Gruppen
 {id:'m_uffzfrage', who:'chef', groups:['M'], text:'Der Kompaniechef fragt im Flur, ob du dir vorstellen kannst, Unteroffizier zu werden.',
  ch:[
   {t:'„Unbedingt, Herr Hauptmann!“', out:{t:'Er nickt zufrieden und macht sich eine Notiz.', fx:{bp:3, rel:{chef:3}}}},
   {t:'„Ich überlege noch.“', out:{t:'„Gut. Überlegen ist erlaubt.“', fx:{bp:1}}},
   {t:'„Mir gefällt es hier unten.“', out:{t:'Kalle und Dennis klopfen dir auf die Schulter.', fx:{rel:{kalle:2, dennis:2}}}},
  ]},
 {id:'u_rekrutenspind', who:'spiess', groups:['U','F'], text:'Stubendurchgang in zehn Minuten. Der Spind eines deiner Rekruten sieht aus wie nach einem Erdbeben.',
  ch:[
   {t:'Mit anpacken', out:{t:'Zu zweit schafft ihr es. Der Rekrut ist dir dankbar.', fx:{st:-8, bp:2}}},
   {t:'Ihm zeigen, wie es geht, und ihn machen lassen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Er schafft es allein. Brockmann sieht es und nickt dir zu.', fx:{bp:5, rel:{spiess:3}}},
     fail:{t:'Nicht ganz fertig. Brockmann schaut dich an, nicht den Rekruten.', fx:{bp:-2}}},
  ]},
 {id:'o_lagevortrag', who:'chef', groups:['O'], text:'Der Bataillonskommandeur will in dreißig Minuten einen Lagevortrag. Von dir.',
  ch:[
   {t:'Frei sprechen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Klar, kurz, ohne Folien. Der Kommandeur ist beeindruckt.', fx:{bp:7, rel:{chef:4}}},
     fail:{t:'Du verlierst dich in Details. Der Kommandeur schaut zweimal auf die Uhr.', fx:{bp:-2}}},
   {t:'Schnell drei Folien bauen', out:{t:'Solide. Von Ahlen ist stolz auf die Folien.', fx:{bp:3, rel:{chef:3}}}},
  ]},
 {id:'gen_kirmes', who:'chef', groups:['G'], text:'Der Bürgermeister der Garnisonsstadt lädt dich als Ehrengast zur Kirmes ein. Mit Bieranstich.',
  ch:[
   {t:'Den Bieranstich übernehmen', roll:{stat:'fitness', base:45},
     ok:{t:'Zwei Schläge, kein Tropfen daneben. Die Lokalzeitung druckt das Foto.', fx:{bp:5}},
     fail:{t:'Der Zapfhahn sitzt, du bist nass. Die Lokalzeitung druckt das Foto.', fx:{bp:1}}},
   {t:'Höflich absagen', out:{t:'Der Bürgermeister ist enttäuscht. Die Kompanie geht ohne dich.', fx:{bp:-1}}},
  ]},
 // Feierabend
 {id:'f_pfand_revier', who:'kalle', ctx:['pfand'], text:'Ein Soldat aus der Nachbarkompanie sammelt auch Leergut. Ihr steht euch vor dem Mannschaftsheim gegenüber.',
  ch:[
   {t:'Das Gelände aufteilen', out:{t:'Du nimmst die Westseite, er die Ostseite. Fair.', fx:{money:5}}},
   {t:'Wettrennen zum Sportplatz', roll:{stat:'fitness', base:45},
     ok:{t:'Erster! Die Kisten am Sportplatz gehören dir.', fx:{money:15}},
     fail:{t:'Er war schneller und winkt dir mit einem vollen Einkaufswagen.', fx:{st:-10}}},
   {t:'Gemeinsame Sache bei Kalle machen', out:{t:'Kalle zahlt für die größere Menge einen besseren Kurs.', fx:{money:10, rel:{kalle:3}}}},
  ]},
 {id:'f_pfand_spiess', who:'spiess', ctx:['pfand'], text:'Brockmann sieht dich mit einem vollen Einkaufswagen Leergut über den Kasernenhof schieben.',
  ch:[
   {t:'Erklären, was du da machst', roll:{stat:'vitaminb', base:40},
     ok:{t:'„Na dann.“ Er holt seine eigene Kiste aus dem Geschäftszimmer und stellt sie dazu.', fx:{money:6, rel:{spiess:3}}},
     fail:{t:'„Das hier ist ein militärischer Bereich und kein Wertstoffhof.“', fx:{bp:-2}}},
   {t:'Schnell weiterschieben', roll:{stat:'fitness', base:50},
     ok:{t:'Um die Ecke und weg. Er hat dich wohl nicht erkannt.', fx:{}},
     fail:{t:'Ein Rad klemmt. Brockmann hat Zeit.', fx:{bp:-3}}},
  ]},
 {id:'f_fix_teil', who:'kalle', ctx:['fix'], text:'Beim Schrauben merkst du: Das gelieferte Ersatzteil ist für das Vorgängermodell.',
  ch:[
   {t:'Passend machen', roll:{stat:'fachwissen', base:45},
     ok:{t:'Etwas feilen, etwas biegen, passt. Gespart hast du dir den Rückversand.', fx:{money:40}},
     fail:{t:'Jetzt passt es gar nicht mehr. Du bestellst neu.', fx:{money:-60}}},
   {t:'Zurückschicken', out:{t:'Zwei Tage Warten, aber sauber.', fx:{st:-5}}},
   {t:'Kalle fragen', out:{t:'Kalle hat zufällig genau das richtige Teil. Im Kofferraum.', fx:{money:-20, rel:{kalle:2}}}},
  ]},
 {id:'f_fix_dennis', who:'dennis', ctx:['fix'], text:'Dennis kommt auf den Parkplatz und will dir „mal eben helfen“.',
  ch:[
   {t:'Ihn machen lassen', roll:{stat:'fachwissen', base:45},
     ok:{t:'Unter deiner Anleitung schraubt er ordentlich. Er ist stolz wie Bolle.', fx:{rel:{dennis:5}}},
     fail:{t:'Er hat die Ölablassschraube abgerissen. Neue kostet 50 Euro.', fx:{money:-50, rel:{dennis:3}}}},
   {t:'Ihn Kaffee holen schicken', out:{t:'Er kommt mit zwei Bechern und einer Tüte Brötchen zurück. Auch eine Hilfe.', fx:{st:5, rel:{dennis:1}}}},
   {t:'„Danke, geht schon.“', out:{t:'Dennis zieht ein bisschen enttäuscht ab.', fx:{rel:{dennis:-2}}}},
  ]},
 {id:'f_fix_auftrag', who:'chef', ctx:['fix'], text:'Ein Kamerad fragt, ob du gegen Bezahlung auch mal an seinem Auto schraubst.',
  ch:[
   {t:'Machen, gegen 80 €', roll:{stat:'vitaminb', base:50},
     ok:{t:'Bremsbeläge gewechselt, 80 € in der Tasche, alle zufrieden.', fx:{money:80, st:-5}},
     fail:{t:'Der Kompaniechef bekommt Wind davon: bezahlte Arbeit ohne Nebentätigkeitsgenehmigung.', fx:{money:80, bp:-4, rel:{chef:-4}}}},
   {t:'Kostenlos, unter Kameraden', out:{t:'Du schraubst eine Stunde. Er bringt dafür einen Kasten Wasser vorbei.', fx:{st:-5, rel:{kalle:1, lena:1}}}},
   {t:'Ablehnen', out:{t:'Verständlich. Er fragt jemand anderen.', fx:{}}},
  ]},
 // Teilstreitkräfte (zweiter Schwung)
 {id:'h_biwak', who:'dennis', tsk:'heer', ctx:['gelaende','uebung'], text:'Biwak im Regen. Du teilst das Zelt mit Dennis. Dennis schnarcht wie ein Schützenpanzer.',
  ch:[
   {t:'Ohrstöpsel aus dem Erste-Hilfe-Päckchen', roll:{stat:'fachwissen', base:45},
     ok:{t:'Taschentuch, zusammengerollt. Wirkt Wunder.', fx:{st:10}},
     fail:{t:'Das war das Pflaster. Es hilft nicht.', fx:{st:-10}}},
   {t:'Dennis sanft umdrehen', out:{t:'Er hört auf. Fünf Minuten lang.', fx:{st:-5, rel:{dennis:1}}}},
   {t:'Draußen unter der Plane schlafen', out:{t:'Ruhig, aber nass.', fx:{st:-8, bp:1}}},
  ]},
 {id:'lw_nebel', who:'kalle', tsk:'lw', ctx:['lw_flugplatz','lw_radar_d','lw_vorfeld'], text:'Dichter Nebel. Flugbetrieb eingestellt. Die ganze Staffel steht im Hangar und hat plötzlich Zeit.',
  ch:[
   {t:'Hangar-Fußball', out:{t:'Zwei Tore aus Werkzeugkisten, ein Ball aus Klebeband. Bestes Spiel des Jahres.', fx:{st:-5, rel:{kalle:3, lena:3}}}},
   {t:'Nachschulung am Simulator', out:{t:'Zwei Stunden sinnvoll genutzt. Der Staffelchef sieht es.', fx:{bp:4}}},
   {t:'Im Ruheraum schlafen', out:{t:'Der Nebel hält bis Mittag. Du auch.', fx:{st:15}}},
  ]},
 {id:'m_aequator', who:'spiess', tsk:'marine', ctx:['m_seewache'], text:'Äquatortaufe! Neptun persönlich kommt an Bord. Er trägt einen Bart aus Tauwerk und klingt verdächtig nach Brockmann.',
  ch:[
   {t:'Tapfer durchziehen', roll:{stat:'fitness', base:40},
     ok:{t:'Fischsud, Mehl und ein Bad im Taufbecken. Du bekommst deine Taufurkunde und einen Seemannsnamen.', fx:{bp:3, rel:{spiess:4}}},
     fail:{t:'Der Fischsud war mehr, als dein Magen erwartet hatte. Urkunde gibt es trotzdem.', fx:{st:-15, rel:{spiess:2}}}},
   {t:'Sich drücken', out:{t:'Neptun findet dich trotzdem. Er findet jeden.', fx:{st:-5, rel:{spiess:-3}}}},
  ]},
 {id:'m_gangway', who:'chef', tsk:'marine', ctx:['m_hafenwache'], text:'An der Gangway taucht unangekündigt ein Admiral mit Gefolge auf. Du bist allein auf Wache.',
  ch:[
   {t:'Vorschriftsmäßig melden und pfeifen', roll:{stat:'fachwissen', base:40},
     ok:{t:'Bootsmannsmaatenpfeife, Meldung, Haltung. Der Admiral nickt dir zu.', fx:{bp:6, rel:{chef:3}}},
     fail:{t:'Die Pfeife quietscht. Der Admiral lächelt höflich.', fx:{bp:-1}}},
   {t:'Schnell den Wachhabenden holen', out:{t:'Korrekt, aber der Admiral steht zwei Minuten allein an der Gangway.', fx:{bp:1}}},
  ]},

 // Teilstreitkr\u00e4fte
 {id:'lw_kranich', who:'spiess', tsk:'lw', ctx:['lw_vorfeld','lw_flugplatz'], text:'Ein Kranich steht mitten auf der Startbahn. In zehn Minuten landet eine Maschine. Der Kranich sieht nicht aus, als h\u00e4tte er Termine.',
  ch:[
   {t:'Vorsichtig verscheuchen', roll:{stat:'fitness', base:45},
     ok:{t:'Mit ausgebreiteten Armen und viel W\u00fcrde. Der Kranich geht, die W\u00fcrde bleibt.', fx:{bp:5}},
     fail:{t:'Der Kranich verscheucht dich.', fx:{bp:-2, rel:{kalle:2}}}},
   {t:'Den Tower informieren', out:{t:'Die Landung wird verschoben, der Kranich bekommt eine Eskorte und du ein Lob.', fx:{bp:3, rel:{spiess:2}}}},
   {t:'Ein Foto machen', out:{t:'Das Foto geht durch die ganze Staffel. Der Kranich ist jetzt Maskottchen.', fx:{rel:{kalle:3, dennis:2}}}},
  ]},
 {id:'lw_laerm', who:'chef', tsk:'lw', text:'Eine Anwohnerin steht am Tor und beschwert sich \u00fcber Flugl\u00e4rm. Sie hat eine Liste mitgebracht. Mit Uhrzeiten.',
  ch:[
   {t:'Geduldig zuh\u00f6ren', roll:{stat:'fuehrung', base:35},
     ok:{t:'Nach einer Stunde ist sie bes\u00e4nftigt und l\u00e4dt dich zum Kuchen ein.', fx:{bp:5, rel:{chef:3}}},
     fail:{t:'Nach einer Stunde hat sie eine zweite Liste.', fx:{bp:1}}},
   {t:'An die Pressestelle verweisen', out:{t:'Korrekt und folgenlos. Sie kommt n\u00e4chste Woche wieder.', fx:{bp:1}}},
  ]},
 {id:'m_seekrank', who:'dennis', tsk:'marine', ctx:['m_seewache'], text:'Erste Seewache bei Windst\u00e4rke sieben. Dein Magen ist mit der Gesamtsituation nicht einverstanden.',
  ch:[
   {t:'Tapfer durchhalten', roll:{stat:'fitness', base:40},
     ok:{t:'Du stehst die ganze Wache durch. Der Kommandant nickt dir zu.', fx:{bp:6}},
     fail:{t:'Die Reling und du, ihr seid jetzt eng befreundet.', fx:{st:-20}}},
   {t:'Zwieback aus der Komb\u00fcse holen', out:{t:'Hilft. Ein bisschen. Dennis isst daneben ein Mettbr\u00f6tchen.', fx:{bp:2, st:5}}},
  ]},
 {id:'m_moewe', who:'kalle', tsk:'marine', ctx:['m_hafenwache','m_reinschiff'], text:'Eine M\u00f6we landet neben dir an der Gangway und schaut sehr interessiert auf dein Fischbr\u00f6tchen.',
  ch:[
   {t:'Das Br\u00f6tchen verteidigen', roll:{stat:'fitness', base:40},
     ok:{t:'Gewonnen. Die M\u00f6we merkt sich dein Gesicht.', fx:{bp:1}},
     fail:{t:'Die M\u00f6we ist schneller. Kalle hat alles gefilmt.', fx:{rel:{kalle:3}}}},
   {t:'Teilen', out:{t:'Die M\u00f6we kommt ab jetzt jeden Tag. Mit Freunden.', fx:{st:5}}},
  ]},
 {id:'m_landgang', who:'lena', tsk:'marine', text:'Landgang in einem fremden Hafen. Lena will ins Museum, Kalle in die Hafenkneipe.',
  ch:[
   {t:'Mit Lena ins Museum', out:{t:'Seefahrt im 17. Jahrhundert. Lena ist begeistert, du ehrlich gesagt auch.', fx:{bp:2, rel:{lena:6}}}},
   {t:'Mit Kalle in die Hafenkneipe', roll:{stat:'vitaminb', base:45},
     ok:{t:'Kalle kennt den Wirt. Nat\u00fcrlich.', fx:{money:-40, rel:{kalle:6}}},
     fail:{t:'Die Rechnung ist h\u00f6her als gedacht.', fx:{money:-80, rel:{kalle:2}}}},
  ]},
 {id:'mx_sturm', who:'chef', ctx:['ex'], text:'Sturm im Einsatzgebiet. Das Schiff stampft, in der Messe fliegt das Geschirr.',
  ch:[
   {t:'Alles seefest zurren', roll:{stat:'fachwissen', base:40},
     ok:{t:'Nichts geht zu Bruch. Der Smut ist dir ewig dankbar.', fx:{ep:4}},
     fail:{t:'Die Kaffeemaschine geht fast \u00fcber Bord.', fx:{ep:1}}},
   {t:'In die Koje und abwarten', out:{t:'Du schl\u00e4fst erstaunlich gut. Wie in einer Wiege, nur lauter.', fx:{ep:1, st:10}}},
  ]},
 {id:'mx_kombuese', who:'kalle', ctx:['ex'], text:'Der Smut ist krank, und irgendwer muss f\u00fcr zweihundert Leute kochen.',
  ch:[
   {t:'Den Kochl\u00f6ffel \u00fcbernehmen', roll:{stat:'fachwissen', base:35},
     ok:{t:'Labskaus f\u00fcr alle, und es gibt Schlangen f\u00fcr Nachschlag.', fx:{ep:4, rel:{kalle:3}}},
     fail:{t:'Die Nudeln sind al dente. Sehr al dente.', fx:{ep:1}}},
   {t:'Dennis vorschlagen', out:{t:'Dennis kocht Ravioli aus der Dose. F\u00fcr zweihundert.', fx:{ep:1, rel:{dennis:-4}}}},
  ]},
 {id:'mx_mann', who:'spiess', ctx:['ex'], text:'\u00dcbung \u201eMann \u00fcber Bord\u201c. Die Puppe hei\u00dft Oskar und ist diese Woche schon zum dritten Mal im Wasser.',
  ch:[
   {t:'Als Erster am Rettungsring', roll:{stat:'fitness', base:40},
     ok:{t:'Oskar ist gerettet. Wieder.', fx:{ep:3}},
     fail:{t:'Du wirfst den Ring zielsicher neben Oskar.', fx:{ep:1}}},
   {t:'Ausguck halten und melden', out:{t:'Saubere Meldung, saubere Peilung. Lehrbuch.', fx:{ep:2}}},
  ]},
 {id:'mx_heim', who:'spiess', ctx:['ex'], einsatzEnd:true, text:'Einlaufen in den Heimathafen. Auf der Pier stehen Familien, ein Musikkorps und ganz vorne Brockmann.',
  ch:[
   {t:'Brockmann die Hand geben', out:{t:'Ein fester H\u00e4ndedruck. \u201eGut, dass Sie wieder da sind.\u201c', fx:{ep:2, rel:{spiess:6}}}},
   {t:'Erst mal ausschlafen, ohne Seegang', out:{t:'Vierzehn Stunden. Das Bett schwankt trotzdem noch.', fx:{ep:1, st:30}}},
   {t:'Allen ein Andenken mitbringen', out:{t:'Kalle bekommt eine Buddel, Lena ein Fernglas, Dennis ein Kissen in Fischform.', fx:{ep:2, money:-60, rel:{kalle:4, lena:4, dennis:4}}}},
  ]},
 {id:'lx_alarm', who:'chef', ctx:['ex'], text:'Alarmrotte! Zwei Maschinen m\u00fcssen in Minuten in der Luft sein, und du stehst am Vorfeld.',
  ch:[
   {t:'Ruhig die Checkliste abarbeiten', roll:{stat:'fachwissen', base:40},
     ok:{t:'Beide Maschinen starten p\u00fcnktlich. Der Kommodore hat es gesehen.', fx:{ep:4}},
     fail:{t:'Ein Bremskeil liegt noch da. Gerade noch gesehen.', fx:{ep:1}}},
   {t:'Rennen', roll:{stat:'fitness', base:45},
     ok:{t:'Du bist \u00fcberall gleichzeitig. Startfreigabe in Rekordzeit.', fx:{ep:3}},
     fail:{t:'Du stolperst \u00fcber ein Kabel. Die Maschinen starten trotzdem.', fx:{ep:0}}},
  ]},

 // Ereignisse f\u00fcr h\u00f6here Dienstgradgruppen
 {id:'u_heimweh', who:'spiess', groups:['U','F'], text:'Ein Rekrut aus deiner Gruppe sitzt abends allein auf der Treppe. Heimweh. Er will hinschmeißen.',
  ch:[
   {t:'Zuhören und ihm Mut machen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Am nächsten Morgen steht er als Erster beim Antreten.', fx:{bp:5, rel:{spiess:4}}},
     fail:{t:'Er bleibt. Vorerst. Bis Freitag will er es sich noch überlegen.', fx:{bp:1}}},
   {t:'Ihn zum Spieß schicken', out:{t:'Brockmann seufzt: „Dafür haben Sie doch Ihre Schulterklappen.“', fx:{bp:1, rel:{spiess:-2}}}},
   {t:'Ihm einen Döner von Kalle organisieren', out:{t:'Mit vollem Bauch sieht die Welt anders aus. Er bleibt.', fx:{money:-8, bp:3, rel:{kalle:2}}}},
  ]},
 {id:'u_inventur', who:'kalle', groups:['F'], text:'Materialprüfung: Laut Liste fehlen drei Spaten, ein Tarnnetz und ein Kanister. Kalle schaut verdächtig unschuldig.',
  ch:[
   {t:'Kalle direkt fragen', roll:{stat:'vitaminb', base:40},
     ok:{t:'Zehn Minuten später ist alles wieder da. Plus ein Kanister zu viel.', fx:{bp:4, rel:{kalle:2}}},
     fail:{t:'Kalle weiß von nichts. Die Liste bleibt falsch.', fx:{bp:-3}}},
   {t:'Eine Fehlmeldung schreiben', out:{t:'Korrekt. Kalle grüßt dich ab jetzt sehr förmlich.', fx:{bp:2, rel:{kalle:-5}}}},
   {t:'Die Liste kreativ anpassen', roll:{stat:'fachwissen', base:30},
     ok:{t:'Niemandem fällt es auf. Bis zur nächsten Prüfung.', fx:{bp:1}},
     fail:{t:'Brockmann zählt nach.', fx:{bp:-8, rel:{spiess:-8}}}},
  ]},
 {id:'a_offizierheim', who:'chef', groups:['A'], text:'Als Offizieranwärter isst du jetzt im Offizierheim. Am Tisch geht es um Rotwein. Ein Oberst fragt nach deiner Meinung zu einem bestimmten Weingut.',
  ch:[
   {t:'Ehrlich sagen: keine Ahnung', out:{t:'Der Oberst lacht laut. Ehrlichkeit kommt hier gut an.', fx:{bp:1, rel:{chef:2}}}},
   {t:'Irgendwas Kluges erfinden', roll:{stat:'vitaminb', base:35},
     ok:{t:'„Ein Kenner!“ Du wirst zur nächsten Weinprobe eingeladen.', fx:{bp:3, rel:{chef:5}}},
     fail:{t:'Das Weingut gehört dem Schwager des Obersts. Es liegt nicht in Frankreich.', fx:{rel:{chef:-4}}}},
  ]},
 {id:'o_vertretung', who:'chef', groups:['O'], text:'Hauptmann von Ahlen fährt in den Urlaub. „Sie vertreten mich. Ich habe eine kleine Übergabe vorbereitet.“ Die Übergabe hat 46 Folien.',
  ch:[
   {t:'Alles durcharbeiten', out:{t:'Du kennst jetzt jede Folie. Von Ahlen ist bei der Rückkehr gerührt.', fx:{st:-20, bp:8, rel:{chef:5}}}},
   {t:'Nur die Zusammenfassung lesen', roll:{stat:'fuehrung', base:35},
     ok:{t:'Folie 46 war ohnehin die einzig wichtige.', fx:{bp:6}},
     fail:{t:'Ausgerechnet Folie 23 hätte man lesen sollen.', fx:{bp:-4}}},
   {t:'Brockmann fragen, was wirklich wichtig ist', out:{t:'„Drei Dinge.“ Brockmann hatte mit allen dreien recht.', fx:{bp:5, rel:{spiess:5}}}},
  ]},
 {id:'o_beschaffung', who:'chef', groups:['O','G'], text:'Vor anderthalb Jahren hast du neue Stühle für den Besprechungsraum beantragt. Heute kommt die Antwort: Der Antrag muss auf dem neuen Formular neu gestellt werden.',
  ch:[
   {t:'Neu beantragen', out:{t:'Die Stühle kommen. Irgendwann.', fx:{bp:2, st:-5}}},
   {t:'Kalle fragen', out:{t:'Am nächsten Morgen stehen zwölf neue Stühle im Raum. Mit Inventarnummern einer anderen Kaserne.', fx:{money:-50, rel:{kalle:5}}}},
   {t:'Eine Beschwerde schreiben', roll:{stat:'fachwissen', base:40},
     ok:{t:'Deine Beschwerde ist so präzise, dass sie im Ministerium als Vorlage dient.', fx:{bp:5}},
     fail:{t:'Auch die Beschwerde muss auf das neue Formular.', fx:{bp:-2}}},
  ]},
 {id:'o_weihnachten', who:'spiess', groups:['O'], minT:12, text:'Als Kompaniechef hältst du die Rede beim Weihnachtsessen. Die Kompanie hat schon zwei Glühwein intus.',
  ch:[
   {t:'Kurz und herzlich', roll:{stat:'fuehrung', base:40},
     ok:{t:'Drei Sätze, echter Applaus. Lena wischt sich verstohlen über die Augen.', fx:{bp:4, rel:{spiess:5, kalle:3, lena:3}}},
     fail:{t:'Zu kurz. Jemand ruft „Zugabe!“, und es klingt nicht nett.', fx:{rel:{spiess:-2}}}},
   {t:'Mit Folien', out:{t:'Von Ahlen ist begeistert. Alle anderen nicht.', fx:{rel:{chef:6, kalle:-4, lena:-4}}}},
   {t:'Brockmann das Wort geben', out:{t:'Brockmann erzählt die Geschichte mit der Socke. Die Kompanie tobt.', fx:{rel:{spiess:8}}}},
  ]},
 {id:'g_presse', who:'chef', groups:['G'], text:'Pressetermin auf dem Übungsplatz. Eine Journalistin fragt, warum der Schützenpanzer im Hintergrund nicht fährt.',
  ch:[
   {t:'Ehrlich antworten', roll:{stat:'fuehrung', base:40},
     ok:{t:'Klare Worte. Der Artikel ist fair.', fx:{bp:6}},
     fail:{t:'Du sagst etwas zu viel. Das Ministerium ruft an.', fx:{bp:-3}}},
   {t:'„Das ist eine taktische Pause.“', roll:{stat:'vitaminb', base:35},
     ok:{t:'Die Journalistin lacht. Das Zitat wird berühmt.', fx:{bp:4}},
     fail:{t:'Das Zitat wird berühmt. Leider.', fx:{bp:-5}}},
   {t:'Auf den Pressesprecher verweisen', out:{t:'Sicher, langweilig, folgenlos.', fx:{bp:1}}},
  ]},
 {id:'g_kantine', who:'kalle', groups:['G'], text:'Truppenbesuch. Du willst mit den Soldaten in der Truppenküche essen statt im Offizierheim. An der Kasse steht Kalle. Er ist jetzt Kantinenpächter.',
  ch:[
   {t:'Bei Kalle essen', out:{t:'Kalle serviert persönlich. Das Schnitzel ist zum ersten Mal nicht grau.', fx:{st:10, rel:{kalle:10}}}},
   {t:'Das Protokoll einhalten', out:{t:'Im Offizierheim ist das Essen besser. Die Stimmung nicht.', fx:{rel:{chef:3, kalle:-3}}}},
  ]},

 // Auslandseinsatz (fx.ep = Einsatzpunkte)
 {id:'ex_container', who:'dennis', ctx:['ex'], text:'Dein Container für die nächsten Wochen: zwei Betten, ein Spind und eine Klimaanlage mit zwei Stufen, aus und Orkan. Dennis liegt schon im unteren Bett.',
  ch:[
   {t:'Klimaanlage auf Orkan', roll:{stat:'fitness', base:50},
     ok:{t:'Endlich kühl. Du schläfst wie ein Stein.', fx:{ep:2, st:10}},
     fail:{t:'Eine Erkältung bei 38 Grad Außentemperatur. Respekt.', fx:{st:-10}}},
   {t:'Mit Dennis ums Bett würfeln', roll:{stat:'vitaminb', base:50},
     ok:{t:'Unteres Bett. Dennis zieht murrend nach oben.', fx:{ep:1, rel:{dennis:-2}}},
     fail:{t:'Dennis gewinnt und schläft sofort wieder ein.', fx:{rel:{dennis:2}}}},
   {t:'Freiwillig oben schlafen', out:{t:'Dennis bedankt sich mit einem Schokoriegel aus seinem Geheimvorrat.', fx:{ep:1, rel:{dennis:4}}}},
  ]},
 {id:'ex_wlan', who:'kalle', ctx:['ex'], text:'Das WLAN im Betreuungscontainer schafft genau einen Videoanruf gleichzeitig. Die Schlange ist lang.',
  ch:[
   {t:'Anstellen', out:{t:'Nach zwei Stunden: fünf Minuten Videoanruf. Das Bild friert ein, aber zu Hause lacht jemand.', fx:{ep:1, st:-5}}},
   {t:'Kalle fragen', out:{t:'Kalle hat einen eigenen Router „organisiert“. Woher, bleibt sein Geheimnis.', fx:{ep:1, money:-20, rel:{kalle:4}}}},
   {t:'Einen Brief schreiben', out:{t:'Die Feldpost braucht drei Wochen. Dafür kommt eine Antwort mit Zeichnung zurück.', fx:{ep:2}}},
  ]},
 {id:'ex_hitze', who:'lena', ctx:['ex'], text:'42 Grad im Schatten, und es gibt keinen Schatten. Lena will trotzdem morgens um fünf laufen gehen.',
  ch:[
   {t:'Mitlaufen', roll:{stat:'fitness', base:35},
     ok:{t:'Sonnenaufgang über dem Lager, zehn Kilometer. Fast schön.', fx:{ep:2, rel:{lena:4}}},
     fail:{t:'Nach drei Kilometern trinkst du die ganze Wasserflasche auf einmal.', fx:{st:-15, rel:{lena:2}}}},
   {t:'Ausschlafen', out:{t:'Lena kommt verschwitzt zurück und sagt nichts. Das sagt genug.', fx:{st:10, rel:{lena:-2}}}},
  ]},
 {id:'ex_sprachmittler', who:'chef', ctx:['ex'], text:'Bei der Ausbildung der Partnersoldaten übersetzt ein Sprachmittler. Nach zehn Minuten merkst du: Deine Witze kommen nicht an. Seine schon.',
  ch:[
   {t:'Mit ihm als Team arbeiten', out:{t:'Ihr spielt euch die Bälle zu. Am Ende lachen alle, sogar über deine Witze.', fx:{ep:3}}},
   {t:'Selbst ein paar Wörter lernen', roll:{stat:'fachwissen', base:40},
     ok:{t:'Die Partnersoldaten sind beeindruckt und bringen dir noch mehr bei.', fx:{ep:4}},
     fail:{t:'Du hast versehentlich „Ziege“ statt „Ziel“ gesagt. Den ganzen Vormittag lang.', fx:{ep:1}}},
  ]},
 {id:'ex_besuch', who:'chef', ctx:['ex'], text:'Besuch aus dem Ministerium hat sich angekündigt. Das ganze Feldlager wird gefegt. Auch der Sand.',
  ch:[
   {t:'Eine Vorführung planen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Die Vorführung läuft perfekt. Der Besuch macht Fotos.', fx:{ep:3, bp:4}},
     fail:{t:'Bei der Vorführung fällt der Strom aus.', fx:{bp:-2}}},
   {t:'Ganz normal weiterarbeiten', out:{t:'Der Besuch findet das erfrischend ehrlich.', fx:{ep:2}}},
   {t:'Den Sand fegen', out:{t:'Der Wind macht die Arbeit in zwanzig Minuten rückgängig.', fx:{ep:1, st:-15}}},
  ]},
 {id:'ex_post', who:'dennis', ctx:['ex'], text:'Feldpost! Dennis bekommt ein Paket von seiner Oma. Inhalt: zwölf Gläser Gurken und Wollsocken.',
  ch:[
   {t:'Einen Gurkentausch anbieten', out:{t:'Für zwei Gläser Gurken gibt es deinen Kaffee-Vorrat. Fairer Handel.', fx:{ep:1, rel:{dennis:3}}}},
   {t:'Auf dein eigenes Paket warten', out:{t:'Zwei Tage später kommt es. Inhalt: deine Lieblingsschokolade, geschmolzen.', fx:{ep:1}}},
  ]},
 {id:'ex_konvoi', who:'chef', ctx:['ex'], text:'Beim Konvoi bleibt ein Lkw liegen. Die Kolonne steht, und bis zur Dunkelheit bleibt noch eine Stunde.',
  ch:[
   {t:'Selbst reparieren', roll:{stat:'fachwissen', base:35},
     ok:{t:'Ein lockeres Kabel. Fünf Minuten, dann geht es weiter.', fx:{ep:4}},
     fail:{t:'Abschleppen. Ankunft nach Mitternacht.', fx:{st:-10}}},
   {t:'Abschleppen lassen', out:{t:'Langsam, aber nach Vorschrift.', fx:{ep:2}}},
   {t:'Die Ladung umverteilen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Alle packen mit an. Nach zwanzig Minuten rollt die Kolonne wieder.', fx:{ep:3}},
     fail:{t:'Am Ende passt nicht alles rein. Ein Kanister fehlt bis heute.', fx:{ep:1}}},
  ]},
 {id:'ex_heimweh', who:'lena', ctx:['ex'], text:'Abends am Container. Lena sitzt still da: Zu Hause ist heute ein Geburtstag, den sie verpasst.',
  ch:[
   {t:'Dazusetzen und zuhören', out:{t:'Ihr redet bis Mitternacht. Am nächsten Tag geht es ihr besser.', fx:{ep:2, rel:{lena:6}}}},
   {t:'Eine kleine Überraschungsfeier organisieren', roll:{stat:'vitaminb', base:40},
     ok:{t:'Kalle besorgt einen Kuchen. Niemand fragt, woher.', fx:{ep:3, rel:{lena:10, kalle:3}}},
     fail:{t:'Der Kuchen ist ein Müsliriegel mit Kerze. Lena lacht trotzdem.', fx:{ep:1, rel:{lena:4}}}},
  ]},
 {id:'ex_grill', who:'kalle', ctx:['ex'], text:'Sonntag im Feldlager: Kalle will grillen. Der Grill ist ein halbiertes Ölfass, die Kohle ist „organisiert“.',
  ch:[
   {t:'Grillmeister werden', roll:{stat:'fitness', base:50},
     ok:{t:'Perfekte Würstchen. Das halbe Lager kommt vorbei.', fx:{ep:2, rel:{kalle:4}}},
     fail:{t:'Außen schwarz, innen gefroren. Kalle isst sie trotzdem.', fx:{rel:{kalle:1}}}},
   {t:'Salat beisteuern', out:{t:'Der einzige Salat im Umkreis von 200 Kilometern. Lena ist begeistert.', fx:{ep:1, rel:{lena:2}}}},
  ]},
 {id:'ex_heim', who:'spiess', ctx:['ex'], einsatzEnd:true, text:'Rückverlegung. Nach der Landung wartet die Kompanie, Brockmann vorneweg. Er sagt nur: „Gut, dass Sie wieder da sind.“',
  ch:[
   {t:'Brockmann die Hand geben', out:{t:'Ein fester Händedruck. Mehr muss keiner sagen.', fx:{ep:2, rel:{spiess:6}}}},
   {t:'Erst mal ausschlafen', out:{t:'Vierzehn Stunden. Ohne Klimaanlage, ohne Sand.', fx:{ep:1, st:30}}},
   {t:'Allen ein Andenken mitbringen', out:{t:'Kalle bekommt einen Teppich, Lena ein Lauftrikot, Dennis ein Kissen. Alle freuen sich.', fx:{ep:2, money:-60, rel:{kalle:4, lena:4, dennis:4}}}},
  ]},

 // Lehrgangs-Kapitel (werden während eines Lehrgangs der Reihe nach ausgelöst, fx.lg = Lehrgangspunkte)
 {id:'lg_ual1', who:'krueger', ctx:['lg'], text:'Erste Führungsübung: Du sollst eine Gruppe über die Hindernisbahn führen. Die Gruppe besteht aus Leuten, die dich gestern noch „Kumpel“ genannt haben.',
  ch:[
   {t:'Klare Ansagen machen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Nach der ersten Ansage läuft es. Krüger notiert etwas und nickt.', fx:{lg:4, rel:{krueger:3}}},
     fail:{t:'Deine Ansage geht im Gelächter unter. Die Gruppe läuft trotzdem, nur in drei Richtungen.', fx:{lg:0}}},
   {t:'Vormachen und mitlaufen', roll:{stat:'fitness', base:50},

/* =========================================================
   STORY: Staffel 1 – Der letzte Sommer des Spießes

  text:'Dennis stolpert in die Stube, plötzlich hellwach. „Ich hab’s im Geschäftszimmer gehört. Brockmann geht im Sommer in Pension. Mit Urkunde und allem.“ Kalle lässt vor Schreck eine Dose Energy fallen.',
  ch:[

 {id:'s1_05', story:5, title:'Lenas großer Plan', who:'lena',
  text:'Lena sitzt mit drei Ordnern auf dem Bett. „Ich bewerbe mich für die Offizierlaufbahn. Dafür brauche ich eine Stellungnahme vom Spieß. Aber Brockmann denkt gerade nur an sein Notizbuch. Hilfst du mir?“',

   {t:'Bei Brockmann ein gutes Wort einlegen', minRel:{spiess:10}, out:{t:'Brockmann hört zu und notiert etwas auf einem Zettel. „Brandt. Gute Soldatin. Wird erledigt.“', fx:{rel:{lena:10, spiess:1}, flag:'s1_lena_hilfe'}}},

 {id:'s1_06', story:6, title:'Dennis’ Geheimnis', who:'dennis',
  text:'Drei Uhr nachts. Unter Dennis’ Decke leuchtet ein Laptop, er tippt wie besessen. Als er dich bemerkt, klappt er ihn zu. „Okay. Ich schreibe einen Roman. Neunhundert Seiten, Fantasy. Deshalb bin ich immer so müde.“',
  ch:[
   {t:'„Darf ich mal reinlesen?“', out:{t:'Die Hauptfigur heißt Feldwebel Brakemann, trägt einen schwarzen Umhang und kontrolliert Drachenhöhlen auf Staub. Es ist erschreckend gut.', fx:{rel:{dennis:8}, flag:'s1_roman'}}},
   {t:'„Dein Geheimnis ist bei mir sicher.“', out:{t:'Dennis atmet aus. „Danke. Wenn das rauskommt, liest Brockmann Kapitel sieben. Kapitel sieben handelt von ihm.“', fx:{rel:{dennis:5}, flag:'s1_roman'}}},

  ]},
 {id:'s1_07', story:7, title:'Die Spur führt zu Kalle', who:'kalle',
  text:'Kalle zieht dich in den Heizungskeller. „Ich hab das Notizbuch. Lag bei der Inventur zwischen den Feldjacken. Ich wollte es zurückbringen, dann hab ich reingeschaut.“ Er schluckt. „Da steht über jeden von uns was drin.“',
  alt:[{if:'s1_spur', text:'Kalle wartet schon im Heizungskeller. „Du weißt es eh, oder? Ja, ich hab das Notizbuch. Lag bei der Inventur zwischen den Feldjacken. Ich hab reingeschaut.“ Er schluckt. „Da steht über jeden von uns was drin.“'}],
  ch:[
   {t:'„Gib her. Ich bringe es anonym zurück.“', out:{t:'Am nächsten Morgen liegt das Notizbuch in Packpapier auf Brockmanns Schreibtisch. Er sagt den ganzen Tag kein Wort. Aber er pfeift.', fx:{rel:{kalle:6, spiess:3}, flag:'s1_anonym'}}},
   {t:'„Das bringst du selbst zurück.“', out:{t:'Kalle geht mit hängenden Schultern ins Geschäftszimmer. Zwanzig Minuten später kommt er raus, mit einem Monat Stubendienst und einem Grinsen.', fx:{bp:2, rel:{kalle:-2, spiess:6}, flag:'s1_beichte'}}},
   {t:'Erst mal selbst reinschauen', out:{t:'Über dich steht da eine einzige Zeile. Sie ist netter, als du erwartet hast. Auf der letzten Seite steht ein Gedicht. Du klappst das Buch schnell zu.', fx:{rel:{kalle:3}, flag:'s1_gelesen'}}},

 {id:'s1_08', story:8, title:'Generalprobe', who:'chef',

/* ---------- Logik ---------- */
const STORY_I = Object.fromEntries(STORY.map(e=>[e.id,e]));
EVENTS.push(...MORE_EVENTS, ...STORY);
function storyEnsure(){
  if(!S.story) S.story = {ch:0, next:0, d:0, log:[]};
  if(!S.funk) S.funk = [];
  if(!S.funkUsed) S.funkUsed = {};
  if(!S.seenAt) S.seenAt = {};
  if(!S.fsDone) S.fsDone = {};
  if(!S.fsRetry) S.fsRetry = {};
  if(S.fs === undefined) S.fs = null;
}
function evText(e){
  for(const a of (e.alt||[])) if(S.flags[a.if]) return a.text;
  return e.text;
}
function choiceOk(c){
  if(c.need && !S.flags[c.need]) return false;
  for(const [k,v] of Object.entries(c.minRel||{})) if(rel(k) < v) return false;
  return true;
}
function storyNext(){ storyEnsure(); return STORY[S.story.ch] || null; }
function storyTick(events){
  storyEnsure();
  const nx = storyNext();
  if(!nx || S.einsatz || S.pending.includes(nx.id)) return;
  if(S.story.ch > 0 && (now() < S.story.next || S.story.d < STORY_DIENSTE)) return;
  S.pending.unshift(nx.id);
  events.push('Neue Meldung von ' + NPCS[nx.who].short);
}
function storyDone(e, c, out){
  storyEnsure();
  S.story.log.push({id:e.id, c:c.t, o:out.t});
  S.story.ch = Math.max(S.story.ch, e.story);
  S.story.next = now() + STORY_GAP / (S.speed||1);
  S.story.d = 0;
}
function funkTick(events){
  storyEnsure();
  const today = dateStr();
  const n = S.funk.filter(x => x.day === today).length;
  if(n >= 4 || Math.random() > .45) return;
  const p = S.story.ch, gr = R[S.rank].g;
  const fkey = f => f.id + (f.when ? ':' + new Date().getFullYear() : '');
  const ok = FUNK.filter(f => !S.funkUsed[fkey(f)] && (!f.when || inWindow(f.when))
    && (!f.p || (p >= f.p[0] && p <= f.p[1]))
    && (!f.flag || S.flags[f.flag])
    && (!f.g || f.g.includes(gr))
    && Object.entries(f.rel||{}).every(([k,v]) => rel(k) >= v)
    && Object.entries(f.relMax||{}).every(([k,v]) => rel(k) <= v));
  if(!ok.length) return;
  // Story- und Beziehungsnachrichten zuerst, damit sie nicht verpasst werden
  const special = ok.filter(f => f.p || f.rel || f.relMax || f.flag || f.when);
  const pool = special.length && Math.random() < .6 ? special : ok;
  const f = pool[Math.floor(Math.random()*pool.length)];
  S.funkUsed[fkey(f)] = 1;
  S.funk.unshift({id:f.id, who:f.who, t:f.t, ts:now(), day:today});
  S.funk = S.funk.slice(0, 12);
  S.funkNew = (S.funkNew||0) + 1;
  events.push(NPCS[f.who].short + ': ' + f.t);
}
let STORY_OPEN = false;
function storyCard(){
  storyEnsure();
  const st = S.story, nx = storyNext(), total = STORY.length;
  let h = '';
  if(false){ h += '<div>';
  h += '<div class="prog" style="margin:2px 0 10px"><i style="width:' + Math.round(st.ch/total*100) + '%"></i></div>';
  if(!nx){
    h += '<p><b>Staffel abgeschlossen.</b> Brockmann bleibt, Krüger wartet, und Kalle züchtet Tomaten. Staffel 2 folgt mit einem der nächsten Updates.</p>';
  } else if(S.pending.includes(nx.id)){
    h += '<p><b>Kapitel ' + nx.story + ' von ' + total + ': ' + esc(nx.title) + '</b></p><button class="btn" data-act="event" data-id="' + nx.id + '">Weiterlesen</button>';
  } else if(st.ch === 0){
    h += '<p class="small">Gerüchte machen die Runde in der Kompanie. Das erste Kapitel beginnt nach deinem nächsten beendeten Dienst.</p>';
  } else {
    const wait = Math.max(0, st.next - now()), dl = Math.max(0, STORY_DIENSTE - st.d);
    h += '<p class="small"><b>Als Nächstes: Kapitel ' + nx.story + ' von ' + total + '.</b> '
      + (wait > 0 ? 'Frühestens in ' + fmtRest(wait) + (dl ? ' und' : '') + ' ' : '')
      + (dl ? 'nach ' + (dl === 1 ? 'einem weiteren Dienst' : dl + ' weiteren Diensten') : (wait > 0 ? '' : 'nach deinem nächsten Dienst')) + '.</p>';
  }
  if(st.log.length){
    h += '<button class="btn ghost" data-act="storybook" style="margin-top:10px">' + (STORY_OPEN ? 'Tagebuch schließen' : 'Tagebuch lesen (' + st.log.length + ')') + '</button>';
    if(STORY_OPEN) h += '<ol class="storylog">' + st.log.map(x => { const e = STORY_I[x.id]; return e ? '<li><b>' + esc(e.title) + '</b><div class="small muted">Du: ' + esc(x.c) + '</div><div class="small">' + esc(x.o) + '</div></li>' : ''; }).join('') + '</ol>';
  }
  h += '</div>'; }
  if(S.funk.length){
    h += '<h2>Stubenfunk</h2><div class="panel">' + S.funk.slice(0, 5).map(m => '<div class="row funk">' + npcBadge(m.who, 32)
      + '<div class="info" style="flex:1;min-width:0"><div class="title">' + esc(NPCS[m.who].short) + ' <span class="small muted">' + esc(fmtAgo(m.ts)) + '</span></div><div class="small">' + esc(m.t) + '</div></div></div>').join('') + '</div>';
    S.funkNew = 0;
  }
  return h;
}
function fmtAgo(ts){
  const m = Math.floor((now() - ts) / 60000);
  if(m < 1) return 'gerade eben';
  if(m < 60) return 'vor ' + m + ' Min.';
  const h = Math.floor(m / 60);
  if(h < 24) return 'vor ' + h + ' Std.';
  const d = Math.floor(h / 24);
  return d === 1 ? 'gestern' : 'vor ' + d + ' Tagen';
}

const SAISON = {

  fruehling:{name:'Frühling', temp:[4,19],  w:{sonne:3, wolken:3, regen:3, gewitter:1, nebel:1}},

};
function saisonHeute(d=new Date()){ const m = d.getMonth(); return m===11||m<=1 ? 'winter' : m<=4 ? 'fruehling' : m<=7 ? 'sommer' : 'herbst'; }
function wetterHeute(){
  const d = Math.floor(Date.now()/864e5), s = SAISON[saisonHeute()];
  const ent = Object.entries(s.w), sum = ent.reduce((a,[,v])=>a+v,0);
  let x = hnoise(d*17 + 5) * sum, id = ent[0][0];
  for(const [k,v] of ent){ if(x < v){ id = k; break; } x -= v; }
  let t = Math.round(s.temp[0] + hnoise(d*23 + 11) * (s.temp[1]-s.temp[0]));
  if(id==='schnee' || id==='frost') t = Math.min(t, -1);
  if(id==='hitze') t = Math.max(t, 30);
  if(id==='sonne' && saisonHeute()==='sommer') t = Math.max(t, 22);
  return Object.assign({id, temp:t, saison:saisonHeute()}, WETTER[id]);
}
function wxF(d, k){
  if(!OUT_IDS.includes(d.id)) return 1;
  const v = wetterHeute().fx[k]; return typeof v === 'number' ? v : 1;
}
function wxLock(d){
  if(!d.wx) return null;
  const w = wetterHeute();
  if(d.season && w.saison !== d.season) return 'nur im ' + SAISON[d.season].name;
  return d.wx.includes(w.id) ? null : 'nur bei ' + d.wx.map(x=>WETTER[x].name).join(' oder ');
}
function wxNote(d){
  if(!OUT_IDS.includes(d.id)) return '';
  const w = wetterHeute(); if(!Object.keys(w.fx).length) return '';
  return '<div class="wxnote small">Wetter: ' + esc(w.name) + ', ' + w.temp + ' °C</div>';
}
function wetterLine(){
  const w = wetterHeute(), ort = S.standort ? S.standort.ort : 'der Kaserne';
  return '<div class="wx"><div><div class="small muted">' + esc(SAISON[w.saison].name) + ', Wetter in ' + esc(ort) + '</div>'
    + '<div style="font-weight:700">' + esc(w.name) + ', ' + w.temp + ' °C</div><div class="small">' + esc(w.desc) + '</div></div></div>';
}
/* Feiertage und Jahreszeiten-Fenster für Meldungen */
function ostern(y){
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31), da=((h+l-7*m+114)%31)+1;
  return new Date(y, mo-1, da);
}
function inWindow(w, d=new Date()){
  const m = d.getMonth()+1, day = d.getDate(), md = m*100 + day;
  const easter = ostern(d.getFullYear()), diff = Math.round((new Date(d.getFullYear(), d.getMonth(), day) - easter)/864e5);
  switch(w){
    case 'winter': case 'fruehling': case 'sommer': case 'herbst': return saisonHeute(d) === w;
    case 'neujahr': return md >= 101 && md <= 106;
    case 'karneval': return diff >= -52 && diff <= -46;
    case 'ostern': return diff >= -3 && diff <= 1;
    case 'mai': return md >= 430 && md <= 501;
    case 'tdbw': return md >= 610 && md <= 620;
    case 'oktoberfest': return md >= 920 && md <= 1005;
    case 'halloween': return md >= 1029 && md <= 1031;
    case 'martin': return md >= 1108 && md <= 1111;
    case 'advent': return md >= 1127 && md <= 1217;
    case 'nikolaus': return md >= 1205 && md <= 1206;
    case 'weihnachten': return md >= 1218 && md <= 1226;
    case 'silvester': return md >= 1229 && md <= 1231;
  }
  return false;
}

/* Fahrzeug-Kontingent pro Tag und Routine-Abzug */
function dqUsed(id){ return S.dq && S.dq.day === dateStr() ? (S.dq.n[id] || 0) : 0; }
function dqAdd(id){ if(!S.dq || S.dq.day !== dateStr()) S.dq = {day:dateStr(), n:{}}; S.dq.n[id] = (S.dq.n[id] || 0) + 1; }
function rtF(d){ if(!S || d.einsatz || !S.rt || S.rt.id !== d.id) return 1; return Math.max(.6, 1 - .1*Math.max(0, S.rt.n - 1)); }
function rtAdd(id){ if(S.rt && S.rt.id === id) S.rt.n++; else S.rt = {id, n:1}; }
function rtNote(d){ const f = rtF(d); return f < 1 ? '<div class="wxnote small">Routine: −' + Math.round((1 - f)*100) + ' % Verdienst. Ein anderer Dienst setzt das zurück.</div>' : ''; }
function fsCost(x){ return Math.round(x.cost * (S.fsRetry && S.fsRetry[x.id] ? .5 : 1) * (vb()==='kfz' ? .8 : 1)); }
function fsMin(x){ return x.min * (S.fsRetry && S.fsRetry[x.id] ? .5 : 1) * (vb()==='kfz' ? .7 : 1); }
function fsHas(id){ return !!(S.fsDone && S.fsDone[id]); }
// Ab Besoldungsstufe 6 nur Unteroffiziere mit Portepee und Offiziere (Korporal und Stabskorporal sind Mannschaften)
function fsRangOk(t){ const r = G.rank(); return r.t >= t && !(t >= 6 && r.g === 'M'); }
function fsRangName(t){
  if(t >= 6) return (RANKS.find(r => r.t === t && r.g === 'F') || RANKS.find(r => r.t >= t && r.g !== 'M')).name;
  return [...new Set(RANKS.filter(r => r.t === t && (r.g === 'M' || r.g === 'U')).map(r => r.name))].join(' oder ');
}
function fsReqs(x){
  const out = [];
  if(x.need) out.push({label:'Führerschein ' + FS_I[x.need].name, ok:fsHas(x.need)});
  if(x.t) out.push({label:'Dienstgrad ab ' + fsRangName(x.t), ok:fsRangOk(x.t)});
  if(x.off) out.push({label:'Offizier oder Offizieranwärter', ok:['A','O','G'].includes(G.rank().g)});
  if(x.note) out.push({label:'Beurteilung „' + NOTES[x.note] + '“', ok:G.note() <= x.note});
  return out;
}
function fsStart(id){
  const x = FS_I[id]; S.fsDone = S.fsDone || {};
  if(!x || (x.tsk && x.tsk !== S.tsk)) return 'Nicht verfügbar.';
  if(S.fs) return 'Es läuft schon eine Fahrausbildung.';
  if(fsHas(id)) return 'Führerschein schon vorhanden.';
  if(!fsReqs(x).every(r=>r.ok)) return 'Voraussetzungen fehlen.';
  const c = fsCost(x); if(S.money < c) return 'Zu wenig Geld.';
  S.money -= c; lottoAdd(c);
  S.fs = {id, start:now(), end:now() + fsMin(x)*60000/S.speed, exam:false};
  return null;
}
function fsTick(events){
  if(S.fs && !S.fs.exam && !S.fs.stage && now() >= S.fs.end){
    S.fs.stage = 'theorie';
    events.push('Theorieprüfung ' + FS_I[S.fs.id].name + ' wartet');
    return true;
  }
  return false;
}
function renderFahrschule(){
  S.fsDone = S.fsDone || {};
  let h = '<h2>Fahrschule</h2><p class="small muted">Führerscheine laufen parallel zu Ausbildung, Lehrgang und Dienst. Jeder Schein schaltet neue Fahrdienste frei.'
    + (vb()==='kfz' ? ' Als Kraftfahrer bist du 30 % schneller und zahlst 20 % weniger.' : '') + '</p>';
  const card = x => {
    const done = fsHas(x.id), run = S.fs && S.fs.id === x.id, reqs = fsReqs(x), ok = reqs.every(r=>r.ok), c = fsCost(x);
    const frei = DIENSTE.filter(d => d.fs === x.id).map(d => d.name).join(', ');
    let inner = '<p class="flv">' + esc(x.desc) + '</p>' + (frei ? '<p class="eff">Schaltet frei: ' + esc(frei) + '</p>' : '');
    if(done) inner += '<div class="stamp good small-stamp" style="margin:8px auto 2px;font-size:17px">BESTANDEN</div>';
    else if(run) inner += '<div class="small">' + (S.fs.stage === 'theorie' ? '<button class="btn wide" data-act="fsquiz">Theorieprüfung ablegen</button>' : S.fs.exam ? 'Die praktische Prüfung wartet in den Meldungen.' : 'Theorieprüfung in <span class="num" data-left="fs"></span>') + '</div><div class="prog" style="margin:0"><i data-prog="fs"></i></div>';
    else inner += facts([['Dauer', fmtMin(fsMin(x)/S.speed)], ['Kosten', eur(c)]]) + (reqs.length ? reqMini(reqs) : '')
      + (S.fsRetry && S.fsRetry[x.id] ? '<div class="small muted">Wiederholung zum halben Preis</div>' : '')
      + '<button class="btn wide" data-act="fs" data-id="' + x.id + '" ' + ((!ok || S.fs || S.money < c) ? 'disabled' : '') + '>Anmelden<small>' + eur(c) + '</small></button>';
    return acard(x.name + ' · ' + x.sub, x.art, inner, run);
  };
  const basis = FAHRSCHULE.filter(x => !x.tsk), lauf = FAHRSCHULE.filter(x => x.tsk === S.tsk).sort((a, b) => a.cost - b.cost);
  const TN = {heer:'Heer', lw:'Luftwaffe', marine:'Marine'}[S.tsk || 'heer'];
  h += '<h3 class="fsgrp">Grundscheine für alle</h3><div class="cards">' + basis.map(card).join('') + '</div>';
  h += '<h3 class="fsgrp">Laufbahn ' + TN + '</h3><p class="small muted" style="margin:0 0 8px">Eigene Fahrzeuge und Luftfahrzeuge deiner Teilstreitkraft. Jede Stufe schaltet einen besser bezahlten Dienst frei, die höchsten Scheine gibt es nur für Offiziere.</p>'
    + '<div class="fsladder">' + lauf.map(x => '<span class="' + (fsHas(x.id) ? 'ok' : fsReqs(x).every(r => r.ok) ? 'frei' : '') + '">' + (fsHas(x.id) ? '✓ ' : x.off ? '★ ' : '') + esc(x.name) + '</span>').join('') + '</div>'
    + '<div class="cards">' + lauf.map(card).join('') + '</div>';
  return h;
}

const WA_TYPES = [

  {id:'dienste', ev:'dienst', n:[4,7,10], txt:n=>n+' Dienste beenden'},

];
function waWeek(d=new Date()){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return dateStr(x); }
function waEnsure(){
  const wk = waWeek();
  if(S.wa && S.wa.week === wk) return S.wa;
  const sold = G.rank().sold, types = WA_TYPES.slice().sort(() => Math.random() - .5);
  const list = [];
  for(const ty of types){
    if(list.length >= 3) break;
    const lvl = list.length;            // erster leicht, zweiter mittel, dritter schwer
    const w = {ty:ty.id, prog:0, done:false, claimed:false, lvl};
    if(ty.id === 'dienst_x'){
      const pool = DIENSTE.filter(d => !G.dienstLock(d) && !d.einsatz && !d.wx && !d.xmas && !(d.hideFor && d.hideFor.includes(G.rank().g)) && d.min <= 120);
      if(!pool.length) continue;
      w.d = pool[Math.floor(Math.random()*pool.length)].id;
    }
    w.goal = ty.money ? Math.round(ty.n[lvl] * sold * 2.5 / 10) * 10 : ty.n[lvl];
    w.money = Math.round(sold * [2, 3.5, 5][lvl]);
    w.bp = [3, 5, 8][lvl];
    list.push(w);
  }
  S.wa = {week:wk, list, bonus:false, intro:Math.floor(Math.random()*WA_INTRO.length)};
  return S.wa;
}
function waAdd(ev, v=1, extra){
  if(!S) return; const wa = waEnsure();
  for(const w of wa.list){
    if(w.done) continue;
    const ty = WA_TYPES.find(t => t.id === w.ty); if(!ty) continue;
    let hit = ty.ev === ev;
    if(ty.ev === 'dienst_x') hit = ev === 'dienst' && extra === w.d;
    if(ty.ev === 'draussen') hit = ev === 'dienst' && OUT_IDS.includes(extra);
    if(!hit) continue;

function waClaim(i){
  const wa = waEnsure(), w = wa.list[i]; if(!w || !w.done || w.claimed) return;

  let msg = 'Belohnung: ' + eur(w.money) + ' und ' + w.bp + ' Beurteilungspunkte';
  if(!wa.bonus && wa.list.every(x => x.claimed)){
    wa.bonus = true; S.pakete = Math.min(9, (S.pakete||0) + 1); G.addPoints(10);
    S.rel.spiess = Math.min(100, (S.rel.spiess||0) + 3);

function renderWA(){
  const wa = waEnsure();

  const open = wa.list.filter(w => w.done && !w.claimed).length;
  let h = '<h2>Wochenaufträge</h2><div class="panel pad wa">'
    + '<div class="evhead" style="margin-bottom:8px">' + npcBadge('spiess', 36) + '<div><div class="small muted">Hauptfeldwebel Brockmann</div><div class="small"><i>„' + esc(WA_INTRO[wa.intro] || WA_INTRO[0]) + '“</i></div></div></div>';
  h += wa.list.map((w, i) => {
    const ty = WA_TYPES.find(t => t.id === w.ty); if(!ty) return '';
    const pct = Math.round(w.prog / w.goal * 100);
    return '<div class="warow"><div class="wat"><b>' + esc(ty.txt(w.goal, w)) + '</b><span class="small muted">' + (ty.money ? eur(w.prog) + ' / ' + eur(w.goal) : w.prog + ' / ' + w.goal) + '</span></div>'
      + '<div class="prog" style="margin:4px 0"><i style="width:' + pct + '%"></i></div>'
      + '<div class="wab small"><span class="muted">' + eur(w.money) + ' · ' + w.bp + ' Punkte</span>'
      + (w.claimed ? '<span class="small"><b>✓ Erledigt</b></span>' : w.done ? '<button class="btn mini" data-act="wa" data-id="' + i + '">Abholen</button>' : '') + '</div></div>';
  }).join('');
  h += '<p class="small muted" style="margin:10px 0 0">' + (wa.bonus ? 'Wochenbonus abgeholt. ' : 'Alle drei erledigt: Bonus-Paket und 10 Punkte extra. ')
    + 'Neue Aufträge in ' + fmtRest(Math.max(0, end - Date.now())).replace(/\.$/, '') + '.</p></div>';
  if(open) S.waOpen = open;
  return h;
}
function waReady(){ return !!(S && S.wa && S.wa.week === waWeek() && S.wa.list.some(w => w.done && !w.claimed)); }

    {q:'Welcher UKW-Kanal ist im Seefunk für Not-, Dringlichkeits- und Anrufverkehr vorgesehen?', a:['Kanal 6','Kanal 16','Kanal 70','Kanal 72'], c:1},
  ]),
});
function fsFragen(id){
  const shuf = a => a.slice().sort(() => Math.random() - .5);
  const own = shuf(FS_FRAGEN[id] || []), extra = id === 'ce' ? FS_FRAGEN.c : id === 'kette' ? FS_FRAGEN.c : FS_FRAGEN.b;
  const n = (id === 'b' || own.length >= 5) ? 5 : Math.min(3, own.length);
  let qs = own.slice(0, n);
  if(qs.length < 5) qs = qs.concat(shuf(extra.filter(x => !qs.includes(x))).slice(0, 5 - qs.length));
  return qs.map(x => { const ord = shuf(x.a.map((t, i) => i)); return {q:x.q, opts:ord.map(i => ({t:x.a[i]})), c:ord.indexOf(x.c), right:x.a[x.c]}; });
}

/* ---------- Dienstgradtest ---------- */
function dgName(id){ return tskText(R[id].name); }
function dgFragen(pool){
  const shuf = a => a.slice().sort(() => Math.random() - .5);
  const ids = shuf(pool).slice(0, 5);
  return ids.map((id, k) => {
    const g = R[id].g, same = RANKS.filter(x => x.id !== id && x.g === g).map(x => x.id), other = RANKS.filter(x => x.id !== id && x.g !== g).map(x => x.id);
    const wrong = shuf(same).slice(0, 3), near = other.slice().sort((p, q) => Math.abs(R[p].t - R[id].t) - Math.abs(R[q].t - R[id].t));
    while(wrong.length < 3) wrong.push(near.find(x => !wrong.includes(x)));
    const opts = shuf([id, ...wrong]), c = opts.indexOf(id);
    if(k % 2 === 0) return {q:'Welcher Dienstgrad ist das?', html:'<div class="qzins">' + insignia(id, 64) + '</div>', opts:opts.map(x => ({t:dgName(x)})), c, right:dgName(id)};
    return {q:'Welches Abzeichen trägt ein ' + dgName(id) + '?', opts:opts.map(x => ({h:insignia(x, 40), t:dgName(x)})), grid:true, c, right:dgName(id)};
  });
}
function dgPool(){
  // In der Grundausbildung Mannschaften und Unteroffiziere, später alle Dienstgrade
  return RANKS.filter(x => (S.gaDone || x.g === 'M' || x.g === 'U' || x.g === 'F')).map(x => x.id);
}
function dgDue(){ return S.gaDone && S.dgNext && now() >= S.dgNext; }
function dgTick(events){
  if(!S.gaDone) return false;
  if(!S.dgNext){ S.dgNext = now() + 864e5 / S.speed; return true; }
  if(now() >= S.dgNext && !S.dgAnnounced){ S.dgAnnounced = true; events.push('Brockmann fragt Dienstgrade ab'); return true; }
  return false;
}

/* ---------- Quiz-Fenster ---------- */
let QZ = null;
function quizStart(o){ QZ = Object.assign({i:0, right:0, answered:null}, o); quizRender(); }
function quizRender(){
  const host = document.getElementById('modalHost'); if(!QZ) return;
  const n = QZ.qs.length;
  if(QZ.i >= n){
    const ok = QZ.right >= QZ.pass;
    host.innerHTML = '<div class="overlay" role="dialog" aria-modal="true" aria-label="Ergebnis"><div class="sheet ev" style="text-align:center">'
      + '<div class="stamp' + (ok ? ' good' : '') + '">' + (ok ? 'BESTANDEN' : 'NICHT BESTANDEN') + '</div>'
      + '<p class="evtext"><b>' + QZ.right + ' von ' + n + ' richtig.</b> ' + esc(ok ? QZ.okText : QZ.failText) + '</p>'
      + '<button class="btn wide" data-act="qzend" style="margin-top:12px">Weiter</button></div></div>';
    document.querySelector('[data-act="qzend"]').focus();
    return;
  }
  const q = QZ.qs[QZ.i], a = QZ.answered;
  let h = '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="qzt"><div class="sheet ev">'
    + '<div class="small muted">' + esc(QZ.title) + ' · Frage ' + (QZ.i + 1) + ' von ' + n + '</div>'
    + '<div class="qzdots">' + QZ.qs.map((x, k) => '<i class="' + (k < QZ.i ? (x.ok ? 'ok' : 'no') : k === QZ.i ? 'cur' : '') + '"></i>').join('') + '</div>'
    + '<p class="evtext" id="qzt"><b>' + esc(q.q) + '</b></p>' + (q.html || '')
    + '<div class="choices' + (q.grid ? ' qzgrid' : '') + '">'
    + q.opts.map((o, k) => {
        const cls = a === null ? '' : k === q.c ? ' qzok' : k === a ? ' qzno' : '';
        return '<button class="btn ghost choice' + cls + '" data-act="qz" data-id="' + k + '" ' + (a !== null ? 'disabled' : '') + ' aria-label="' + esc(o.t) + '">'
          + (o.h ? '<span class="qzimg">' + o.h + '</span>' + (a !== null ? '<span class="small">' + esc(o.t) + '</span>' : '') : '<span>' + esc(o.t) + '</span>') + '</button>';
      }).join('') + '</div>';
  if(a !== null) h += '<p class="small" style="margin:10px 0 0"><b>' + (a === q.c ? 'Richtig.' : 'Falsch.') + '</b>' + (a === q.c ? '' : ' Richtig ist: ' + esc(q.right) + '.') + '</p>'
    + '<button class="btn wide" data-act="qznext" style="margin-top:10px">' + (QZ.i + 1 < n ? 'Nächste Frage' : 'Auswertung') + '</button>';
  host.innerHTML = h + '</div></div>';
  const f = document.querySelector(a !== null ? '[data-act="qznext"]' : '[data-act="qz"]'); if(f) f.focus();
}
function quizAnswer(k){
  if(!QZ || QZ.answered !== null) return;
  const q = QZ.qs[QZ.i]; QZ.answered = k; q.ok = k === q.c; if(q.ok) QZ.right++;
  quizRender();
}
function quizNext(){ if(!QZ) return; QZ.i++; QZ.answered = null; quizRender(); }
function quizEnd(){
  const o = QZ; QZ = null; document.getElementById('modalHost').innerHTML = '';
  if(o && o.done) o.done(o.right >= o.pass, o.right);
}

function fsTheorie(){
  if(!S.fs || S.fs.stage !== 'theorie') return;
  const x = FS_I[S.fs.id], keep = S.fs; S.fsRetry = S.fsRetry || {};
  const hadRetry = !!S.fsRetry[x.id];
  // Wer die Seite während der Prüfung neu lädt, hat sie nicht bestanden
  S.fsRetry[x.id] = 1; S.fs = null; save();
  quizStart({title:'Theorieprüfung ' + x.name, qs:fsFragen(x.id), pass:4,
    okText:'Theorie bestanden. Jetzt wartet die praktische Prüfung in den Meldungen.',
    failText:'Mindestens 4 richtige Antworten sind nötig. Die Wiederholung kostet die Hälfte.',
    done:(ok) => {
      if(ok){ S.fs = Object.assign(keep, {stage:'praxis', exam:true}); if(!hadRetry) delete S.fsRetry[x.id]; S.pending.push('fsx_' + x.id); G.addPoints(2); }
      save(); render();
    }});
}
function dgStart(){
  const ga = !S.gaDone;
  if(!ga){ S.dgNext = now() + 3*864e5 / S.speed; S.dgAnnounced = false; save(); }
  quizStart({title:'Dienstgradtest', qs:dgFragen(dgPool()), pass:4,
    okText: ga ? 'Brockmann nickt. „Wenigstens wissen Sie, vor wem Sie stillstehen müssen.“' : 'Brockmann ist zufrieden. Es gibt Punkte und etwas Geld für die Kaffeekasse.',
    failText: ga ? 'Brockmann seufzt. „Noch mal. Und diesmal mit Hingucken.“ Du kannst es gleich wieder versuchen.' : 'Brockmann notiert sich das. In ein paar Tagen fragt er wieder.',
    done:(ok, n) => {
      if(ga){ if(ok){ S.dgOk = true; G.addPoints(3); } }
      else {
        if(ok){ const m = Math.round(G.rank().sold * 1.5); S.money += m; G.addPoints(4 + (n === 5 ? 2 : 0)); S.rel.spiess = Math.min(100, (S.rel.spiess||0) + 2); toast('+' + eur(m) + ' und Beurteilungspunkte'); }
        else { S.rel.spiess = Math.max(-100, (S.rel.spiess||0) - 1); }
      }
      save(); render();
    }});
}
function pruefCard(){

// Grundausbildung: etwa eine Stunde, jeder Schritt bringt sofort etwas
const GA_STEPS = [
  {id:'formal1', label:'Erster Formaldienst',        ok:() => (S.dc.formal||0) >= 1,    rew:{money:1.5}},
  {id:'fit1',    label:'Fitness-Ausbildung Stufe 1', ok:() => S.stats.fitness >= 1,     rew:{money:1}},
  {id:'marsch',  label:'Ausbildungsmarsch',          ok:() => (S.dc.ga_marsch||0) >= 1, rew:{paket:1}},
  {id:'schiess1',label:'Schießausbildung Stufe 1',   ok:() => S.stats.schiessen >= 1,   rew:{money:1}},
  {id:'formal2', label:'Zweiter Formaldienst',       ok:() => (S.dc.formal||0) >= 2,    rew:{bp:3}},
  {id:'dg',      label:'Dienstgradtest bestanden',   ok:() => !!S.dgOk,                 rew:{bp:5}},
];
function rewText(r){
  const sold = G.rank().sold, out = [];
  if(r.money) out.push(eur(Math.round(r.money * sold)));
  if(r.paket) out.push(r.paket === 1 ? 'Feldpost-Paket' : r.paket + ' Feldpost-Pakete');
  if(r.bp) out.push(r.bp + ' Punkte');
  if(r.st) out.push('Ausdauer voll');
  return out.join(', ');
}
function rewGive(r){
  const sold = G.rank().sold;
  if(r.money) S.money += Math.round(r.money * sold);
  if(r.paket) S.pakete = Math.min(9, (S.pakete||0) + r.paket);
  if(r.bp) G.addPoints(r.bp);
  if(r.st){ S.stamina = G.maxStamina(); S.staminaTs = now(); }
}
function gaCheck(events){
  if(S.gaDone) return false;
  S.gaRew = S.gaRew || {};
  let neu = false;
  for(const s of GA_STEPS){
    if(S.gaRew[s.id] || !s.ok()) continue;
    S.gaRew[s.id] = now(); rewGive(s.rew); neu = true;
    events.push('Grundausbildung: ' + s.label + ' erledigt. Belohnung: ' + rewText(s.rew));
  }
  return neu;
}

function gestern(){ const d = new Date(); d.setDate(d.getDate() - 1); return dateStr(d); }
function appellNext(){
  const a = S.appell || {last:null, streak:0};

function appellPreview(){                                     // was morgen kommt
  const a = S.appell || {streak:0};
  const n = a.last === dateStr() ? a.streak + 1 : (appellNext() || 1);

}
function appellCard(){
  const n = appellNext(), a = S.appell || {streak:0};
  const dots = k => '<div class="apdots">' + [1,2,3,4,5,6,7].map(i => '<i class="' + (i <= k ? 'on' : '') + '"></i>').join('') + '</div>';

function appellAntreten(){
  const n = appellNext(); if(!n) return;
  const it = APPELL[(n - 1) % 7];
  S.appell = {last:dateStr(), streak:n};
  rewGive(it.r); save(); render();
  const m = appellPreview();
  document.getElementById('modalHost').innerHTML = '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="apt"><div class="sheet ev">'
    + '<div class="evhead">' + npcBadge('spiess') + '<div><div class="evname" id="apt">Morgenappell</div><div class="small muted">Tag ' + n + ' in Folge</div></div></div>'

    + '<button class="btn wide" data-act="close" style="margin-top:14px">Wegtreten</button></div></div>';
}
let appellShown = '';
function appellAuto(){
  if(!S || tutOn() || !appellNext() || appellShown === dateStr()) return;
  const host = document.getElementById('modalHost'); if(!host || host.innerHTML.trim()) return;
  appellShown = dateStr();
  setTimeout(() => { const h = document.getElementById('modalHost'); if(h && !h.innerHTML.trim() && appellNext()) appellAntreten(); }, 600);
}
function stripLeer(){
  // Ausdauer reicht für keinen freien Dienst mehr: auf Feierabend und morgen verweisen
  const frei = DIENSTE.filter(d => !G.dienstLock(d) && !(d.hideFor && d.hideFor.includes(G.rank().g)));
  if(!frei.length || frei.some(d => S.stamina >= G.dienstSt(d))) return null;
  const min = Math.min(...frei.map(d => G.dienstSt(d))), bis = (min - S.stamina) * G.regenMs();
  return '<div class="strip idle"><span>Ausdauer leer, nächster Dienst in ' + esc(fmtRest(bis).replace(/\.$/, '')) + '. Bis dahin: Feierabend!</span><button class="btn mini" data-act="tab" data-id="feier">Feierabend</button></div>';
}
