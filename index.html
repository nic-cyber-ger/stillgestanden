<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stillgestanden!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1E2416; --surface:#2C3420; --surface2:#262D1B; --ink:#ECEEE2; --muted:#AEB59C; --line:#4A5535;
  --olive:#3C4722; --olive-ink:#F2F5EA; --board:#4B582C; --mark:#E8ECDD;
  --signal:#E3B23C; --stamp:#E2584C; --ok:#8BC57A; --bad:#EE6B5F;
  --wall:#2F3826; --floor:#4A4232; --metal:#7A8274; --wood:#7A5A3A; --fabric:#5E6E38; --window:#3A5066;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#E4E8DC; --surface:#F5F7F0; --surface2:#E9ECE2; --ink:#1C2217; --muted:#5A6350; --line:#C7CEBA;
  --olive:#4B582C; --olive-ink:#F2F5EA; --board:#4B582C; --mark:#E8ECDD;
  --signal:#BF8E10; --stamp:#A3271E; --ok:#3B7436; --bad:#A3271E;
  --wall:#D3D8C7; --floor:#A69C84; --metal:#8A9286; --wood:#9A7650; --fabric:#4B582C; --window:#BCD1DC;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1E2416; --surface:#2C3420; --surface2:#262D1B; --ink:#ECEEE2; --muted:#AEB59C; --line:#4A5535;
  --olive:#3C4722; --olive-ink:#F2F5EA; --board:#4B582C; --mark:#E8ECDD;
  --signal:#E3B23C; --stamp:#E2584C; --ok:#8BC57A; --bad:#EE6B5F;
  --wall:#2F3826; --floor:#4A4232; --metal:#7A8274; --wood:#7A5A3A; --fabric:#5E6E38; --window:#3A5066;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{min-height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--olive)}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background-color:var(--olive);color:var(--olive-ink);border-bottom:3px solid var(--signal);
  background-image:radial-gradient(ellipse 22px 14px at 20% 35%,rgba(0,0,0,.18) 98%,transparent),radial-gradient(ellipse 28px 16px at 72% 62%,rgba(0,0,0,.13) 98%,transparent),radial-gradient(ellipse 16px 10px at 46% 82%,rgba(255,255,255,.07) 98%,transparent);background-size:110px 64px;
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:'Black Ops One',Impact,'Arial Black',sans-serif;font-size:21px;letter-spacing:.01em;white-space:nowrap}
.res{display:flex;gap:14px;align-items:center;font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:600;font-size:17px}
.stam{display:flex;align-items:center;gap:6px}
.stam .bar{width:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.stam .bar i{display:block;height:100%;background:var(--signal)}

main{max-width:640px;margin:0 auto;padding:16px}
h2{font-family:'Black Ops One',Impact,'Arial Black',sans-serif;font-weight:400;font-size:20px;line-height:1.2;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--signal),transparent)}
.sheet h2,.create h2{display:block}
.sheet h2::after,.create h2::after{display:none}
h2:first-child{margin-top:4px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:600;font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 16px}
.panel.pad{padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .info{min-width:0;flex:1}
.row .title{font-weight:700;font-size:17px}
.row .meta{font-size:14px;color:var(--muted);margin-top:2px}
.row .desc{font-size:14px;margin-top:3px}

.ausweis{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-left:6px solid var(--olive);border-radius:6px;padding:16px}
.ausweis .rank{font-family:'Black Ops One',Impact,sans-serif;font-size:26px;line-height:1.1}
.ausweis .name{font-weight:600;font-size:17px}

.btn{font:600 16px 'Barlow',system-ui,sans-serif;background:var(--olive);color:var(--olive-ink);border:0;border-radius:4px;
  padding:10px 16px;min-height:44px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.wide{width:100%}

.prog{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--signal);width:0}
.active{padding:14px 0;border-bottom:1px solid var(--line)}
.active:last-child{border-bottom:0}
.active .head{display:flex;justify-content:space-between;gap:12px;font-weight:600}

.note{display:flex;align-items:baseline;gap:12px}
.note .big{font-family:'Black Ops One',Impact,sans-serif;font-size:44px;line-height:1}
.quote{border-left:3px solid var(--signal);padding:4px 0 4px 12px;font-style:italic;margin:16px 0}

.req{list-style:none;padding:0;margin:10px 0 14px}
.req li{display:flex;gap:8px;padding:3px 0;font-size:15px}
.req li b{width:16px;flex:none;text-align:center}
.req .ok b{color:var(--ok)}
.req .no b{color:var(--bad)}
.target{padding:16px 0;border-bottom:1px solid var(--line)}
.target:last-child{border-bottom:0}
.target .title{font-family:'Black Ops One',Impact,sans-serif;font-size:22px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:1px 8px;border-radius:3px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle}

.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;font:500 15px 'Barlow',sans-serif;background:transparent;color:var(--ink);border:0;padding:9px 6px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:transparent;border:0;color:var(--muted);font:600 10.5px 'Barlow',sans-serif;padding:8px 0 10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px;cursor:pointer}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--signal)}
.nav svg{width:24px;height:24px}

.create{max-width:420px;margin:8vh auto 0;text-align:left}
.create .hero{font-family:'Black Ops One',Impact,sans-serif;font-size:clamp(38px,11vw,58px);line-height:1;margin:18px 0 14px}
.create label{display:block;font-weight:600;margin:20px 0 6px}
.create input{width:100%;font:500 18px 'Barlow',sans-serif;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-weight:600;max-width:calc(100% - 32px);
  box-shadow:0 4px 18px rgba(0,0,0,.25)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,12,8,.6);display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--surface);color:var(--ink);border-radius:6px;padding:24px;max-width:380px;width:100%;text-align:center}
.stamp{display:inline-block;border:4px solid var(--stamp);color:var(--stamp);font-family:'Black Ops One',Impact,sans-serif;
  font-size:34px;padding:4px 16px;transform:rotate(-7deg);margin:6px 0 18px;animation:stamp .38s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-7deg) scale(2.2);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}}
.history li{padding:4px 0}
.spange{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;max-width:150px}
.spange svg{display:block}
.lage{border-left:4px solid var(--signal)}
.orden-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.orden-row:last-child{border-bottom:0}
.orden-row.off svg{opacity:.3;filter:grayscale(1)}
.tut{background:var(--surface);border:2px solid var(--signal);border-radius:8px;padding:12px;margin:4px 0 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tut .tt{font-family:'Black Ops One',Impact,sans-serif;font-size:17px;line-height:1.2;margin-bottom:4px}
.tut p{margin:0 0 8px;font-size:15px}
.tut .hint{font-size:14px;font-weight:600;color:var(--olive)}
.nav button.pulse{animation:navpulse 1.2s ease-in-out infinite}
.nav button.pulse svg{color:var(--signal)}
@keyframes navpulse{0%,100%{background:transparent}50%{background:var(--surface2)}}
@media (prefers-reduced-motion: reduce){.nav button.pulse{animation:none;background:var(--surface2)}}
:root[data-tsk="lw"]{--olive:#45566B;--board:#45566B;--fabric:#45566B}
:root[data-tsk="marine"]{--olive:#1F3557;--board:#1F3557;--fabric:#1F3557;--mark:#E6C35C}
@media (prefers-color-scheme: dark){
  :root[data-tsk="lw"]:not([data-theme="light"]){--olive:#34404F;--board:#45566B;--fabric:#45566B}
  :root[data-tsk="marine"]:not([data-theme="light"]){--olive:#1A2C49;--board:#1F3557;--fabric:#1F3557}
}
:root[data-tsk="lw"][data-theme="dark"]{--olive:#34404F}
:root[data-tsk="marine"][data-theme="dark"]{--olive:#1A2C49}
.btn.mini{min-height:32px;padding:4px 9px;font-size:13px;margin-top:3px;white-space:normal;text-align:left}
.linkbtn {background:none;border:0;color:var(--muted);text-decoration:underline;font:500 15px 'Barlow',sans-serif;cursor:pointer;padding:8px 0}
.linkbtn:disabled{opacity:.5;text-decoration:none;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.acard .ah{background-color:var(--olive);background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.18));color:var(--olive-ink);padding:8px 10px;font-family:'Black Ops One',Impact,sans-serif;font-size:15px;line-height:1.15;border-bottom:2px solid var(--signal)}
.acard .art{background:var(--surface2);line-height:0;border-bottom:1px solid var(--line)}
.acard .art svg{width:100%;height:auto;display:block}
.acard .ab{padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;flex:1}
.acard .flv{font-size:13px;color:var(--muted);margin:0;font-style:italic}
.acard .eff{font-size:13px;margin:0}
.acard .lvl{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:700;font-size:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 0;margin-top:auto}
.acard .btn{line-height:1.15;padding:8px 10px}
.acard .btn small{display:block;font-weight:500;font-size:13px;opacity:.85}
.medals{display:flex;justify-content:center;gap:6px;padding:8px 6px;background:var(--surface2);border-top:1px solid var(--line)}
.medal{width:30px;height:40px}
.medal.off{opacity:.28;filter:grayscale(1)}
.ladder{display:flex;gap:4px;overflow-x:auto;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;scrollbar-width:thin}
.lad{flex:none;opacity:.3;padding:3px;border-radius:4px;line-height:0}
.lad.done{opacity:.85}
.lad.cur{opacity:1;outline:2px solid var(--signal);outline-offset:1px}
.acard.run{outline:2px solid var(--signal)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12.5px;text-align:left;margin-top:auto;border-top:1px solid var(--line);padding-top:6px}
.facts span{color:var(--muted)}
.facts b{text-align:right;font-weight:600}
.lock{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:7px 6px}
.reqmini{list-style:none;margin:0;padding:0;text-align:left;font-size:12px;line-height:1.3}
.reqmini li{display:flex;gap:5px;padding:1px 0}
.reqmini b{flex:none;width:12px}
.reqmini .ok b{color:var(--ok)}
.reqmini .no b{color:var(--bad)}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:2px solid var(--rc);border-radius:6px;background:var(--surface);min-height:64px;padding:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:600;line-height:1.25}
.tile.miss{opacity:.45;font-size:20px}
.paket{border:3px solid var(--rc);border-radius:8px;padding:16px;margin-bottom:12px;animation:pop .4s cubic-bezier(.2,1.6,.4,1) both}
.pname{font-family:'Black Ops One',Impact,sans-serif;font-size:23px;line-height:1.15;margin:6px 0 8px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.paket{animation:none}}
.hand{display:flex;gap:6px;flex-wrap:wrap}
.card{display:inline-flex;align-items:center;justify-content:center;width:46px;height:64px;border-radius:5px;background:#FBFBF6;color:#1C2217;border:1px solid var(--line);font:700 18px 'Barlow',sans-serif}
.card.red{color:#B3261E}
.card.back{background:var(--olive);color:var(--olive-ink)}
.lbl{display:block;font-weight:600;margin:14px 0 6px}
.sel{width:100%;font:500 17px 'Barlow',sans-serif;padding:11px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.npc{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--c);color:#fff;font-family:'Black Ops One',Impact,sans-serif;font-size:15px;flex:none}
.relbar{position:relative;height:6px;background:var(--surface2);border-radius:3px;margin:8px 0 6px;overflow:hidden}
.relbar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted)}
.relbar i{position:absolute;top:0;bottom:0}
.sheet.ev{text-align:left;max-height:calc(100vh - 48px);overflow:auto}
.evhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.evname{font-weight:700;font-size:18px}
.evtext{font-size:17px;line-height:1.5}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.choice{text-align:left;white-space:normal;line-height:1.3;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;font-weight:600;padding:3px 9px;border-radius:3px;background:var(--surface2);color:var(--ok)}
.chip.neg{color:var(--bad)}
.stamp.small-stamp{font-size:22px;margin:0 0 12px}
.stamp.good{border-color:var(--ok);color:var(--ok)}
.nav button{position:relative}
.dot{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--stamp)}
.room{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;line-height:0}
.room svg{width:100%;height:auto;display:block}
.inp{width:100%;font:500 17px 'Barlow',sans-serif;padding:11px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
.rl{list-style:none;margin:0;padding:0}
.rl li{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.rl li:last-child{border-bottom:0}
.rl .pos{width:28px;flex:none;text-align:right;font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:700;color:var(--muted)}
.rl .who{flex:1;min-width:0}
.rl .me{font-weight:700;color:var(--ink)}
.bar2{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar2>i{display:block;height:100%;background:var(--ok)}
.code{font-family:'Barlow Condensed','Barlow',sans-serif;font-weight:700;font-size:26px;letter-spacing:.12em;padding:8px 12px;background:var(--surface2);border-radius:4px;display:inline-block;user-select:all}
.mapwrap{height:min(60vh,380px);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;z-index:0;isolation:isolate}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:500 15px 'Barlow',sans-serif;cursor:pointer;padding:8px 0}
.slot{border-top:4px solid var(--signal)}
.reels{display:flex;gap:8px;justify-content:center}
.reel{flex:1;max-width:100px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(32px,10vw,48px);background:var(--surface2);border:2px solid var(--line);border-radius:8px}
.reel.spin{filter:blur(1.5px)}
.slmsg{text-align:center;font-weight:700;margin:12px 0;min-height:1.4em}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;margin:0 -16px 12px;background:var(--surface2);border-bottom:1px solid var(--line);scrollbar-width:none}
.subnav:first-child{margin-top:-16px}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:1 0 auto;min-height:40px;padding:0 12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px 'Barlow',sans-serif;border-radius:4px;white-space:nowrap;cursor:pointer}
.subnav button[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:#1E2416;font-weight:700}
.strip{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:6px;display:grid;gap:8px}
.strip.idle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.strip .sh{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.strip .prog{margin-top:4px;height:6px}
.nav button{font-size:12px}
.acard .art{height:56px;overflow:hidden;display:flex;justify-content:center}
.acard .art svg{height:100%;width:auto}
.acard .ah{font-size:14px;padding:7px 10px}
.acard .ab{padding:8px 9px;gap:5px}
.acard .flv{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cards{gap:10px}
.panel{border-radius:6px}

/* Ladebildschirm */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:#1E2416;color:#ECEEE2;transition:opacity .45s ease, visibility .45s;
  background-image:radial-gradient(ellipse 60px 34px at 18% 22%,rgba(0,0,0,.22) 98%,transparent),radial-gradient(ellipse 80px 40px at 78% 70%,rgba(0,0,0,.18) 98%,transparent),radial-gradient(ellipse 50px 28px at 40% 85%,rgba(255,255,255,.04) 98%,transparent),radial-gradient(ellipse 70px 30px at 85% 18%,rgba(255,255,255,.035) 98%,transparent);background-size:260px 190px}
#splash.off{opacity:0;visibility:hidden;pointer-events:none}
#splash .sp-title{font-family:'Black Ops One',Impact,sans-serif;font-size:clamp(34px,10vw,52px);line-height:1;letter-spacing:.01em}
#splash .sp-sub{font-size:14px;color:#AEB59C;min-height:1.4em;text-align:center;padding:0 24px}
#splash .sp-bar{width:min(240px,60vw);height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#splash .sp-bar i{display:block;height:100%;width:40%;background:#E3B23C;border-radius:3px;animation:spbar 1.4s ease-in-out infinite}
#splash .sp-klappe rect{transform-box:fill-box;transform-origin:left;animation:spstripe 1.8s ease-in-out infinite}
#splash .sp-klappe rect:nth-of-type(2){animation-delay:.2s}
#splash .sp-klappe rect:nth-of-type(3){animation-delay:.4s}
@keyframes spbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes spstripe{0%,15%{transform:scaleX(0)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce){#splash .sp-bar i,#splash .sp-klappe rect{animation:none}#splash .sp-bar i{width:100%}}

const EX_POOL = ['ex_container','ex_wlan','ex_hitze','ex_sprachmittler','ex_besuch','ex_post','ex_konvoi','ex_heimweh','ex_grill'];
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function fmtRest(ms){
  const s = Math.max(0,ms)/1000, d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return d ? d+(d===1?' Tag ':' Tage ')+h+' Std.' : h ? h+' Std. '+m+' Min.' : m+' Min.';
}
function medalName(n){ return n>=3 ? 'in Gold' : n>=2 ? 'in Silber' : 'in Bronze'; }
function einsatzReqs(E){
  const r = G.rank();
  return [
    {label:E.reqL, ok:E.req(r)},
    {label:'Grundausbildung abgeschlossen', ok:!!S.gaDone},
    {label:'Dienstverhältnis mindestens '+DZ[E.dz].short, ok:DZ[S.verpfl].rang >= DZ[E.dz].rang},
    {label:'Restdienstzeit mindestens '+E.days+' Wochen', ok:G.dzLeft() >= E.days},
    {label:'Fitness Stufe '+E.fit, ok:S.stats.fitness >= E.fit},
    {label:'Kein laufender Dienst oder Lehrgang', ok:!S.dienst && !S.lg},
    {label:'Einsatzpause vorbei', ok:!S.einsatzPause || now() >= S.einsatzPause},
  ];
}
function startEinsatz(id){
  const E = EINSATZ_I[id]; if(!E || S.einsatz) return 'Du bist schon im Einsatz.';
  if(!einsatzReqs(E).every(x=>x.ok)) return 'Voraussetzungen fehlen.';
  const dur = E.days*864e5/S.speed, ev = shuffle(EX_POOLS[S.tsk] || EX_POOL).slice(0, E.n);
  S.einsatz = {id, start:now(), end:now()+dur, cps:ev.map((_,i)=>now()+dur*(i+1)/(ev.length+1)), ev, next:0, score:0, fin:false};
  return null;
}
// Auslandszuschlag: 15 Tagessätze pro Einsatztag, plus Leistungszuschlag je nach Bewertung
function einsatzRate(){ return Math.round(G.rank().sold * 15); }
function einsatzZuschlag(E){ return E.days * einsatzRate(); }
const EINSATZ_BONUS = [0, 1.25, 1.1, 1, .9];
function finishEinsatz(){
  const a = S.einsatz; if(!a) return '';
  const E = EINSATZ_I[a.id], s = a.score;
  const note = s >= E.n*3 ? 1 : s >= E.n*2 ? 2 : s >= E.n ? 3 : 4;
  const zuschlag = Math.round(einsatzZuschlag(E) * EINSATZ_BONUS[note]);
  S.einsatz = null; S.money += zuschlag - earnCut(zuschlag); G.addPoints(10 + (4-note)*5);
  S.einsaetze.push({id:a.id, ts:now(), note});
  S.pakete = Math.min(9, (S.pakete||0)+2);
  S.einsatzPause = now() + 14*864e5/S.speed;
  return '<div class="stamp good">ZURÜCK</div><p><b>'+esc(E.name)+' abgeschlossen.</b> Bewertung: „'+NOTES[note]+'“. Auslandszuschlag: '+eur(zuschlag)+(note<=2 ? ' inklusive Leistungszuschlag' : '')+'.</p>'
    + '<p>Du erhältst die Einsatzmedaille '+medalName(S.einsaetze.length)+'.</p><p class="small">Außerdem warten zwei Feldpostpakete in der Übersicht.</p>';
}
function renderEinsatz(){
  let h = '<h2>Auslandseinsatz</h2>';
  if(S.einsatz){
    const E = EINSATZ_I[S.einsatz.id];
    return h + '<div class="panel pad"><p style="margin-bottom:4px"><b>'+esc(E.name)+'</b>, '+esc(E.ort)+'</p><p class="small muted" style="margin:0">Einsatzpunkte: '+S.einsatz.score
      + '. Rückkehr in '+fmtRest(S.einsatz.end-now())+'.</p></div>';
  }
  if(S.einsatzPause && now() < S.einsatzPause) h += '<p class="small muted">Einsatznachbereitung: Der nächste Einsatz ist in '+fmtRest(S.einsatzPause-now())+' möglich.</p>';
  else h += '<p class="small muted">Ein Einsatz läuft über mehrere Tage. In der Zeit gibt es nur Einsatzdienste und keine Lehrgänge, dafür eigene Lagen, Auslandszuschlag und eine Medaille.</p>';
  h += '<div class="cards">' + EINSATZ.map(E => {
    const req = einsatzReqs(E), ok = req.every(x=>x.ok);
    const inner = '<p class="flv">'+esc(E.desc)+'</p>'
      + facts([['Ort', esc(E.ort)], ['Dauer', E.days+' Tage'], ['Zuschlag/Tag', eur(einsatzRate())], ['Gesamt', eur(einsatzZuschlag(E))]])
      + reqMini(req)
      + '<button class="btn wide" data-act="einsatz" data-id="'+E.id+'" '+(ok?'':'disabled')+'>Für den Einsatz melden</button>';
    return acard(E.name, 'plane', inner);
  }).join('') + '</div><p class="small muted" style="margin-top:8px">Bei sehr guter Bewertung gibt es 25 % mehr Zuschlag. Im Einsatz gibt es besser bezahlte Einsatzdienste.</p>';
  if(S.einsaetze.length) h += '<p class="small muted" style="margin-top:10px">Bisherige Einsätze: '+S.einsaetze.map(x=>EINSATZ_I[x.id].name+' („'+NOTES[x.note]+'“)').join(', ')+'</p>';
  return h;
}

/* ---------- Stubenrunde: Siebzehn und Vier mit Kalle ---------- */
const SR_MAX = 5;
let SR = null;
const SUITS = ['♥','♦','♣','♠'];
const FACES = [['7',7],['8',8],['9',9],['10',10],['B',2],['D',3],['K',4],['A',11]];
function srLeft(){ return (!S.sr || S.sr.day !== dateStr()) ? SR_MAX : SR_MAX - S.sr.n; }
function srUse(){ if(!S.sr || S.sr.day !== dateStr()) S.sr = {day:dateStr(), n:0}; S.sr.n++; }
function newDeck(){ const d = []; for(const s of SUITS) for(const [f,v] of FACES) d.push({f,s,v}); return shuffle(d); }
function handVal(h){ return h.reduce((a,c)=>a+c.v, 0); }
function cardHtml(c, hidden){
  return hidden ? '<span class="card back" aria-label="verdeckte Karte">?</span>'
    : '<span class="card'+('♥♦'.includes(c.s)?' red':'')+'">'+c.f+c.s+'</span>';
}
function srStakes(){ const s = G.rank().sold; return [0, s, 3*s, 5*s].map(Math.round); }
function srRender(msg){
  let body;
  const head = '<div class="evhead">'+npcBadge('kalle')+'<div><div class="evname">Stubenrunde</div><div class="small muted">'
    + (SR ? 'Einsatz: '+(SR.bet ? eur(SR.bet) : 'die Ehre') : 'Siebzehn und Vier mit Kalle') + '</div></div></div>';
  if(!SR){
    const left = srLeft();
    body = head + '<p class="evtext">„Was setzt du?“ Kalle mischt mit einer Geschwindigkeit, die verdächtig ist.</p>'
      + '<p class="small muted">Wer näher an 21 kommt, gewinnt, über 21 hast du verloren. Zwei Asse sind „Feuer“ und zählen doppelt. Kalle zieht bis 17. Noch '+left+' von '+SR_MAX+' Runden heute.</p>'
      + (left > 0 ? '<div class="choices">' + srStakes().map((v,i)=>'<button class="btn ghost choice" data-act="sr_start" data-id="'+i+'" '+(S.money<v?'disabled':'')+'><span>'+(v ? 'Um '+eur(v) : 'Um die Ehre')+'</span></button>').join('') + '</div>'
                  : '<p><b>Für heute ist Schluss.</b> Kalle verstaut die Karten im Spind. Nach dem Zapfenstreich wird nicht mehr gespielt.</p>')
      + '<button class="btn ghost wide" data-act="close" style="margin-top:14px">Aufstehen</button>';
  } else {
    const done = SR.done;
    body = head
      + '<p class="small muted" style="margin:6px 0 4px">Kalle'+(done ? ' ('+handVal(SR.d)+')' : '')+'</p><div class="hand">'+SR.d.map((c,i)=>cardHtml(c, !done && i===1)).join('')+'</div>'
      + '<p class="small muted" style="margin:12px 0 4px">Du ('+handVal(SR.p)+')</p><div class="hand">'+SR.p.map(c=>cardHtml(c)).join('')+'</div>'
      + (msg ? '<p class="evtext" style="margin-top:12px">'+msg+'</p>' : '')
      + (!done
        ? '<div class="choices" style="flex-direction:row"><button class="btn" style="flex:1" data-act="sr_hit">Karte</button><button class="btn ghost" style="flex:1" data-act="sr_stand">Passe</button></div>'
        : (SR.cheat && !SR.accused ? '<button class="btn ghost wide" style="margin-top:10px" data-act="sr_accuse">Kalle beim Schummeln erwischen ('+rollChance({stat:'vitaminb',base:40})+' %)</button>' : '')
          + '<div class="choices" style="flex-direction:row;margin-top:10px">'
          + (srLeft() > 0 ? '<button class="btn" style="flex:1" data-act="sr_again">Noch eine Runde</button>' : '')
          + '<button class="btn ghost" style="flex:1" data-act="close">Aufstehen</button></div>');
  }
  document.getElementById('modalHost').innerHTML = '<div class="overlay" role="dialog" aria-modal="true" aria-label="Stubenrunde"><div class="sheet ev">'+body+'</div></div>';
}
function srStart(i){
  const v = srStakes()[i];
  if(v === undefined || srLeft() <= 0 || S.money < v) return;
  S.money -= v; srUse();
  const deck = newDeck();
  SR = {bet:v, deck, p:[deck.pop(), deck.pop()], d:[deck.pop(), deck.pop()], done:false, cheat:false, accused:false};
  save(); renderRes();
  if(SR.p[0].f==='A' && SR.p[1].f==='A') return srEnd('feuer');
  srRender();
}
function srHit(){ if(!SR || SR.done) return; SR.p.push(SR.deck.pop()); if(handVal(SR.p) > 21) return srEnd('bust'); srRender(); }
function srStand(){
  if(!SR || SR.done) return;
  while(handVal(SR.d) < 17) SR.d.push(SR.deck.pop());
  if(handVal(SR.d) > 21 && Math.random() < .2){
    const need = 21 - handVal(SR.d.slice(0,-1));
    const fit = FACES.filter(([f,v]) => v <= need).sort((a,b)=>b[1]-a[1])[0];
    if(fit){ SR.d[SR.d.length-1] = {f:fit[0], s:pick(SUITS), v:fit[1]}; SR.cheat = true; }
  }
  const pv = handVal(SR.p), dv = handVal(SR.d);
  srEnd(dv > 21 || pv > dv ? 'win' : pv === dv ? 'push' : 'lose');
}
function srEnd(r){
  SR.done = true; let msg = '';
  if(r==='feuer'){ S.money += SR.bet*3; msg = 'Zwei Asse, Feuer! Kalle wirft die Karten hin.'+(SR.bet ? ' +'+eur(SR.bet*2) : ''); }
  if(r==='win'){ S.money += SR.bet*2; msg = 'Gewonnen!'+(SR.bet ? ' +'+eur(SR.bet) : ' Kalle verlangt sofort Revanche.'); }
  if(r==='push'){ S.money += SR.bet; msg = 'Unentschieden. Jeder behält seins.'; }
  if(r==='lose'){ msg = 'Kalle gewinnt'+(SR.bet ? ' und steckt '+eur(SR.bet)+' ein.' : '.'); }
  if(r==='bust'){ msg = 'Über 21. Kalle grinst'+(SR.bet ? ' und kassiert '+eur(SR.bet)+'.' : '.'); }
  if(SR.cheat) msg += ' Irgendetwas war komisch an Kalles letzter Karte.';
  save(); renderRes(); srRender(msg);
}
function srAccuse(){
  if(!SR || !SR.cheat || SR.accused) return;
  SR.accused = true; let msg;
  if(Math.random()*100 < rollChance({stat:'vitaminb', base:40})){
    S.money += SR.bet*2; applyFx({rel:{kalle:-3}});
    msg = 'Erwischt! Im Ärmel steckt noch eine zweite Karte. Kalle zahlt dir den Gewinn und murmelt etwas von Glück.';
  } else {
    applyFx({rel:{kalle:-2}});
    msg = 'Kalle zeigt seine leeren Ärmel und schaut gekränkt. Beweisen kannst du nichts.';
  }
  save(); renderRes(); srRender(msg);
}

/* ---------- Sparvertrag bei der „Kameraden-Vorsorge“ ---------- */
const SPAR_RATEN = [5, 10, 20];
const SPAR_ZINS = 0.025;   // pro Woche echte Zeit, taggenau verzinst
const SPAR_SPERRE = 5;     // Tage zwischen zwei Auszahlungen
// Anteil eines Verdienstes, der automatisch aufs Sparkonto geht
function earnCut(v){
  if(!S.spar || !S.spar.rate || !(v > 0)) return 0;
  const c = Math.round(v * S.spar.rate / 100); S.spar.bal += c; return c;
}
function sparZinsen(){
  if(!S.spar) return;
  const t = now(), d = (t - S.spar.zTs) / 864e5 * S.speed;
  if(d > 0 && S.spar.bal > 0) S.spar.bal = S.spar.bal * Math.pow(1 + SPAR_ZINS, d / 7);
  S.spar.zTs = t;
}
function sparNext(){ return S.spar && S.spar.lastOut ? S.spar.lastOut + SPAR_SPERRE*864e5/S.speed : 0; }
function eur2(n){ return n.toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €'; }
const SPAR_ART = '<svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true" style="flex:none"><rect width="64" height="64" rx="6" fill="var(--surface2)"/><rect x="14" y="10" width="30" height="40" rx="2" fill="#F2F2EA" stroke="var(--olive)" stroke-width="2"/><path d="M19 19h20M19 25h20M19 31h14" stroke="var(--muted)" stroke-width="2"/><path d="M20 42c3-4 6 2 9-2" stroke="var(--stamp)" stroke-width="2" fill="none"/><path d="M40 52l14-22 4 3-14 22-5 2z" fill="var(--signal)" stroke="#1C2217" stroke-width="1.5"/></svg>';
function renderSpar(){
  let h = '<h2>Anwartschaftsversicherung</h2><div class="panel pad">';
  if(!S.spar){
    return h + '<div style="display:flex;gap:12px;align-items:flex-start">'+SPAR_ART+'<p class="small" style="margin:0">Herr Klingelhöfer von der „Kameraden-Vorsorge“ steht schon zum dritten Mal in deiner Stube. Sein Angebot: Ein fester Anteil von jedem Verdienst wandert automatisch auf dein Sparkonto und bringt 2,5 % Zinsen pro Woche. Auszahlen kannst du alle '+SPAR_SPERRE+' Tage, kündigen erst, wenn das Konto leer ist. Und das Ersparte bleibt dir sogar, wenn du ausscheidest.</p></div>'
      + '<p style="margin:14px 0 6px"><b>Wie viel von jedem Verdienst?</b></p><div class="seg" role="group" aria-label="Sparanteil">'
      + SPAR_RATEN.map(r => '<button data-act="spar_start" data-id="'+r+'">'+r+' %</button>').join('') + '</div></div>';
  }
  sparZinsen();
  const nx = sparNext(), frei = now() >= nx, bal = S.spar.bal;
  h += '<div style="display:flex;gap:12px;align-items:center">'+SPAR_ART+'<div><div class="small muted">Guthaben mit Zinsen</div>'
    + '<div class="num" style="font-size:28px;line-height:1.1">'+eur2(bal)+'</div>'
    + '<div class="small muted">'+S.spar.rate+' % von jedem Verdienst, 2,5 % Zinsen pro Woche</div></div></div>'
    + '<p style="margin:14px 0 6px"><b>Auszahlen</b> <span class="small muted">'+(frei ? 'jetzt möglich' : 'wieder in '+fmtRest(nx - now()))+'</span></p>'
    + '<div style="display:flex;gap:6px">' + [25,50,100].map(p => '<button class="btn ghost" style="flex:1" data-act="spar_out" data-id="'+p+'" '+((!frei || bal < 1) ? 'disabled' : '')+'>'+p+' %</button>').join('') + '</div>'
    + '<p style="margin:14px 0 6px"><b>Anteil ändern</b></p><div class="seg" role="group" aria-label="Sparanteil">'
    + SPAR_RATEN.map(r => '<button data-act="spar_rate" data-id="'+r+'" aria-pressed="'+(S.spar.rate===r)+'">'+r+' %</button>').join('') + '</div>'
    + '<button class="linkbtn" data-act="spar_end" '+(bal >= 1 ? 'disabled' : '')+'>Vertrag kündigen'+(bal >= 1 ? ' (erst bei leerem Konto)' : '')+'</button>';
  return h + '</div>';
}

function ri(a, b){ return a + Math.floor(Math.random()*(b-a+1)); }
function hnoise(n){ const x = Math.sin(n*127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function ct(v){ return Math.round(v*100)/100; }
function fe(){
  if(!S.pfand) S.pfand = {ew:0, mw:0, trans:0, lager:0};
  if(!S.garage) S.garage = {cars:[], markt:null, up:{werkzeug:0, buehne:0, platz:0, teile:0}, sales:[]};
  if(!S.ntg) S.ntg = {status:'none', ts:0, until:0};
  if(S.fa === undefined) S.fa = null;
}
function feOpen(){ return !S.dienst && !S.einsatz && !S.fa; }

function pfWert(){ return ct(S.pfand.ew*PF_EW + S.pfand.mw*PF_MW); }
// Kalles Ankaufskurs: für alle Spieler gleich, ändert sich stündlich
function kalleKurs(h){
  if(h === undefined) h = Math.floor(Date.now()/36e5);
  return clamp(1.05 + .22*Math.sin(h/6.3) + .12*Math.sin(h/2.1 + 1.3) + (hnoise(h) - .5)*.16, .7, 1.5);
}
function kurvenSvg(){
  const h0 = Math.floor(Date.now()/36e5), pts = [];
  for(let i=23;i>=0;i--) pts.push(kalleKurs(h0-i));
  const x = i => 4 + i*(232/23), y = v => 54 - (v-.7)/(.8)*48;
  const d = pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  return '<svg viewBox="0 0 240 60" width="100%" height="60" role="img" aria-label="Kurs der letzten 24 Stunden" style="display:block">'
    + '<path d="M4 '+y(1).toFixed(1)+'H236" stroke="var(--line)" stroke-dasharray="3 3"/>'
    + '<path d="'+d+'" fill="none" stroke="var(--signal)" stroke-width="2.5" stroke-linejoin="round"/>'
    + '<circle cx="'+x(23)+'" cy="'+y(pts[23]).toFixed(1)+'" r="4" fill="var(--stamp)"/></svg>';
}
function pfStart(id){
  fe(); const r = PF_ROUTES.find(x=>x.id===id);
  if(!r) return;
  if(!feOpen()) return 'Erst Dienstschluss, dann Feierabend.';
  if(S.pfand.trans < r.req) return 'Dafür brauchst du mindestens: '+PF_TRANS[r.req].name+'.';
  S.fa = {type:'pfand', route:id, start:now(), end:now()+r.min*60000/S.speed};
  return null;
}
function pfFinish(a, events){
  const r = PF_ROUTES.find(x=>x.id===a.route), f = (1 + .02*S.stats.fitness) * lageF('pfand');
  let ew = Math.round(ri(r.ew[0], r.ew[1])*f), mw = Math.round(ri(r.mw[0], r.mw[1])*f);
  let note = '';
  const x = Math.random();
  if(x < .06){ ew = Math.round(ew/2); mw = Math.round(mw/2); note = ' Dennis war schneller und hat die Hälfte schon abgeräumt.'; }
  else if(x < .12){ mw += 24; note = ' Brockmann drückt dir wortlos einen Kasten aus dem Geschäftszimmer in die Hand.'; }
  else if(x < .17){ const g = ri(5, 40); S.money += g; note = ' Zwischen den Flaschen lagen '+eur(g)+'. Finderlohn, sagst du dir.'; }
  const cap = PF_TRANS[S.pfand.trans].cap;
  if(ew + mw > cap){ const k = cap/(ew+mw); ew = Math.floor(ew*k); mw = Math.floor(mw*k); note += ' Mehr konntest du nicht tragen, für mehr brauchst du besseren Transport.'; }
  const frei = PF_LAGER[S.pfand.lager].cap - pfStock();
  let lost = 0;
  if(ew + mw > frei){ lost = ew + mw - Math.max(0, frei); const k = Math.max(0, frei)/(ew+mw); ew = Math.floor(ew*k); mw = Math.floor(mw*k); }
  S.pfand.ew += ew; S.pfand.mw += mw;
  { const ev = maybeEvent('pfand', .25); if(ev) events.push('Neue Meldung von ' + NPCS[ev.who].short); }
  events.push(r.name+': '+(ew+mw)+' Flaschen gesammelt.'+note+(lost ? ' '+lost+' musstest du stehen lassen, das Lager ist voll.' : ''));
}

function nachfrage(cat){
  const d = Math.floor(Date.now()/864e5), i = CATS.indexOf(cat);
  return clamp(1 + .15*Math.sin(d/3 + i*1.7) + (hnoise(d*7 + i) - .5)*.12, .8, 1.25);

function nachfrageText(f){ return f >= 1.1 ? 'hoch' : f <= .92 ? 'niedrig' : 'normal'; }

function fixCost(d){ return Math.round(DEF_I[d].parts * GAR_UP.teile.f[S.garage.up.teile]); }
function genCar(){
  const rare = Math.random() < .05, m = pick(CAR_MODELS.filter(x => !!x.rare === rare));
  const year = m.id==='wolf' ? ri(1990,2000) : m.id==='golf2' ? ri(1985,1991) : ri(2003,2015);
  const wert = Math.round(ri(m.base[0], m.base[1])/50)*50;
  const defs = shuffle(DEFECTS).slice(0, ri(2,5)).map(d => ({id:d.id, hidden:Math.random() < .35, done:false}));
  const c = {uid:'c'+Date.now().toString(36)+ri(100,999), model:m.id, year, wert, defs, insp:false};
  c.price = Math.round(wert * Math.max(.25, 1 - carLoss(c, true)) * (.72 + Math.random()*.18) / 10) * 10;
  return c;
}

  const c = S.garage.cars.find(x => x.uid === a.uid); if(!c) return;
  const d = c.defs.find(x => x.id === a.def); if(d) d.done = true;
  events.push(CAR_I[c.model].name+': '+DEF_I[a.def].name+' erledigt.');

function ntgTick(events){
  const n = S.ntg;
  if(n.status === 'pending' && now() >= n.until){
    const chance = clamp(40 + rel('chef') + (4 - G.note())*15, 10, 95);
    if(Math.random()*100 < chance){ n.status = 'ok'; events.push('Hauptmann von Ahlen hat deine Nebentätigkeit genehmigt.'); }
    else { n.status = 'abgelehnt'; n.until = now() + 3*864e5/S.speed; events.push('Nebentätigkeit abgelehnt: „Konzentrieren Sie sich erst mal auf Ihren Dienst.“'); }
    n.ts = now();
  }
  if(n.status === 'ok' && G.note() >= 4){
    n.status = 'widerrufen'; n.ts = now(); n.until = now() + 3*864e5/S.speed;
    applyFx({rel:{chef:-3}});
    events.push('Deine Nebentätigkeitsgenehmigung wurde widerrufen. Die Beurteilung ist zu schlecht.');
  }
}

  if(S.einsatz) return h + '<div class="panel pad"><p style="margin:0">Im Feldlager gibt es keinen richtigen Feierabend. Nach der Rückkehr geht es hier weiter.</p></div>' + renderStubenrundeBox();
  if(S.dienst) h += '<div class="panel pad" style="margin-bottom:12px"><p style="margin:0"><b>Du bist noch im Dienst.</b> Feierabend gibt es erst danach.</p></div>';
  else if(S.fa){
    const t = S.fa.type === 'pfand' ? 'Leergut sammeln: '+PF_ROUTES.find(r=>r.id===S.fa.route).name
      : (()=>{ const c = S.garage.cars.find(x=>x.uid===S.fa.uid); return 'Schrauben: '+(c ? CAR_I[c.model].name+', ' : '')+DEF_I[S.fa.def].name; })();
    h += '<div class="panel" style="margin-bottom:12px"><div class="active"><div class="head"><span>'+esc(t)+'</span><span class="num" data-left="fa"></span></div><div class="prog"><i data-prog="fa"></i></div></div></div>';
  } else h += '<p class="small muted">Feierabend kostet keine Ausdauer. Während du hier beschäftigt bist, kannst du keinen Dienst antreten.</p>';

  // Leergut
  const kurs = kalleKursHeute(), stock = pfStock(), lagerCap = PF_LAGER[S.pfand.lager].cap;

    + '<div><div class="small muted">Im Lager ('+esc(PF_LAGER[S.pfand.lager].name)+')</div><div class="num" style="font-size:24px">'+stock+' / '+lagerCap+'</div>'
    + '<div class="small muted">'+S.pfand.ew+' Einweg zu 0,25 €, '+S.pfand.mw+' Mehrweg zu 0,08 €</div></div>'
    + '<div style="text-align:right"><div class="small muted">Wert am Automaten</div><div class="num" style="font-size:24px">'+eur2(pfWert())+'</div></div></div>'
    + '<div class="bar2"><i style="width:'+Math.min(100, stock/lagerCap*100)+'%;background:var(--signal)"></i></div>'
    + '<button class="btn wide" style="margin-top:10px" data-act="pf_auto" '+(stock ? '' : 'disabled')+'>Am Pfandautomaten abgeben ('+eur2(pfWert())+')</button>'
    + '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>Kalles Großankauf</b><span class="num" style="font-size:20px;color:'+(kurs>=1?'var(--ok)':'var(--bad)')+'">'+Math.round(kurs*100)+' %</span></div>'
    + '<p class="small muted" style="margin:2px 0 6px">Kalle zahlt einen Tageskurs auf das Pfand, der sich jede Stunde ändert. Er nimmt erst ab 300 Flaschen.</p>'
    + kurvenSvg()
    + '<button class="btn ghost wide" style="margin-top:8px" data-act="pf_kalle" '+(stock >= 300 ? '' : 'disabled')+'>An Kalle verkaufen ('+eur2(ct(pfWert()*kurs))+')</button></div></div>';
  h += '<div class="cards" style="margin-top:12px">' + PF_ROUTES.map(r => {
    const ok = S.pfand.trans >= r.req, run = S.fa && S.fa.type==='pfand' && S.fa.route===r.id;
    const inner = '<p class="flv">'+esc(r.desc)+'</p>' + facts([['Dauer', fmtMin(r.min/S.speed)], ['Ausbeute', 'bis '+Math.round((r.ew[1]+r.mw[1])*(1+.02*S.stats.fitness))]])
      + (run ? '<div class="small">Zurück in <span class="num" data-left="fa"></span></div><div class="prog" style="margin:0"><i data-prog="fa"></i></div>'
        : !ok ? '<div class="lock">Braucht: '+esc(PF_TRANS[r.req].name)+'</div>'
        : '<button class="btn wide" data-act="pf_run" data-id="'+r.id+'" '+(feOpen()?'':'disabled')+'>Losziehen</button>');
    return acard(r.name, 'bottles', inner, run);
  }).join('') + '</div>';
  const tN = PF_TRANS[S.pfand.trans+1], lN = PF_LAGER[S.pfand.lager+1];
  h += '<div class="panel" style="margin-top:12px">'
    + '<div class="row"><div class="info"><div class="title">Transport: '+esc(PF_TRANS[S.pfand.trans].name)+'</div><div class="meta">Bis '+PF_TRANS[S.pfand.trans].cap+' Flaschen pro Runde'+(tN ? '. Als Nächstes: '+esc(tN.name)+' ('+tN.cap+') für '+eur(tN.cost) : '')+'</div></div>'
    + (tN ? '<button class="btn" data-act="pf_up" data-id="trans" '+(S.money<tN.cost?'disabled':'')+'>Kaufen</button>' : '<span class="small muted">fertig</span>')+'</div>'
    + '<div class="row"><div class="info"><div class="title">Lager: '+esc(PF_LAGER[S.pfand.lager].name)+'</div><div class="meta">Platz für '+lagerCap+' Flaschen'+(lN ? '. Als Nächstes: '+esc(lN.name)+' ('+lN.cap+') für '+eur(lN.cost) : '')+'</div></div>'
    + (lN ? '<button class="btn" data-act="pf_up" data-id="lager" '+(S.money<lN.cost?'disabled':'')+'>Kaufen</button>' : '<span class="small muted">fertig</span>')+'</div></div>';

  // Schrauben
  h += '<h2>Schrauben</h2>';
  const n = S.ntg, rest = Math.max(0, NTG_FREI - salesRecent());
  h += '<div class="panel pad"><p style="margin:0 0 6px"><b>Nebentätigkeit:</b> '
    + (n.status==='ok' ? 'genehmigt von Hauptmann von Ahlen. Du kannst so viele Autos verkaufen, wie du willst, solange deine Beurteilung mindestens „befriedigend“ bleibt.'
      : n.status==='pending' ? 'Antrag liegt beim Kompaniechef, Entscheidung in '+fmtRest(n.until - now())+'.'
      : 'nicht genehmigt. Privat darfst du '+NTG_FREI+' Autos in 30 Tagen verkaufen, noch '+rest+'. Wer regelmäßig handelt, braucht eine Genehmigung vom Kompaniechef.')
    + (n.status==='abgelehnt' || n.status==='widerrufen' ? ' Zuletzt '+n.status+'.' : '') + '</p>'
    + (n.status!=='ok' && n.status!=='pending'
      ? '<button class="btn ghost" data-act="ntg" '+((G.note() > 3 || (n.until && now() < n.until)) ? 'disabled' : '')+'>Nebentätigkeit beantragen</button>'
        + (G.note() > 3 ? '<span class="small muted"> Erst ab Beurteilung „befriedigend“.</span>' : (n.until && now() < n.until) ? '<span class="small muted"> Neuer Antrag in '+fmtRest(n.until - now())+'.</span>' : '')
      : '')
    + '</div>';

  // Eigene Autos
  h += '<p class="small muted" style="margin-top:12px">Deine Stellplätze: '+S.garage.cars.length+' von '+carCap()+'. Nachfrage heute: '+CATS.map(c=>CAT_NAME[c]+' '+nachfrageText(nachfrage(c))).join(', ')+'.</p>';
  if(S.garage.cars.length){
    h += '<div class="cards">' + S.garage.cars.map(c => {
      const m = CAR_I[c.model], wert = carValue(c), offen = c.defs.filter(x=>!x.done);
      let inner = facts([['Baujahr', c.year], ['Eingesetzt', eur(c.invest)], ['Wert jetzt', eur(wert)]]);
      inner += '<ul class="reqmini">' + c.defs.map(x => {
        const run = S.fa && S.fa.type==='fix' && S.fa.uid===c.uid && S.fa.def===x.id;
        return '<li class="'+(x.done?'ok':'no')+'"><b>'+(x.done?'✓':'✗')+'</b><span>'+esc(DEF_I[x.id].name)
          + (x.done ? '' : run ? ' <span class="num" data-left="fa"></span>'
            : '<br><button class="btn ghost mini" data-act="car_fix" data-id="'+c.uid+':'+x.id+'">Reparieren ('+fmtMin(fixMin(x.id)/S.speed)+', '+eur(fixCost(x.id))+')</button>')
          + '</span></li>';
      }).join('') + '</ul>';
      if(!c.listed) inner += '<button class="btn wide" data-act="car_list" data-id="'+c.uid+'">Inserieren für rund '+eur(wert)+'</button>'
        + (offen.length ? '<div class="small muted">Jeder reparierte Mangel steigert den Preis.</div>' : '');
      else {
        const vis = (c.offers||[]).filter(o => o.t <= now() && !o.gone);
        inner += '<div class="small"><b>Inseriert.</b> '+(vis.length ? 'Angebote:' : 'Noch keine Angebote, warte etwas.')+'</div>'
          + vis.map((o,i) => '<div style="display:flex;gap:6px;align-items:center;justify-content:space-between"><span class="small">'+esc(o.who)+': <b>'+eur(o.amount)+'</b></span>'
            + '<span style="display:flex;gap:4px"><button class="btn" style="min-height:34px;padding:4px 10px" data-act="car_sell" data-id="'+c.uid+':'+o.k+'" '+(darfVerkaufen()?'':'disabled')+'>Annehmen</button>'
            + (o.h ? '' : '<button class="btn ghost" style="min-height:34px;padding:4px 8px" data-act="car_haggle" data-id="'+c.uid+':'+o.k+'">Mehr?</button>')+'</span></div>').join('')
          + (darfVerkaufen() ? '' : '<div class="lock">Für einen weiteren Verkauf brauchst du die Nebentätigkeitsgenehmigung.</div>')
          + '<button class="linkbtn" style="padding:2px 0" data-act="car_unlist" data-id="'+c.uid+'">Inserat zurückziehen</button>';
      }
      return acard(m.name, 'carfix', inner, S.fa && S.fa.type==='fix' && S.fa.uid===c.uid);
    }).join('') + '</div>';
  }

  // Markt
  const offers = marktOffers();
  h += '<h2>Kleinanzeigen</h2><p class="small muted">Neue Angebote in '+fmtRest(S.garage.markt.until - now())+'. Nicht alle Mängel stehen in der Anzeige, eine Besichtigung deckt sie mit etwas Fachwissen auf.</p><div class="cards">'
    + offers.map(c => {
      const m = CAR_I[c.model];
      const inner = facts([['Baujahr', c.year], ['Preis', eur(c.price)], ['Nachfrage', nachfrageText(nachfrage(m.cat))]])
        + '<div class="small" style="text-align:left"><b>Laut Anzeige:</b> '+(c.defs.filter(x=>!x.hidden).map(x=>esc(DEF_I[x.id].name)).join(', ') || 'angeblich alles in Ordnung')+'</div>'
        + (c.insp ? '<div class="small muted" style="text-align:left">Besichtigt.</div>' : '<button class="btn ghost wide" data-act="car_insp" data-id="'+c.uid+'">Besichtigen</button>')
        + '<button class="btn wide" data-act="car_buy" data-id="'+c.uid+'" '+((S.money < c.price || S.garage.cars.length >= carCap()) ? 'disabled' : '')+'>Kaufen<small>'+eur(c.price)+'</small></button>';
      return acard(m.name+(m.rare ? ' ★' : ''), 'carfix', inner);
    }).join('') + '</div>';

  // Werkstatt
  h += '<h2>Werkstatt</h2><div class="panel">' + Object.entries(GAR_UP).map(([k,u]) => {
    const l = S.garage.up[k], nx = l+1 < u.lv.length;
    return '<div class="row"><div class="info"><div class="title">'+esc(u.name)+': '+esc(u.lv[l])+'</div><div class="meta">'+esc(u.fx)+(nx ? '. Als Nächstes: '+esc(u.lv[l+1])+' für '+eur(u.cost[l+1]) : '')+'</div></div>'
      + (nx ? '<button class="btn" data-act="gar_up" data-id="'+k+'" '+(S.money < u.cost[l+1] ? 'disabled' : '')+'>Kaufen</button>' : '<span class="small muted">fertig</span>')+'</div>';
  }).join('') + '</div>';

  return h + renderSpielothek() + renderStubenrundeBox();
}

}

function tskText(str){
  if(!S || S.tsk !== 'marine') return str;

  for(const id of ids){ out = out.replace(new RegExp('(?<![A-Za-z\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df])'+RANK_BASE[id]+'(?![a-z\u00e4\u00f6\u00fc\u00df])', 'g'), TSK_RANKS.marine[id]); }
  return out;
}

/* ---------- Ausbildung mit Ausdauer verkürzen ---------- */
const KURZ_RATE = 10;   // Ausdauer pro Stunde Ausbildungszeit
function kurzRestH(){ return S.ausb && S.ausb.type === 'stat' ? Math.max(0, (S.ausb.end - now()) / (36e5/S.speed)) : 0; }
function kurzStunden(opt){
  G.normStamina();
  const rest = kurzRestH(), moeglich = S.stamina / KURZ_RATE;
  return opt === 'max' ? Math.min(rest, moeglich) : Math.min(Number(opt), rest, moeglich);
}
function kurzKosten(h){ return Math.min(S.stamina, Math.ceil(h * KURZ_RATE - 1e-9)); }
function fmtStd(h){ return h >= 1 ? (Math.round(h*10)/10).toLocaleString('de-DE') + (h === 1 ? ' Stunde' : ' Stunden') : Math.max(1, Math.round(h*60)) + ' Minuten'; }
function kurzRender(){
  if(!S.ausb || S.ausb.type !== 'stat'){ ACT.close(); return; }
  G.normStamina();
  const rest = kurzRestH();
  const opts = [['1', '1 Stunde'], ['5', '5 Stunden'], ['max', 'So viel wie möglich']];
  document.getElementById('modalHost').innerHTML = '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="kzt"><div class="sheet ev">'
    + '<h2 id="kzt" style="margin:0 0 6px">Ausbildung verkürzen</h2>'
    + '<p class="small" style="margin:0 0 4px"><b>'+STAT_NAME[S.ausb.id]+'</b> auf Stufe '+(S.stats[S.ausb.id]+1)+', Restdauer '+fmtRest(S.ausb.end - now())+'.</p>'
    + '<p class="small muted" style="margin:0 0 10px">'+KURZ_RATE+' Ausdauer verkürzen die Ausbildung um eine Stunde. Du hast '+S.stamina+' Ausdauer.</p>'
    + '<div class="choices">' + opts.map(([v,l]) => {
        const h = kurzStunden(v), c = kurzKosten(h), ok = h > 0 && c > 0 && (v === 'max' || Number(v) <= rest + 1e-9 || h >= rest - 1e-9);
        return '<button class="btn ghost choice" data-act="kurz" data-id="'+v+'" '+(ok ? '' : 'disabled')+'><span><b>'+l+'</b>'+(ok ? ': '+fmtStd(h)+' für '+c+' Ausdauer' : '')+'</span>'
          + (ok && h >= rest - 1e-9 ? '<span class="small muted">Damit ist die Ausbildung sofort fertig.</span>' : '') + '</button>';
      }).join('') + '</div>'
    + '<p class="small muted" style="margin:10px 0 0">Ausdauer, die du hier einsetzt, fehlt dir für Dienste.</p>'
    + '<button class="btn wide" data-act="close" style="margin-top:12px">Zurück</button></div></div>';
}

function splitSecs(html){

    const m = h.match(/^<h2>([\s\S]*?)<\/h2>/);

function runStrip(){

  if(S.dienst) it.push(['dienst', D[S.dienst.id].name]);

  if(S.lg) it.push(['lg', L[S.lg.id].name + (S.lg.exam ? ', Prüfung wartet' : '')]);
  if(S.fa) it.push(['fa', S.fa.type === 'pfand' ? 'Leergut sammeln' : 'Schrauben']);

function renderPage(){
  const subs = (SUBS[tab] || []).filter(x => x.src !== 'truppe' || typeof renderTruppe === 'function');
  if(!subs.length) return runStrip();
  const parts = subs.map(x => ({x, html:''}));
  for(const src of [...new Set(subs.map(x => x.src))]){
    for(const sec of splitSecs(pageSrc(src))){
      if(SUB_DROP.includes(sec.title)) continue;
      // Abschnitte, die ein anderer Hauptbereich für sich beansprucht, hier überspringen
      const hit = x => x.src === src && x.match.some(m => sec.title === m || sec.title.startsWith(m + ' '));
      if(!subs.some(hit) && Object.entries(SUBS).some(([k, l]) => k !== tab && l.some(hit))) continue;
      let t = parts.find(p => p.x.src === src && p.x.match.some(m => sec.title === m || sec.title.startsWith(m + ' ')));
      if(!t) t = parts.find(p => p.x.src === src && p.x.rest);
      if(t) t.html += sec.html;
    }
  }
  const vis = parts.filter(p => p.html.replace(/<[^>]*>/g, '').trim());
  if(!vis.length) return runStrip();
  const cur = vis.find(p => p.x.id === SUB[tab]) || vis[0];
  LASTSUB[tab] = cur.x.id;
  const nav = vis.length > 1 ? '<div class="subnav" role="group" aria-label="Unterbereiche">' + vis.map(p => '<button data-act="sub" data-id="' + p.x.id + '" aria-pressed="' + (p === cur) + '">' + p.x.label + '</button>').join('') + '</div>' : '';
  return nav + runStrip() + cur.html;
}

function hasGear(id){ return !!(S && S.gear && S.gear[id]); }

function unlocksFor(id){
  const cur = S.rank;
  const before = new Set(DIENSTE.filter(d=>!G.dienstLock(d)).map(d=>d.id));
  const gb = new Set(GEAR.filter(g=>g.req(R[cur])).map(g=>g.id));
  S.rank = id;
  const out = [
    ...DIENSTE.filter(d => !G.dienstLock(d) && !before.has(d.id) && !(d.hideFor && d.hideFor.includes(R[id].g))).map(d=>'Dienst „'+d.name+'“'),
    ...GEAR.filter(g => g.req(R[id]) && !gb.has(g.id)).map(g=>g.name),
    ...EINSATZ.filter(e => e.req(R[id]) && !e.req(R[cur])).map(e=>'Auslandseinsatz „'+e.name+'“')
  ];
  S.rank = cur;
  return out;
}

function rel(k){ return (S && S.rel && S.rel[k]) || 0; }
function migrate(){
  S.rel = Object.assign({spiess:0,chef:0,kalle:0,lena:0,dennis:0,krueger:0}, S.rel||{});
  S.lgNote = S.lgNote || {}; S.lgRetry = S.lgRetry || {};
  S.flags = S.flags || {}; S.pending = S.pending || []; S.seen = S.seen || {};
  S.stube = Object.assign({bett:0,spind:0,kaffee:0,kuehl:0,hantel:0}, S.stube||{});
  if(S.verw === undefined) S.verw = null;
  if(!S.tsk) S.tsk = 'heer';
  if(S.lg === undefined) S.lg = null;
  if(S.ausb && S.ausb.type === 'lehrgang' && S.ausb.cps){ S.lg = S.ausb; S.ausb = null; }
  if(!S.tut) S.tut = {step:0, done:true};
  if(S.pflege === undefined) S.pflege = null;
  if(pflegePflicht() && !S.pflege && !S.pflegeFrist) S.pflegeFrist = now() + 3*864e5/S.speed;
  if(!S.start) S.start = (S.history && S.history[0] && S.history[0].ts) || now();
  if(S.gaDone === undefined) S.gaDone = S.rank !== 'sdt';
  if(!S.verpfl){
    const r = R[S.rank];
    S.verpfl = (r.g==='G' || (r.g==='O' && r.t>=13)) ? 'BS' : (r.g==='A' || r.g==='O') ? 'SaZ13'
      : (r.g==='U' || r.g==='F' || r.spec) ? 'SaZ8' : 'FWD';
  }
  S.dc = S.dc || {}; S.res = S.res || 0; S.gear = S.gear || {};
  S.einsaetze = S.einsaetze || []; if(S.einsatz === undefined) S.einsatz = null;
  S.album = S.album || {}; if(S.pakete === undefined) S.pakete = 1;
}
