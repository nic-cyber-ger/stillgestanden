   {t:'Nichts tun', out:{t:'Der Vormittag zieht sich. Brockmann ist unerträglich.', fx:{rel:{spiess:-2}}}},
  ]},
 {id:'g_hund', who:'lena', text:'Ein streunender Hund hat sich auf das Kasernengelände geschlichen und wedelt dich an.',
  ch:[
   {t:'Ihm etwas vom Frühstück geben', out:{t:'Er folgt dir den ganzen Tag. Die Kompanie nennt ihn „Gefreiter Bello“.', fx:{rel:{lena:3, dennis:3}}}},
   {t:'Der Wache melden', out:{t:'Der Hund wird abgeholt und kommt ins Tierheim. Vorbildlich, aber ein bisschen traurig.', fx:{bp:2}}},
   {t:'Lena fragen', out:{t:'Lena kennt jemanden, der einen Hund sucht. Am Abend hat Bello ein Zuhause.', fx:{bp:1, rel:{lena:5}}}},
  ]},
 // Gruppen
 {id:'m_uffzfrage', who:'chef', groups:['M'], text:'Der Kompaniechef fragt im Flur, ob du dir vorstellen kannst, Unteroffizier zu werden.',
  ch:[
   {t:'„Unbedingt, Herr Hauptmann!“', out:{t:'Er nickt zufrieden und macht sich eine Notiz.', fx:{bp:3, rel:{chef:3}}}},
   {t:'„Ich überlege noch.“', out:{t:'„Gut. Überlegen ist erlaubt.“', fx:{bp:1}}},
   {t:'„Mir gefällt es hier unten.“', out:{t:'Kalle und Dennis klopfen dir auf die Schulter.', fx:{rel:{kalle:2, dennis:2}}}},
  ]},
 {id:'u_rekrutenspind', who:'spiess', groups:['U','F'], text:'Stubendurchgang in zehn Minuten. Der Spind eines deiner Rekruten sieht aus wie nach einem Erdbeben.',
  ch:[
   {t:'Mit anpacken', out:{t:'Zu zweit schafft ihr es. Der Rekrut ist dir dankbar.', fx:{st:-8, bp:2}}},
   {t:'Ihm zeigen, wie es geht, und ihn machen lassen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Er schafft es allein. Brockmann sieht es und nickt dir zu.', fx:{bp:5, rel:{spiess:3}}},
     fail:{t:'Nicht ganz fertig. Brockmann schaut dich an, nicht den Rekruten.', fx:{bp:-2}}},
  ]},
 {id:'o_lagevortrag', who:'chef', groups:['O'], text:'Der Bataillonskommandeur will in dreißig Minuten einen Lagevortrag. Von dir.',
  ch:[
   {t:'Frei sprechen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Klar, kurz, ohne Folien. Der Kommandeur ist beeindruckt.', fx:{bp:7, rel:{chef:4}}},
     fail:{t:'Du verlierst dich in Details. Der Kommandeur schaut zweimal auf die Uhr.', fx:{bp:-2}}},
   {t:'Schnell drei Folien bauen', out:{t:'Solide. Von Ahlen ist stolz auf die Folien.', fx:{bp:3, rel:{chef:3}}}},
  ]},
 {id:'gen_kirmes', who:'chef', groups:['G'], text:'Der Bürgermeister der Garnisonsstadt lädt dich als Ehrengast zur Kirmes ein. Mit Bieranstich.',
  ch:[
   {t:'Den Bieranstich übernehmen', roll:{stat:'fitness', base:45},
     ok:{t:'Zwei Schläge, kein Tropfen daneben. Die Lokalzeitung druckt das Foto.', fx:{bp:5}},
     fail:{t:'Der Zapfhahn sitzt, du bist nass. Die Lokalzeitung druckt das Foto.', fx:{bp:1}}},
   {t:'Höflich absagen', out:{t:'Der Bürgermeister ist enttäuscht. Die Kompanie geht ohne dich.', fx:{bp:-1}}},
  ]},
 // Feierabend
 {id:'f_pfand_revier', who:'kalle', ctx:['pfand'], text:'Ein Soldat aus der Nachbarkompanie sammelt auch Leergut. Ihr steht euch vor dem Mannschaftsheim gegenüber.',
  ch:[
   {t:'Das Gelände aufteilen', out:{t:'Du nimmst die Westseite, er die Ostseite. Fair.', fx:{money:5}}},
   {t:'Wettrennen zum Sportplatz', roll:{stat:'fitness', base:45},
     ok:{t:'Erster! Die Kisten am Sportplatz gehören dir.', fx:{money:15}},
     fail:{t:'Er war schneller und winkt dir mit einem vollen Einkaufswagen.', fx:{st:-10}}},
   {t:'Gemeinsame Sache bei Kalle machen', out:{t:'Kalle zahlt für die größere Menge einen besseren Kurs.', fx:{money:10, rel:{kalle:3}}}},
  ]},
 {id:'f_pfand_spiess', who:'spiess', ctx:['pfand'], text:'Brockmann sieht dich mit einem vollen Einkaufswagen Leergut über den Kasernenhof schieben.',
  ch:[
   {t:'Erklären, was du da machst', roll:{stat:'vitaminb', base:40},
     ok:{t:'„Na dann.“ Er holt seine eigene Kiste aus dem Geschäftszimmer und stellt sie dazu.', fx:{money:6, rel:{spiess:3}}},
     fail:{t:'„Das hier ist ein militärischer Bereich und kein Wertstoffhof.“', fx:{bp:-2}}},
   {t:'Schnell weiterschieben', roll:{stat:'fitness', base:50},
     ok:{t:'Um die Ecke und weg. Er hat dich wohl nicht erkannt.', fx:{}},
     fail:{t:'Ein Rad klemmt. Brockmann hat Zeit.', fx:{bp:-3}}},
  ]},
 {id:'f_fix_teil', who:'kalle', ctx:['fix'], text:'Beim Schrauben merkst du: Das gelieferte Ersatzteil ist für das Vorgängermodell.',
  ch:[
   {t:'Passend machen', roll:{stat:'fachwissen', base:45},
     ok:{t:'Etwas feilen, etwas biegen, passt. Gespart hast du dir den Rückversand.', fx:{money:40}},
     fail:{t:'Jetzt passt es gar nicht mehr. Du bestellst neu.', fx:{money:-60}}},
   {t:'Zurückschicken', out:{t:'Zwei Tage Warten, aber sauber.', fx:{st:-5}}},
   {t:'Kalle fragen', out:{t:'Kalle hat zufällig genau das richtige Teil. Im Kofferraum.', fx:{money:-20, rel:{kalle:2}}}},
  ]},
 {id:'f_fix_dennis', who:'dennis', ctx:['fix'], text:'Dennis kommt auf den Parkplatz und will dir „mal eben helfen“.',
  ch:[
   {t:'Ihn machen lassen', roll:{stat:'fachwissen', base:45},
     ok:{t:'Unter deiner Anleitung schraubt er ordentlich. Er ist stolz wie Bolle.', fx:{rel:{dennis:5}}},
     fail:{t:'Er hat die Ölablassschraube abgerissen. Neue kostet 50 Euro.', fx:{money:-50, rel:{dennis:3}}}},
   {t:'Ihn Kaffee holen schicken', out:{t:'Er kommt mit zwei Bechern und einer Tüte Brötchen zurück. Auch eine Hilfe.', fx:{st:5, rel:{dennis:1}}}},
   {t:'„Danke, geht schon.“', out:{t:'Dennis zieht ein bisschen enttäuscht ab.', fx:{rel:{dennis:-2}}}},
  ]},
 {id:'f_fix_auftrag', who:'chef', ctx:['fix'], text:'Ein Kamerad fragt, ob du gegen Bezahlung auch mal an seinem Auto schraubst.',
  ch:[
   {t:'Machen, gegen 80 €', roll:{stat:'vitaminb', base:50},
     ok:{t:'Bremsbeläge gewechselt, 80 € in der Tasche, alle zufrieden.', fx:{money:80, st:-5}},
     fail:{t:'Der Kompaniechef bekommt Wind davon: bezahlte Arbeit ohne Nebentätigkeitsgenehmigung.', fx:{money:80, bp:-4, rel:{chef:-4}}}},
   {t:'Kostenlos, unter Kameraden', out:{t:'Du schraubst eine Stunde. Er bringt dafür einen Kasten Wasser vorbei.', fx:{st:-5, rel:{kalle:1, lena:1}}}},
   {t:'Ablehnen', out:{t:'Verständlich. Er fragt jemand anderen.', fx:{}}},
  ]},
 // Teilstreitkräfte (zweiter Schwung)
 {id:'h_biwak', who:'dennis', tsk:'heer', ctx:['gelaende','uebung'], text:'Biwak im Regen. Du teilst das Zelt mit Dennis. Dennis schnarcht wie ein Schützenpanzer.',
  ch:[
   {t:'Ohrstöpsel aus dem Erste-Hilfe-Päckchen', roll:{stat:'fachwissen', base:45},
     ok:{t:'Taschentuch, zusammengerollt. Wirkt Wunder.', fx:{st:10}},
     fail:{t:'Das war das Pflaster. Es hilft nicht.', fx:{st:-10}}},
   {t:'Dennis sanft umdrehen', out:{t:'Er hört auf. Fünf Minuten lang.', fx:{st:-5, rel:{dennis:1}}}},
   {t:'Draußen unter der Plane schlafen', out:{t:'Ruhig, aber nass.', fx:{st:-8, bp:1}}},
  ]},
 {id:'lw_nebel', who:'kalle', tsk:'lw', ctx:['lw_flugplatz','lw_radar_d','lw_vorfeld'], text:'Dichter Nebel. Flugbetrieb eingestellt. Die ganze Staffel steht im Hangar und hat plötzlich Zeit.',
  ch:[
   {t:'Hangar-Fußball', out:{t:'Zwei Tore aus Werkzeugkisten, ein Ball aus Klebeband. Bestes Spiel des Jahres.', fx:{st:-5, rel:{kalle:3, lena:3}}}},
   {t:'Nachschulung am Simulator', out:{t:'Zwei Stunden sinnvoll genutzt. Der Staffelchef sieht es.', fx:{bp:4}}},
   {t:'Im Ruheraum schlafen', out:{t:'Der Nebel hält bis Mittag. Du auch.', fx:{st:15}}},
  ]},
 {id:'m_aequator', who:'spiess', tsk:'marine', ctx:['m_seewache'], text:'Äquatortaufe! Neptun persönlich kommt an Bord. Er trägt einen Bart aus Tauwerk und klingt verdächtig nach Brockmann.',
  ch:[
   {t:'Tapfer durchziehen', roll:{stat:'fitness', base:40},
     ok:{t:'Fischsud, Mehl und ein Bad im Taufbecken. Du bekommst deine Taufurkunde und einen Seemannsnamen.', fx:{bp:3, rel:{spiess:4}}},
     fail:{t:'Der Fischsud war mehr, als dein Magen erwartet hatte. Urkunde gibt es trotzdem.', fx:{st:-15, rel:{spiess:2}}}},
   {t:'Sich drücken', out:{t:'Neptun findet dich trotzdem. Er findet jeden.', fx:{st:-5, rel:{spiess:-3}}}},
  ]},
 {id:'m_gangway', who:'chef', tsk:'marine', ctx:['m_hafenwache'], text:'An der Gangway taucht unangekündigt ein Admiral mit Gefolge auf. Du bist allein auf Wache.',
  ch:[
   {t:'Vorschriftsmäßig melden und pfeifen', roll:{stat:'fachwissen', base:40},
     ok:{t:'Bootsmannsmaatenpfeife, Meldung, Haltung. Der Admiral nickt dir zu.', fx:{bp:6, rel:{chef:3}}},
     fail:{t:'Die Pfeife quietscht. Der Admiral lächelt höflich.', fx:{bp:-1}}},
   {t:'Schnell den Wachhabenden holen', out:{t:'Korrekt, aber der Admiral steht zwei Minuten allein an der Gangway.', fx:{bp:1}}},
  ]},

 // Teilstreitkr\u00e4fte
 {id:'lw_kranich', who:'spiess', tsk:'lw', ctx:['lw_vorfeld','lw_flugplatz'], text:'Ein Kranich steht mitten auf der Startbahn. In zehn Minuten landet eine Maschine. Der Kranich sieht nicht aus, als h\u00e4tte er Termine.',
  ch:[
   {t:'Vorsichtig verscheuchen', roll:{stat:'fitness', base:45},
     ok:{t:'Mit ausgebreiteten Armen und viel W\u00fcrde. Der Kranich geht, die W\u00fcrde bleibt.', fx:{bp:5}},
     fail:{t:'Der Kranich verscheucht dich.', fx:{bp:-2, rel:{kalle:2}}}},
   {t:'Den Tower informieren', out:{t:'Die Landung wird verschoben, der Kranich bekommt eine Eskorte und du ein Lob.', fx:{bp:3, rel:{spiess:2}}}},
   {t:'Ein Foto machen', out:{t:'Das Foto geht durch die ganze Staffel. Der Kranich ist jetzt Maskottchen.', fx:{rel:{kalle:3, dennis:2}}}},
  ]},
 {id:'lw_laerm', who:'chef', tsk:'lw', text:'Eine Anwohnerin steht am Tor und beschwert sich \u00fcber Flugl\u00e4rm. Sie hat eine Liste mitgebracht. Mit Uhrzeiten.',
  ch:[
   {t:'Geduldig zuh\u00f6ren', roll:{stat:'fuehrung', base:35},
     ok:{t:'Nach einer Stunde ist sie bes\u00e4nftigt und l\u00e4dt dich zum Kuchen ein.', fx:{bp:5, rel:{chef:3}}},
     fail:{t:'Nach einer Stunde hat sie eine zweite Liste.', fx:{bp:1}}},
   {t:'An die Pressestelle verweisen', out:{t:'Korrekt und folgenlos. Sie kommt n\u00e4chste Woche wieder.', fx:{bp:1}}},
  ]},
 {id:'m_seekrank', who:'dennis', tsk:'marine', ctx:['m_seewache'], text:'Erste Seewache bei Windst\u00e4rke sieben. Dein Magen ist mit der Gesamtsituation nicht einverstanden.',
  ch:[
   {t:'Tapfer durchhalten', roll:{stat:'fitness', base:40},
     ok:{t:'Du stehst die ganze Wache durch. Der Kommandant nickt dir zu.', fx:{bp:6}},
     fail:{t:'Die Reling und du, ihr seid jetzt eng befreundet.', fx:{st:-20}}},
   {t:'Zwieback aus der Komb\u00fcse holen', out:{t:'Hilft. Ein bisschen. Dennis isst daneben ein Mettbr\u00f6tchen.', fx:{bp:2, st:5}}},
  ]},
 {id:'m_moewe', who:'kalle', tsk:'marine', ctx:['m_hafenwache','m_reinschiff'], text:'Eine M\u00f6we landet neben dir an der Gangway und schaut sehr interessiert auf dein Fischbr\u00f6tchen.',
  ch:[
   {t:'Das Br\u00f6tchen verteidigen', roll:{stat:'fitness', base:40},
     ok:{t:'Gewonnen. Die M\u00f6we merkt sich dein Gesicht.', fx:{bp:1}},
     fail:{t:'Die M\u00f6we ist schneller. Kalle hat alles gefilmt.', fx:{rel:{kalle:3}}}},
   {t:'Teilen', out:{t:'Die M\u00f6we kommt ab jetzt jeden Tag. Mit Freunden.', fx:{st:5}}},
  ]},
 {id:'m_landgang', who:'lena', tsk:'marine', text:'Landgang in einem fremden Hafen. Lena will ins Museum, Kalle in die Hafenkneipe.',
  ch:[
   {t:'Mit Lena ins Museum', out:{t:'Seefahrt im 17. Jahrhundert. Lena ist begeistert, du ehrlich gesagt auch.', fx:{bp:2, rel:{lena:6}}}},
   {t:'Mit Kalle in die Hafenkneipe', roll:{stat:'vitaminb', base:45},
     ok:{t:'Kalle kennt den Wirt. Nat\u00fcrlich.', fx:{money:-40, rel:{kalle:6}}},
     fail:{t:'Die Rechnung ist h\u00f6her als gedacht.', fx:{money:-80, rel:{kalle:2}}}},
  ]},
 {id:'mx_sturm', who:'chef', ctx:['ex'], text:'Sturm im Einsatzgebiet. Das Schiff stampft, in der Messe fliegt das Geschirr.',
  ch:[
   {t:'Alles seefest zurren', roll:{stat:'fachwissen', base:40},
     ok:{t:'Nichts geht zu Bruch. Der Smut ist dir ewig dankbar.', fx:{ep:4}},
     fail:{t:'Die Kaffeemaschine geht fast \u00fcber Bord.', fx:{ep:1}}},
   {t:'In die Koje und abwarten', out:{t:'Du schl\u00e4fst erstaunlich gut. Wie in einer Wiege, nur lauter.', fx:{ep:1, st:10}}},
  ]},
 {id:'mx_kombuese', who:'kalle', ctx:['ex'], text:'Der Smut ist krank, und irgendwer muss f\u00fcr zweihundert Leute kochen.',
  ch:[
   {t:'Den Kochl\u00f6ffel \u00fcbernehmen', roll:{stat:'fachwissen', base:35},
     ok:{t:'Labskaus f\u00fcr alle, und es gibt Schlangen f\u00fcr Nachschlag.', fx:{ep:4, rel:{kalle:3}}},
     fail:{t:'Die Nudeln sind al dente. Sehr al dente.', fx:{ep:1}}},
   {t:'Dennis vorschlagen', out:{t:'Dennis kocht Ravioli aus der Dose. F\u00fcr zweihundert.', fx:{ep:1, rel:{dennis:-4}}}},
  ]},
 {id:'mx_mann', who:'spiess', ctx:['ex'], text:'\u00dcbung \u201eMann \u00fcber Bord\u201c. Die Puppe hei\u00dft Oskar und ist diese Woche schon zum dritten Mal im Wasser.',
  ch:[
   {t:'Als Erster am Rettungsring', roll:{stat:'fitness', base:40},
     ok:{t:'Oskar ist gerettet. Wieder.', fx:{ep:3}},
     fail:{t:'Du wirfst den Ring zielsicher neben Oskar.', fx:{ep:1}}},
   {t:'Ausguck halten und melden', out:{t:'Saubere Meldung, saubere Peilung. Lehrbuch.', fx:{ep:2}}},
  ]},
 {id:'mx_heim', who:'spiess', ctx:['ex'], einsatzEnd:true, text:'Einlaufen in den Heimathafen. Auf der Pier stehen Familien, ein Musikkorps und ganz vorne Brockmann.',
  ch:[
   {t:'Brockmann die Hand geben', out:{t:'Ein fester H\u00e4ndedruck. \u201eGut, dass Sie wieder da sind.\u201c', fx:{ep:2, rel:{spiess:6}}}},
   {t:'Erst mal ausschlafen, ohne Seegang', out:{t:'Vierzehn Stunden. Das Bett schwankt trotzdem noch.', fx:{ep:1, st:30}}},
   {t:'Allen ein Andenken mitbringen', out:{t:'Kalle bekommt eine Buddel, Lena ein Fernglas, Dennis ein Kissen in Fischform.', fx:{ep:2, money:-60, rel:{kalle:4, lena:4, dennis:4}}}},
  ]},
 {id:'lx_alarm', who:'chef', ctx:['ex'], text:'Alarmrotte! Zwei Maschinen m\u00fcssen in Minuten in der Luft sein, und du stehst am Vorfeld.',
  ch:[
   {t:'Ruhig die Checkliste abarbeiten', roll:{stat:'fachwissen', base:40},
     ok:{t:'Beide Maschinen starten p\u00fcnktlich. Der Kommodore hat es gesehen.', fx:{ep:4}},
     fail:{t:'Ein Bremskeil liegt noch da. Gerade noch gesehen.', fx:{ep:1}}},
   {t:'Rennen', roll:{stat:'fitness', base:45},
     ok:{t:'Du bist \u00fcberall gleichzeitig. Startfreigabe in Rekordzeit.', fx:{ep:3}},
     fail:{t:'Du stolperst \u00fcber ein Kabel. Die Maschinen starten trotzdem.', fx:{ep:0}}},
  ]},

 // Ereignisse f\u00fcr h\u00f6here Dienstgradgruppen
 {id:'u_heimweh', who:'spiess', groups:['U','F'], text:'Ein Rekrut aus deiner Gruppe sitzt abends allein auf der Treppe. Heimweh. Er will hinschmeißen.',
  ch:[
   {t:'Zuhören und ihm Mut machen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Am nächsten Morgen steht er als Erster beim Antreten.', fx:{bp:5, rel:{spiess:4}}},
     fail:{t:'Er bleibt. Vorerst. Bis Freitag will er es sich noch überlegen.', fx:{bp:1}}},
   {t:'Ihn zum Spieß schicken', out:{t:'Brockmann seufzt: „Dafür haben Sie doch Ihre Schulterklappen.“', fx:{bp:1, rel:{spiess:-2}}}},
   {t:'Ihm einen Döner von Kalle organisieren', out:{t:'Mit vollem Bauch sieht die Welt anders aus. Er bleibt.', fx:{money:-8, bp:3, rel:{kalle:2}}}},
  ]},
 {id:'u_inventur', who:'kalle', groups:['F'], text:'Materialprüfung: Laut Liste fehlen drei Spaten, ein Tarnnetz und ein Kanister. Kalle schaut verdächtig unschuldig.',
  ch:[
   {t:'Kalle direkt fragen', roll:{stat:'vitaminb', base:40},
     ok:{t:'Zehn Minuten später ist alles wieder da. Plus ein Kanister zu viel.', fx:{bp:4, rel:{kalle:2}}},
     fail:{t:'Kalle weiß von nichts. Die Liste bleibt falsch.', fx:{bp:-3}}},
   {t:'Eine Fehlmeldung schreiben', out:{t:'Korrekt. Kalle grüßt dich ab jetzt sehr förmlich.', fx:{bp:2, rel:{kalle:-5}}}},
   {t:'Die Liste kreativ anpassen', roll:{stat:'fachwissen', base:30},
     ok:{t:'Niemandem fällt es auf. Bis zur nächsten Prüfung.', fx:{bp:1}},
     fail:{t:'Brockmann zählt nach.', fx:{bp:-8, rel:{spiess:-8}}}},
  ]},
 {id:'a_offizierheim', who:'chef', groups:['A'], text:'Als Offizieranwärter isst du jetzt im Offizierheim. Am Tisch geht es um Rotwein. Ein Oberst fragt nach deiner Meinung zu einem bestimmten Weingut.',
  ch:[
   {t:'Ehrlich sagen: keine Ahnung', out:{t:'Der Oberst lacht laut. Ehrlichkeit kommt hier gut an.', fx:{bp:1, rel:{chef:2}}}},
   {t:'Irgendwas Kluges erfinden', roll:{stat:'vitaminb', base:35},
     ok:{t:'„Ein Kenner!“ Du wirst zur nächsten Weinprobe eingeladen.', fx:{bp:3, rel:{chef:5}}},
     fail:{t:'Das Weingut gehört dem Schwager des Obersts. Es liegt nicht in Frankreich.', fx:{rel:{chef:-4}}}},
  ]},
 {id:'o_vertretung', who:'chef', groups:['O'], text:'Hauptmann von Ahlen fährt in den Urlaub. „Sie vertreten mich. Ich habe eine kleine Übergabe vorbereitet.“ Die Übergabe hat 46 Folien.',
  ch:[
   {t:'Alles durcharbeiten', out:{t:'Du kennst jetzt jede Folie. Von Ahlen ist bei der Rückkehr gerührt.', fx:{st:-20, bp:8, rel:{chef:5}}}},
   {t:'Nur die Zusammenfassung lesen', roll:{stat:'fuehrung', base:35},
     ok:{t:'Folie 46 war ohnehin die einzig wichtige.', fx:{bp:6}},
     fail:{t:'Ausgerechnet Folie 23 hätte man lesen sollen.', fx:{bp:-4}}},
   {t:'Brockmann fragen, was wirklich wichtig ist', out:{t:'„Drei Dinge.“ Brockmann hatte mit allen dreien recht.', fx:{bp:5, rel:{spiess:5}}}},
  ]},
 {id:'o_beschaffung', who:'chef', groups:['O','G'], text:'Vor anderthalb Jahren hast du neue Stühle für den Besprechungsraum beantragt. Heute kommt die Antwort: Der Antrag muss auf dem neuen Formular neu gestellt werden.',
  ch:[
   {t:'Neu beantragen', out:{t:'Die Stühle kommen. Irgendwann.', fx:{bp:2, st:-5}}},
   {t:'Kalle fragen', out:{t:'Am nächsten Morgen stehen zwölf neue Stühle im Raum. Mit Inventarnummern einer anderen Kaserne.', fx:{money:-50, rel:{kalle:5}}}},
   {t:'Eine Beschwerde schreiben', roll:{stat:'fachwissen', base:40},
     ok:{t:'Deine Beschwerde ist so präzise, dass sie im Ministerium als Vorlage dient.', fx:{bp:5}},
     fail:{t:'Auch die Beschwerde muss auf das neue Formular.', fx:{bp:-2}}},
  ]},
 {id:'o_weihnachten', who:'spiess', groups:['O'], minT:12, text:'Als Kompaniechef hältst du die Rede beim Weihnachtsessen. Die Kompanie hat schon zwei Glühwein intus.',
  ch:[
   {t:'Kurz und herzlich', roll:{stat:'fuehrung', base:40},
     ok:{t:'Drei Sätze, echter Applaus. Lena wischt sich verstohlen über die Augen.', fx:{bp:4, rel:{spiess:5, kalle:3, lena:3}}},
     fail:{t:'Zu kurz. Jemand ruft „Zugabe!“, und es klingt nicht nett.', fx:{rel:{spiess:-2}}}},
   {t:'Mit Folien', out:{t:'Von Ahlen ist begeistert. Alle anderen nicht.', fx:{rel:{chef:6, kalle:-4, lena:-4}}}},
   {t:'Brockmann das Wort geben', out:{t:'Brockmann erzählt die Geschichte mit der Socke. Die Kompanie tobt.', fx:{rel:{spiess:8}}}},
  ]},
 {id:'g_presse', who:'chef', groups:['G'], text:'Pressetermin auf dem Übungsplatz. Eine Journalistin fragt, warum der Schützenpanzer im Hintergrund nicht fährt.',
  ch:[
   {t:'Ehrlich antworten', roll:{stat:'fuehrung', base:40},
     ok:{t:'Klare Worte. Der Artikel ist fair.', fx:{bp:6}},
     fail:{t:'Du sagst etwas zu viel. Das Ministerium ruft an.', fx:{bp:-3}}},
   {t:'„Das ist eine taktische Pause.“', roll:{stat:'vitaminb', base:35},
     ok:{t:'Die Journalistin lacht. Das Zitat wird berühmt.', fx:{bp:4}},
     fail:{t:'Das Zitat wird berühmt. Leider.', fx:{bp:-5}}},
   {t:'Auf den Pressesprecher verweisen', out:{t:'Sicher, langweilig, folgenlos.', fx:{bp:1}}},
  ]},
 {id:'g_kantine', who:'kalle', groups:['G'], text:'Truppenbesuch. Du willst mit den Soldaten in der Truppenküche essen statt im Offizierheim. An der Kasse steht Kalle. Er ist jetzt Kantinenpächter.',
  ch:[
   {t:'Bei Kalle essen', out:{t:'Kalle serviert persönlich. Das Schnitzel ist zum ersten Mal nicht grau.', fx:{st:10, rel:{kalle:10}}}},
   {t:'Das Protokoll einhalten', out:{t:'Im Offizierheim ist das Essen besser. Die Stimmung nicht.', fx:{rel:{chef:3, kalle:-3}}}},
  ]},

 // Auslandseinsatz (fx.ep = Einsatzpunkte)
 {id:'ex_container', who:'dennis', ctx:['ex'], text:'Dein Container für die nächsten Wochen: zwei Betten, ein Spind und eine Klimaanlage mit zwei Stufen, aus und Orkan. Dennis liegt schon im unteren Bett.',
  ch:[
   {t:'Klimaanlage auf Orkan', roll:{stat:'fitness', base:50},
     ok:{t:'Endlich kühl. Du schläfst wie ein Stein.', fx:{ep:2, st:10}},
     fail:{t:'Eine Erkältung bei 38 Grad Außentemperatur. Respekt.', fx:{st:-10}}},
   {t:'Mit Dennis ums Bett würfeln', roll:{stat:'vitaminb', base:50},
     ok:{t:'Unteres Bett. Dennis zieht murrend nach oben.', fx:{ep:1, rel:{dennis:-2}}},
     fail:{t:'Dennis gewinnt und schläft sofort wieder ein.', fx:{rel:{dennis:2}}}},
   {t:'Freiwillig oben schlafen', out:{t:'Dennis bedankt sich mit einem Schokoriegel aus seinem Geheimvorrat.', fx:{ep:1, rel:{dennis:4}}}},
  ]},
 {id:'ex_wlan', who:'kalle', ctx:['ex'], text:'Das WLAN im Betreuungscontainer schafft genau einen Videoanruf gleichzeitig. Die Schlange ist lang.',
  ch:[
   {t:'Anstellen', out:{t:'Nach zwei Stunden: fünf Minuten Videoanruf. Das Bild friert ein, aber zu Hause lacht jemand.', fx:{ep:1, st:-5}}},
   {t:'Kalle fragen', out:{t:'Kalle hat einen eigenen Router „organisiert“. Woher, bleibt sein Geheimnis.', fx:{ep:1, money:-20, rel:{kalle:4}}}},
   {t:'Einen Brief schreiben', out:{t:'Die Feldpost braucht drei Wochen. Dafür kommt eine Antwort mit Zeichnung zurück.', fx:{ep:2}}},
  ]},
 {id:'ex_hitze', who:'lena', ctx:['ex'], text:'42 Grad im Schatten, und es gibt keinen Schatten. Lena will trotzdem morgens um fünf laufen gehen.',
  ch:[
   {t:'Mitlaufen', roll:{stat:'fitness', base:35},
     ok:{t:'Sonnenaufgang über dem Lager, zehn Kilometer. Fast schön.', fx:{ep:2, rel:{lena:4}}},
     fail:{t:'Nach drei Kilometern trinkst du die ganze Wasserflasche auf einmal.', fx:{st:-15, rel:{lena:2}}}},
   {t:'Ausschlafen', out:{t:'Lena kommt verschwitzt zurück und sagt nichts. Das sagt genug.', fx:{st:10, rel:{lena:-2}}}},
  ]},
 {id:'ex_sprachmittler', who:'chef', ctx:['ex'], text:'Bei der Ausbildung der Partnersoldaten übersetzt ein Sprachmittler. Nach zehn Minuten merkst du: Deine Witze kommen nicht an. Seine schon.',
  ch:[
   {t:'Mit ihm als Team arbeiten', out:{t:'Ihr spielt euch die Bälle zu. Am Ende lachen alle, sogar über deine Witze.', fx:{ep:3}}},
   {t:'Selbst ein paar Wörter lernen', roll:{stat:'fachwissen', base:40},
     ok:{t:'Die Partnersoldaten sind beeindruckt und bringen dir noch mehr bei.', fx:{ep:4}},
     fail:{t:'Du hast versehentlich „Ziege“ statt „Ziel“ gesagt. Den ganzen Vormittag lang.', fx:{ep:1}}},
  ]},
 {id:'ex_besuch', who:'chef', ctx:['ex'], text:'Besuch aus dem Ministerium hat sich angekündigt. Das ganze Feldlager wird gefegt. Auch der Sand.',
  ch:[
   {t:'Eine Vorführung planen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Die Vorführung läuft perfekt. Der Besuch macht Fotos.', fx:{ep:3, bp:4}},
     fail:{t:'Bei der Vorführung fällt der Strom aus.', fx:{bp:-2}}},
   {t:'Ganz normal weiterarbeiten', out:{t:'Der Besuch findet das erfrischend ehrlich.', fx:{ep:2}}},
   {t:'Den Sand fegen', out:{t:'Der Wind macht die Arbeit in zwanzig Minuten rückgängig.', fx:{ep:1, st:-15}}},
  ]},
 {id:'ex_post', who:'dennis', ctx:['ex'], text:'Feldpost! Dennis bekommt ein Paket von seiner Oma. Inhalt: zwölf Gläser Gurken und Wollsocken.',
  ch:[
   {t:'Einen Gurkentausch anbieten', out:{t:'Für zwei Gläser Gurken gibt es deinen Kaffee-Vorrat. Fairer Handel.', fx:{ep:1, rel:{dennis:3}}}},
   {t:'Auf dein eigenes Paket warten', out:{t:'Zwei Tage später kommt es. Inhalt: deine Lieblingsschokolade, geschmolzen.', fx:{ep:1}}},
  ]},
 {id:'ex_konvoi', who:'chef', ctx:['ex'], text:'Beim Konvoi bleibt ein Lkw liegen. Die Kolonne steht, und bis zur Dunkelheit bleibt noch eine Stunde.',
  ch:[
   {t:'Selbst reparieren', roll:{stat:'fachwissen', base:35},
     ok:{t:'Ein lockeres Kabel. Fünf Minuten, dann geht es weiter.', fx:{ep:4}},
     fail:{t:'Abschleppen. Ankunft nach Mitternacht.', fx:{st:-10}}},
   {t:'Abschleppen lassen', out:{t:'Langsam, aber nach Vorschrift.', fx:{ep:2}}},
   {t:'Die Ladung umverteilen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Alle packen mit an. Nach zwanzig Minuten rollt die Kolonne wieder.', fx:{ep:3}},
     fail:{t:'Am Ende passt nicht alles rein. Ein Kanister fehlt bis heute.', fx:{ep:1}}},
  ]},
 {id:'ex_heimweh', who:'lena', ctx:['ex'], text:'Abends am Container. Lena sitzt still da: Zu Hause ist heute ein Geburtstag, den sie verpasst.',
  ch:[
   {t:'Dazusetzen und zuhören', out:{t:'Ihr redet bis Mitternacht. Am nächsten Tag geht es ihr besser.', fx:{ep:2, rel:{lena:6}}}},
   {t:'Eine kleine Überraschungsfeier organisieren', roll:{stat:'vitaminb', base:40},
     ok:{t:'Kalle besorgt einen Kuchen. Niemand fragt, woher.', fx:{ep:3, rel:{lena:10, kalle:3}}},
     fail:{t:'Der Kuchen ist ein Müsliriegel mit Kerze. Lena lacht trotzdem.', fx:{ep:1, rel:{lena:4}}}},
  ]},
 {id:'ex_grill', who:'kalle', ctx:['ex'], text:'Sonntag im Feldlager: Kalle will grillen. Der Grill ist ein halbiertes Ölfass, die Kohle ist „organisiert“.',
  ch:[
   {t:'Grillmeister werden', roll:{stat:'fitness', base:50},
     ok:{t:'Perfekte Würstchen. Das halbe Lager kommt vorbei.', fx:{ep:2, rel:{kalle:4}}},
     fail:{t:'Außen schwarz, innen gefroren. Kalle isst sie trotzdem.', fx:{rel:{kalle:1}}}},
   {t:'Salat beisteuern', out:{t:'Der einzige Salat im Umkreis von 200 Kilometern. Lena ist begeistert.', fx:{ep:1, rel:{lena:2}}}},
  ]},
 {id:'ex_heim', who:'spiess', ctx:['ex'], einsatzEnd:true, text:'Rückverlegung. Nach der Landung wartet die Kompanie, Brockmann vorneweg. Er sagt nur: „Gut, dass Sie wieder da sind.“',
  ch:[
   {t:'Brockmann die Hand geben', out:{t:'Ein fester Händedruck. Mehr muss keiner sagen.', fx:{ep:2, rel:{spiess:6}}}},
   {t:'Erst mal ausschlafen', out:{t:'Vierzehn Stunden. Ohne Klimaanlage, ohne Sand.', fx:{ep:1, st:30}}},
   {t:'Allen ein Andenken mitbringen', out:{t:'Kalle bekommt einen Teppich, Lena ein Lauftrikot, Dennis ein Kissen. Alle freuen sich.', fx:{ep:2, money:-60, rel:{kalle:4, lena:4, dennis:4}}}},
  ]},

 // Lehrgangs-Kapitel (werden während eines Lehrgangs der Reihe nach ausgelöst, fx.lg = Lehrgangspunkte)
 {id:'lg_ual1', who:'krueger', ctx:['lg'], text:'Erste Führungsübung: Du sollst eine Gruppe über die Hindernisbahn führen. Die Gruppe besteht aus Leuten, die dich gestern noch „Kumpel“ genannt haben.',
  ch:[
   {t:'Klare Ansagen machen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Nach der ersten Ansage läuft es. Krüger notiert etwas und nickt.', fx:{lg:4, rel:{krueger:3}}},
     fail:{t:'Deine Ansage geht im Gelächter unter. Die Gruppe läuft trotzdem, nur in drei Richtungen.', fx:{lg:0}}},
   {t:'Vormachen und mitlaufen', roll:{stat:'fitness', base:50},
     ok:{t:'Du gehst voran, alle folgen. Führen durch Vorbild, steht so im Lehrbuch.', fx:{lg:3}},
     fail:{t:'Du bleibst an der Eskaladierwand hängen. Die Gruppe muss dich rüberschieben.', fx:{lg:1, st:-10}}},
   {t:'Den Lautesten zum Stellvertreter machen', out:{t:'Pragmatisch. Krüger fragt später, wer hier eigentlich die Gruppe geführt hat.', fx:{lg:2}}},
  ]},
 {id:'lg_ual2', who:'krueger', ctx:['lg'], text:'Unterrichtsprobe: fünfzehn Minuten zum Thema „Der sachgerechte Gebrauch des Feldspatens“. Vor dem ganzen Hörsaal.',
  ch:[
   {t:'Mit Struktur und Tafelbild', roll:{stat:'fachwissen', base:40},
     ok:{t:'Saubere Gliederung, klare Lernziele. Selbst der Spaten wirkt interessiert.', fx:{lg:4}},
     fail:{t:'Nach zwei Minuten hast du den Faden verloren und erklärst, was ein Stiel ist.', fx:{lg:1}}},
   {t:'Frei sprechen, mit Humor', roll:{stat:'vitaminb', base:40},
     ok:{t:'Der Hörsaal lacht an den richtigen Stellen. Krüger auch, kurz.', fx:{lg:5, rel:{krueger:3}}},
     fail:{t:'Dein Witz über den Spaten zündet nicht. Die Stille ist sehr lang.', fx:{lg:-1}}},
   {t:'Auswendig gelernt aufsagen', out:{t:'Fehlerfrei und völlig leblos. Bestanden, mehr nicht.', fx:{lg:2}}},
  ]},
 {id:'lg_ual3', who:'krueger', ctx:['lg'], text:'Abends auf der Stube flüstert ein Lehrgangsteilnehmer: Er hat die Lösungen der Abschlussprüfung. Angeblich.',
  ch:[
   {t:'Ablehnen und selbst lernen', out:{t:'Zwei Tage später fliegt der Spickzettel auf. Du hast nichts damit zu tun.', fx:{lg:2}}},
   {t:'Mal reinschauen', roll:{stat:'vitaminb', base:40},
     ok:{t:'Die Lösungen sind falsch. Beim Korrigieren lernst du mehr als in der ganzen Woche.', fx:{lg:3}},
     fail:{t:'In dem Moment steht Krüger in der Tür.', fx:{lg:-6, rel:{krueger:-10}}}},
   {t:'Krüger Bescheid geben', out:{t:'Krüger bedankt sich knapp. Auf der Stube redet heute niemand mehr mit dir.', fx:{lg:1, rel:{krueger:5}}}},
  ]},
 {id:'lgx_ual', who:'krueger', ctx:['lg'], exam:true, text:'Abschlussprüfung Unteroffizierlehrgang: Gruppengefechtsübung mit Bewertung. Krüger steht mit dem Klemmbrett am Waldrand.',
  ch:[
   {t:'Nach Lehrbuch führen', roll:{stat:'fuehrung', base:35},
     ok:{t:'Lagebeurteilung, Entschluss, Befehl. Alles sitzt.', fx:{lg:6}},
     fail:{t:'Der Befehl kommt zu spät, die Gruppe steht ratlos im Gras.', fx:{lg:1}}},
   {t:'Mutig improvisieren', roll:{stat:'vitaminb', base:25},
     ok:{t:'Ein Umgehungsangriff, mit dem keiner gerechnet hat. Krüger hebt die Augenbrauen.', fx:{lg:8}},
     fail:{t:'Die Umgehung endet im Sumpf.', fx:{lg:-3}}},
   {t:'Auf Nummer sicher gehen', out:{t:'Kein Fehler, keine Überraschung. Solide.', fx:{lg:3}}},
  ]},

 {id:'lg_fwl1', who:'krueger', ctx:['lg'], text:'Planübung: Du sollst den Dienstplan einer ganzen Kompanie für eine Woche erstellen. Die Tabellenvorlage stammt von 2007.',
  ch:[
   {t:'Sauber durchplanen', roll:{stat:'fachwissen', base:40},
     ok:{t:'Keine Doppelbelegung, keine Lücke. Krüger druckt ihn als Muster aus.', fx:{lg:4}},
     fail:{t:'Am Mittwoch hat die halbe Kompanie gleichzeitig Wache.', fx:{lg:0}}},
   {t:'Von Hand auf Papier', out:{t:'Langsam, aber fehlerfrei. Deine Hand schmerzt.', fx:{lg:2, st:-10}}},
   {t:'Kalle anrufen, der kennt sich aus', out:{t:'Kalle hat „zufällig“ eine fertige Vorlage. Woher, will niemand wissen.', fx:{lg:3, rel:{kalle:3}}}},
  ]},
 {id:'lg_fwl2', who:'krueger', ctx:['lg'], text:'Ausbildung am Gerät: Du bildest Rekruten am Funkgerät aus. Einer hat es nach fünf Minuten geschafft, es auszuschalten. Dauerhaft.',
  ch:[
   {t:'Ruhig bleiben und neu erklären', roll:{stat:'fuehrung', base:40},
     ok:{t:'Am Ende kann es sogar der Rekrut. Krüger ist zufrieden.', fx:{lg:4}},
     fail:{t:'Deine Geduld reicht bis Minute zwölf.', fx:{lg:1}}},
   {t:'Das Gerät selbst reparieren', roll:{stat:'fachwissen', base:35},
     ok:{t:'Akku raus, Akku rein, läuft. Du nennst es „Technischer Dienst“.', fx:{lg:5}},
     fail:{t:'Jetzt ist es wirklich kaputt.', fx:{lg:-1}}},
   {t:'Den Fehler als Lehrbeispiel nutzen', out:{t:'„So machen wir es nicht.“ Alle lachen, alle lernen.', fx:{lg:3}}},
  ]},
 {id:'lg_fwl3', who:'krueger', ctx:['lg'], text:'Krüger fragt, ob du ihm am Samstag beim Umzug hilfst. „Ganz freiwillig natürlich.“',
  ch:[
   {t:'Helfen', out:{t:'Drei Stockwerke, kein Aufzug, ein Klavier. Krüger spendiert Pizza und vergisst es dir nicht.', fx:{lg:1, st:-20, rel:{krueger:8}}}},
   {t:'Freundlich absagen', out:{t:'„Kein Problem.“ Es klingt, als wäre es ein kleines Problem.', fx:{rel:{krueger:-3}}}},
  ]},
 {id:'lgx_fwl', who:'krueger', ctx:['lg'], exam:true, text:'Abschlussprüfung Feldwebellehrgang: ein schriftlicher Test und eine Ausbildungseinheit vor zwei Prüfern.',
  ch:[
   {t:'Auf den schriftlichen Teil setzen', roll:{stat:'fachwissen', base:35},
     ok:{t:'Du bist als Erster fertig und hast trotzdem alles richtig.', fx:{lg:6}},
     fail:{t:'Frage 14 handelt von einer Vorschrift, die du nie gesehen hast.', fx:{lg:1}}},
   {t:'Die Ausbildungseinheit glänzen lassen', roll:{stat:'fuehrung', base:30},
     ok:{t:'Die Prüfer machen sich Notizen. Gute Notizen.', fx:{lg:7}},
     fail:{t:'Dein Beamer geht nicht, und dein Plan B auch nicht.', fx:{lg:0}}},
   {t:'Beides solide machen', out:{t:'Keine Glänzleistung, keine Patzer.', fx:{lg:3}}},
  ]},

 {id:'lg_ofl1', who:'krueger', ctx:['lg'], text:'Taktisches Planspiel am Sandkasten. Den Gegner spielt ein Major, der nicht verlieren kann.',
  ch:[
   {t:'Angreifen und gewinnen', roll:{stat:'fuehrung', base:30},
     ok:{t:'Du gewinnst. Der Major verlangt sofort eine Revanche. Krüger grinst.', fx:{lg:4}},
     fail:{t:'Knapp verloren, aber gut begründet.', fx:{lg:2}}},
   {t:'Den Major gewinnen lassen', roll:{stat:'vitaminb', base:40},
     ok:{t:'Er lobt deine „realistische Lagebeurteilung“. Diplomatie ist auch Führung.', fx:{lg:5}},
     fail:{t:'Er merkt es und ist beleidigt.', fx:{lg:0}}},
  ]},
 {id:'lg_ofl2', who:'krueger', ctx:['lg'], text:'Seminar Menschenführung: Du sollst ein Beispiel aus deiner eigenen Zeit in der Truppe vortragen.',
  ch:[
   {t:'Die Geschichte mit Brockmann und der Socke', out:{t:'Der Hörsaal lacht, Krüger auch. Und die Lehre daraus ist sogar richtig.', fx:{lg:4, rel:{krueger:2}}}},
   {t:'Ein ernstes Beispiel wählen', roll:{stat:'fuehrung', base:40},
     ok:{t:'Es wird still im Raum. Danach gibt es Applaus.', fx:{lg:5}},
     fail:{t:'Gut gemeint, aber du verlierst dich in Details.', fx:{lg:2}}},
  ]},
 {id:'lg_ofl3', who:'lena', ctx:['lg'], text:'Sportprüfung: 5000 Meter. Lena hat dir ungefragt einen Trainingsplan geschickt. Mit Tabellen.',
  ch:[
   {t:'Einfach durchziehen', roll:{stat:'fitness', base:30},
     ok:{t:'Neue Bestzeit. Du schreibst Lena sofort.', fx:{lg:4}},
     fail:{t:'Bei Kilometer vier hasst du alles.', fx:{lg:-1, st:-10}}},
   {t:'Lenas Plan befolgen', out:{t:'Gleichmäßiges Tempo, starker Endspurt. Lena antwortet nur: „Siehste.“', fx:{lg:3, rel:{lena:4}}}},
  ]},
 {id:'lgx_ofl', who:'krueger', ctx:['lg'], exam:true, text:'Abschlussprüfung Offizierlehrgang: Lagevortrag vor einer Kommission, danach Fragen. Sehr viele Fragen.',
  ch:[
   {t:'Mit klarer Führungsidee überzeugen', roll:{stat:'fuehrung', base:30},
     ok:{t:'Die Kommission nickt im Takt. Am Ende fragt keiner mehr nach.', fx:{lg:7}},
     fail:{t:'Die zweite Frage bringt deine ganze Idee ins Wanken.', fx:{lg:1}}},
   {t:'Mit Fachwissen glänzen', roll:{stat:'fachwissen', base:35},
     ok:{t:'Du kennst jede Vorschrift und jede Zahl.', fx:{lg:6}},
     fail:{t:'Du verwechselst zwei Vorschriften. Ein Kommissionsmitglied seufzt.', fx:{lg:2}}},
   {t:'Ruhig und sachlich bleiben', out:{t:'Unaufgeregt, korrekt, unauffällig.', fx:{lg:3}}},
  ]},

 {id:'lg_stu1', who:'krueger', ctx:['lg'], text:'Erstes Trimester an der Bundeswehr-Uni. Mathe I. Der Professor beginnt mit: „Wie Sie natürlich alle wissen …“',
  ch:[
   {t:'Dranbleiben und mitschreiben', roll:{stat:'fachwissen', base:30},
     ok:{t:'Nach drei Wochen verstehst du sogar den Professor.', fx:{lg:4}},
     fail:{t:'Du verstehst nur das Wort „natürlich“.', fx:{lg:0}}},
   {t:'Eine Lerngruppe gründen', out:{t:'Vier Leute, viel Kaffee, zwei funktionierende Gehirne. Reicht.', fx:{lg:3}}},
  ]},
 {id:'lg_stu2', who:'kalle', ctx:['lg'], text:'Kalle besucht dich im Wohnheim. Heute ist Party auf dem Flur, morgen ist Klausur.',
  ch:[
   {t:'Mitfeiern', roll:{stat:'vitaminb', base:30},
     ok:{t:'Du lernst die richtigen Leute kennen, darunter den Tutor. Er gibt dir Tipps.', fx:{lg:2, rel:{kalle:4}}},
     fail:{t:'Die Klausur schreibst du mit Kopfschmerzen.', fx:{lg:-4, rel:{kalle:4}}}},
   {t:'Lernen', out:{t:'Kalle feiert ohne dich. Die Klausur läuft gut.', fx:{lg:3, st:-10, rel:{kalle:-2}}}},
   {t:'Nur kurz vorbeischauen', roll:{stat:'fitness', base:50},
     ok:{t:'Um elf im Bett. Respekt.', fx:{lg:2}},
     fail:{t:'„Kurz“ endet um vier.', fx:{lg:-2}}},
  ]},
 {id:'lg_stu3', who:'krueger', ctx:['lg'], text:'Hausarbeit: dreißig Seiten zum Thema „Logistik im Wandel“. Abgabe in drei Tagen.',
  ch:[
   {t:'Gründlich recherchieren', roll:{stat:'fachwissen', base:35},
     ok:{t:'Sauber belegt und gut geschrieben. Der Betreuer ist angetan.', fx:{lg:5}},
     fail:{t:'Du findest die Hälfte der Quellen nicht mehr.', fx:{lg:1}}},
   {t:'Zwei Nächte durcharbeiten', out:{t:'Abgegeben, eine Minute vor Fristende. Du siehst aus wie ein Gespenst.', fx:{lg:4, st:-25}}},
  ]},
 {id:'lgx_stu', who:'krueger', ctx:['lg'], exam:true, text:'Abschlussarbeit und Verteidigung. Der Zweitgutachter hat Fragen. Viele Fragen.',
  ch:[
   {t:'Jede Frage fachlich kontern', roll:{stat:'fachwissen', base:30},
     ok:{t:'Am Ende nickt sogar der Zweitgutachter.', fx:{lg:8}},
     fail:{t:'Bei Frage drei wird es eng.', fx:{lg:2}}},
   {t:'Den Zweitgutachter in ein Gespräch über Golf verwickeln', roll:{stat:'vitaminb', base:30},
     ok:{t:'Er erzählt zwanzig Minuten von seinem Handicap. Die Zeit ist um.', fx:{lg:6}},
     fail:{t:'„Schön. Zurück zur Arbeit.“', fx:{lg:-2}}},
   {t:'Gut vorbereitet, aber ohne Risiko', out:{t:'Ordentlich verteidigt.', fx:{lg:4}}},
  ]},

 // Verwendungs-Ereignisse
 {id:'v_inf1', who:'lena', ctx:['v_inf'], text:'Spähtrupp im Morgennebel. Lena flüstert: „Da vorne bewegt sich was.“ Es könnte der Übungsgegner sein. Oder ein Reh.',
  ch:[
   {t:'Sofort melden', roll:{stat:'schiessen', base:40},
     ok:{t:'Es war tatsächlich der Übungsgegner. Lob vom Zugführer.', fx:{bp:6, rel:{lena:3}}},
     fail:{t:'Es war ein Reh. Dein Funkspruch „Gegner in Zugstärke“ geht in die Kompaniegeschichte ein.', fx:{bp:-3, rel:{kalle:3}}}},
   {t:'Näher ranschleichen', roll:{stat:'fitness', base:40},
     ok:{t:'Lautlos bis auf zehn Meter. Du siehst den Gegner beim Frühstück.', fx:{bp:8, rel:{lena:5}}},
     fail:{t:'Ein Ast knackt. Das Reh rennt weg, der Gegner auch.', fx:{st:-10}}},
  ]},
 {id:'v_kfz1', who:'kalle', ctx:['v_kfz'], text:'Kolonnenfahrt. Das Navi schickt dich in einen Feldweg, der auf keiner Karte existiert. Hinter dir elf Fahrzeuge.',
  ch:[
   {t:'Dem Navi vertrauen', roll:{stat:'fachwissen', base:30},
     ok:{t:'Eine Abkürzung! Die Kolonne ist zwanzig Minuten zu früh.', fx:{bp:6, rel:{chef:4}}},
     fail:{t:'Ein Bauernhof. Der Bauer bietet Kaffee an, während elf Fahrzeuge wenden.', fx:{bp:-4, st:-10}}},
   {t:'Umkehren und die Karte nehmen', out:{t:'Langsam, aber sicher. Niemand lobt dich, aber niemand meckert.', fx:{bp:2}}},
  ]},
 {id:'v_inst1', who:'spiess', ctx:['v_inst'], text:'Brockmanns Privatauto steht vor der Werkstatt. „Schauen Sie da mal kurz drüber? Nur ganz kurz. Inoffiziell.“',
  ch:[
   {t:'Kurz drüberschauen', out:{t:'Zündkerzen getauscht, Brockmann ist begeistert. Der Werkstattleiter weniger.', fx:{bp:-2, rel:{spiess:10}}}},
   {t:'„Nur mit Auftrag, Herr Hauptfeldwebel.“', out:{t:'Brockmann zieht eine Augenbraue hoch. „Korrekt.“ Er klingt fast beeindruckt.', fx:{bp:3, rel:{spiess:-2}}}},
  ]},
 {id:'v_san1', who:'dennis', ctx:['v_san'], text:'Sanitätsbereitschaft beim Sport. Dennis humpelt heran: „Knie. Ganz schlimm. Ich brauche eine Befreiung. Mindestens eine Woche.“',
  ch:[
   {t:'Gründlich untersuchen', roll:{stat:'fachwissen', base:40},
     ok:{t:'Das Knie ist kerngesund. Dennis läuft zurück zum Sport, ohne zu humpeln.', fx:{bp:5, rel:{dennis:-3}}},
     fail:{t:'Du bist dir unsicher und schreibst ihn krank. Eine Stunde später spielt er Fußball.', fx:{bp:-4, rel:{dennis:6}}}},

function finishLehrgang(){
  const a = S.lg; if(!a) return '';

  S.lg = null; S.lgNote = S.lgNote || {}; S.lgRetry = S.lgRetry || {};

function maybeEvent(ctx, chance){
  if(S.einsatz || S.pending.length >= 3 || Math.random() > chance) return null;
  const t = R[S.rank].t;
  const ok = EVENTS.filter(e => !S.pending.includes(e.id)
    && (!e.minT || t >= e.minT)
    && (!e.groups || e.groups.includes(R[S.rank].g))
    && (!e.tsk || e.tsk === S.tsk)
    && (!e.ctx || e.ctx.includes(ctx))
    && (!e.need || S.flags[e.need])
    && (!e.blockIf || !S.flags[e.blockIf])
    && e.id !== S.lastEvent);
  if(!ok.length) return null;
  const follow = ok.filter(e=>e.need), normal = ok.filter(e=>!e.need);
  const pool = (follow.length && (Math.random() < .7 || !normal.length)) ? follow : normal;
  pool.sort((a,b)=>(S.seen[a.id]||0)-(S.seen[b.id]||0)); // Seltenes bevorzugen
  const e = pool[Math.floor(Math.random()*Math.min(pool.length,4))];
  S.pending.push(e.id); S.lastEvent = e.id;
  return e;
}
function rollChance(r){ return Math.min(95, r.base + 4*S.stats[r.stat]); }
function applyFx(fx){
  const chips = [];
  if(fx.money){ S.money = Math.max(0, S.money+fx.money); chips.push((fx.money>0?'+':'−')+eur(Math.abs(fx.money))); }
  if(fx.bp){ if(fx.bp>0) G.addPoints(fx.bp); else S.log.push({ts:now(), p:fx.bp}); chips.push((fx.bp>0?'+':'−')+Math.abs(fx.bp)+' Beurteilung'); }
  if(fx.st){ G.normStamina(); S.stamina = Math.max(0, Math.min(G.maxStamina(), S.stamina+fx.st)); chips.push((fx.st>0?'+':'−')+Math.abs(fx.st)+' Ausdauer'); }
  for(const [k,v0] of Object.entries(fx.rel||{})){ const v = (v0>0 && vb()==='koch') ? Math.round(v0*1.5) : v0; S.rel[k] = Math.max(-100, Math.min(100, S.rel[k]+v)); chips.push(NPCS[k].short+' '+(v>0?'+':'−')+Math.abs(v)); }
  if(fx.lg && S.lg){
    let v = fx.lg; if(v>0 && rel('krueger')>=30) v += 1;
    S.lg.score = (S.lg.score||0) + v; chips.push('Lehrgang '+(v>0?'+':'−')+Math.abs(v));
  }
  if(fx.ep && S.einsatz){ S.einsatz.score += fx.ep; chips.push('Einsatz '+(fx.ep>0?'+':'−')+Math.abs(fx.ep)); }
  if(fx.flag) S.flags[fx.flag] = 1;
  if(fx.unflag) delete S.flags[fx.unflag];
  return chips;
}

function chooseEvent(i){
  const e = EV[curEvent]; if(!e) return; const c = e.ch[i]; if(!c) return;
  let out = c.out, roll = null;
  if(c.roll){ const hit = Math.random()*100 < rollChance(c.roll); out = hit ? c.ok : c.fail; roll = hit ? 'GESCHAFFT' : 'DANEBEN'; }
  const chips = applyFx(out.fx||{});
  const lgLine = e.exam ? finishLehrgang() : e.einsatzEnd ? finishEinsatz() : '';
  S.pending = S.pending.filter(x=>x!==curEvent); S.seen[curEvent] = (S.seen[curEvent]||0)+1; curEvent = null; save();
  render();
  document.getElementById('modalHost').innerHTML = '<div class="overlay" role="dialog" aria-modal="true" aria-label="Ergebnis"><div class="sheet ev">'
    + (roll && !e.exam ? '<div class="stamp small-stamp'+(roll==='DANEBEN'?'':' good')+'">'+roll+'</div>' : '')

    + '<button class="btn wide" data-act="close" style="margin-top:14px">Weiter</button></div></div>';
  document.querySelector('[data-act="close"]').focus();
}

const G = {

  gaReqs(){ return [

    {label:'Formaldienst 3× ('+Math.min(3,S.dc.formal||0)+'/3)', ok:(S.dc.formal||0) >= 3},

    if(k==='SaZ8'){ out.push({label:'Dienstgrad mindestens Hauptgefreiter', ok:r.t>=3}); out.push({label:'Beurteilung mindestens „befriedigend“', ok:G.note()<=3}); }
    if(k==='SaZ13'){ out.push({label:'Dienstgrad mindestens Stabsgefreiter oder Unteroffizier', ok:r.t>=4}); out.push({label:'Führung Stufe 5', ok:S.stats.fuehrung>=5}); out.push({label:'Beurteilung mindestens „gut“', ok:G.note()<=2}); }
    if(k==='BS'){ out.push({label:'Dienstgrad Oberfeldwebel oder Leutnant und höher', ok:(r.g==='F'&&r.t>=7)||r.g==='O'||r.g==='G'}); out.push({label:'Beurteilung mindestens „gut“', ok:G.note()<=2}); }
    return out;
  },
  maxStamina(){ return 100 + pflegeBonus() + 5*S.stats.fitness + 10*S.stube.kaffee + (vb()==='san' ? 20 : 0) + (hasGear('rucksack') ? 15 : 0) + (albumSet('s') ? 10 : 0) + 2*kStufe('truppenkueche') + 3*kpStufe('kantine'); },
  regenMs(){ return 120000 / lageF('regen') / S.speed / (rel('dennis')>=30 ? 1.15 : 1) / (1 + .05*S.stube.bett) / (hasGear('wagen') ? 1.2 : 1) / (1 + .02*kStufe('sanbereich')); }, // 1 Ausdauer alle 2 Minuten
  normStamina(){
    const max = G.maxStamina(), rg = G.regenMs();
    if(S.stamina >= max){ S.stamina = Math.min(S.stamina, max); S.staminaTs = now(); return; }
    const gained = Math.floor((now() - S.staminaTs)/rg);
    if(gained > 0){
      S.stamina = Math.min(max, S.stamina + gained);
      S.staminaTs = S.stamina >= max ? now() : S.staminaTs + gained*rg;
    }
  },
  payMult(){ return (1 + .01*ordenCount()) * (G.rank().sold/40) * (1 + .03*S.stats.fachwissen) * (1 + .02*S.stats.vitaminb) * (vb()==='inst' ? 1.1 : 1) * (1 + .05*Math.min(5, S.res||0)) * (hasGear('stander') ? 1.1 : 1) * (albumSet('g') ? 1.05 : 1) * (albumSet('l') ? 1.1 : 1) * (1 + .01*kStufe('betreuung') + .02*kpStufe('mannschaftsheim')); },
  bpMult(){ return lageF('bp') * Math.max(.2, 1 + .01*medalCount() + .03*S.stats.vitaminb + .02*S.stats.fuehrung + rel('spiess')/500 + Math.max(0,rel('chef'))/1000 + .04*S.stube.spind + (vb()==='fm' ? .1 : 0) + (hasGear('kalender') ? .05 : 0) + (albumSet('e') ? .05 : 0) + .02*kpStufe('geschaeftszimmer')); },
  dienstPay(d){ return Math.round(lagePay(d) * d.pay * G.payMult() * ((vb()==='inf' && (d.id==='gelaende'||d.id==='uebung')) ? 1.15 : 1)); },
  dienstSt(d){ return Math.round(lageF('st') * d.st * (vb()==='kfz' ? .8 : 1) * (hasGear('stiefel') ? .95 : 1) * (1 - .02*kpStufe('fahrzeughalle'))); },
  dienstMin(d){ return d.min * (hasGear('uhr') ? .95 : 1) * lageF('dur'); },
  addPoints(p){ S.log.push({ts:now(), p: p>0 ? Math.round(p*G.bpMult()*10)/10 : p}); },
  points(){
    const cut = now() - 7*864e5/S.speed;
    S.log = S.log.filter(x => x.ts >= cut);
    return Math.round(S.log.reduce((a,x)=>a+x.p,0)*10)/10;
  },
  note(){ const p = G.points(); for(let n=1;n<=4;n++) if(p >= noteMin(n)) return n; return 5; },
  dienstLock(d){
    const r = G.rank();
    if(S.einsatz && !d.einsatz) return 'im Auslandseinsatz';
    if(d.einsatz && !S.einsatz) return 'nur im Auslandseinsatz';
    if(d.tsk && d.tsk !== S.tsk) return 'nur '+TSK[d.tsk].name;
    if(d.verw && S.verw !== d.verw) return 'nur für ' + VERW[d.verw].name;
    if(G.dzOver()) return 'Dienstzeitende';
    if(d.ga && S.gaDone) return 'nur in der Grundausbildung';
    if(d.spec) return r.spec ? null : 'nur für Korporale';
    if(d.groups && !d.groups.includes(r.g)) return 'ab ' + R[{U:'uffz',F:'fw',A:'fj',O:'lt',G:'bg'}[d.groups[0]]].name;
    if(d.minT && r.t < d.minT) return 'ab ' + (RANKS.find(x => d.groups.includes(x.g) && x.t >= d.minT) || r).name;
    if(d.groups) return null;
    if(r.t < d.t) return 'ab ' + RANKS.find(x=>x.g==='M' && x.t===d.t).name;
    return null;
  },
  statCost(id){ const l=S.stats[id]; return Math.round(25*(l+1)**2 * (rel('kalle')>=30 ? .9 : 1)); },
  statMin(id){
    const l = S.stats[id]; let f = rel('lena')>=30 ? .9 : 1;
    if(id==='fitness') f *= (1 - .08*S.stube.hantel) * (1 - .03*kStufe('sporthalle'));
    if(id==='schiessen') f *= 1 - .03*kStufe('schiessanlage');
    f *= 1 - .02*kpStufe('trainingsraum');
    if((id==='schiessen' && vb()==='inf') || (id==='fachwissen' && vb()==='inst')) f *= .8;
    if(id==='fuehrung' && hasGear('pfeife')) f *= .9;
    f *= lageTrain(id);
    return Math.max(1, Math.round(4*(l+1)**1.7 * f));
  },

  startDienst(id){

    if(S.dienst) return 'Du bist schon im Dienst.';
    if(S.fa) return 'Du bist gerade im Feierabend beschäftigt.';

    S.dienst = {id, start:now(), end:now()+G.dienstMin(d)*60000/S.speed, pay:G.dienstPay(d), bp:d.bp};

  },
  lehrgangReqs(l){

    for(const [k,v] of Object.entries(l.stats)) out.push({label:STAT_NAME[k]+' Stufe '+v, ok:S.stats[k]>=v});

  startLehrgang(id){

    S.lg = {type:'lehrgang', id, start:now(), end:now()+dur, cps:ev.map((_,i)=>now()+dur*(i+1)/(ev.length+1)), ev, next:0, score:0, exam:false};
    return null;
  },
  einstand(targetId){ return R[targetId].einstand * G.rank().sold; },
  promoReqs(targetId){
    const t = R[targetId], out = [];
    const needMs = t.minH*3600000/S.speed, done = now()-S.lastPromo;
    out.push({label: 'Mindestdienstzeit: ' + fmtHours(t.minH/S.speed) + (done<needMs ? ' (noch ' + fmtLeft(needMs-done) + ')' : ''), ok: done>=needMs});
    out.push({label: 'Beurteilung mindestens „' + NOTES[t.note] + '“', ok: G.note() <= t.note});
    for(const [k,v] of Object.entries(t.stats||{})) out.push({label: STAT_NAME[k]+' Stufe '+v, ok: S.stats[k]>=v});
    if(t.ga) out.push({label:'Grundausbildung mit Gelöbnis abgeschlossen', ok:!!S.gaDone});
    if(t.dz) out.push({label:'Dienstverhältnis mindestens '+DZ[t.dz].short, ok: DZ[S.verpfl].rang >= DZ[t.dz].rang});
    if(t.lehrgang) out.push({label: L[t.lehrgang].name + ' abgeschlossen', ok: !!S.lehrgaenge[t.lehrgang]});
    out.push({label: 'Einstand für die Kompanie: ' + eur(G.einstand(targetId)), ok: S.money >= G.einstand(targetId)});
    return out;
  },
  promote(targetId){
    if(!(NEXT[S.rank]||[]).includes(targetId)) return 'Dieser Dienstgrad ist von hier aus nicht erreichbar.';
    if(!G.promoReqs(targetId).every(r=>r.ok)) return 'Voraussetzungen fehlen.';
    S.money -= G.einstand(targetId);
    S.rank = targetId; S.lastPromo = now();
    S.history.push({rank:targetId, ts:now()});
    G.addPoints(5);
    return null;
  },
  tick(){
    let events = [], changed = false;
    sparZinsen();
    fe(); ntgTick(events); if(events.length) changed = true;
    if(S.fa && now() >= S.fa.end){
      const a = S.fa; S.fa = null;
      if(a.type === 'pfand') pfFinish(a, events); else if(a.type === 'fix') fixFinish(a, events);
      changed = true;
    }
    G.normStamina();
    // Sold
    const today = dateStr();
    if(S.lastPay !== today){
      const days = Math.max(1, Math.min(7, daysBetween(S.lastPay, today)));
      const amount = Math.round(G.rank().sold*days*(1+.02*S.stats.vitaminb)*(1+.05*S.stube.kuehl));
      S.money += amount - earnCut(amount); S.lastPay = today; changed = true;
      if(S.pflege && PFLEGE[S.pflege.tarif]){
        const b = Math.round(G.rank().sold * days * PFLEGE[S.pflege.tarif].rate);
        S.money -= b; events.push('Beitrag Pflegepflichtversicherung: '+eur(b));
      } else if(pflegePflicht() && now() > (S.pflegeFrist || 0)){
        const f = 2 * G.rank().sold; S.money -= f; S.log.push({ts:now(), p:-3});
        events.push('Brockmann: „Wo ist Ihr Nachweis der Pflegepflichtversicherung?“ Säumniszuschlag '+eur(f)+'.');
      }
      events.push('Sold ist da: ' + eur(amount));
    }
    if(S.dienst && now() >= S.dienst.end){
      const d = D[S.dienst.id];
      if(typeof kpBonusAdd === 'function') kpBonusAdd(S.dienst.pay);
      S.money += S.dienst.pay - earnCut(S.dienst.pay); G.addPoints(S.dienst.bp); S.dienstCount++; S.dc[S.dienst.id] = (S.dc[S.dienst.id]||0) + 1;
      if(D[S.dienst.id].einsatz && S.einsatz) S.einsatz.score += 1;
      if(Math.random() < (D[S.dienst.id].einsatz ? .25 : .12)){ S.pakete = Math.min(9, (S.pakete||0)+1); events.push('Feldpost ist da!'); }
      events.push(d.name + ' beendet: +' + eur(S.dienst.pay));
      { const ev = maybeEvent(d.id, .55); if(ev) events.push('Neue Meldung von ' + NPCS[ev.who].short); }
      S.dienst = null; changed = true;
    }
    if(S.lg && S.lg.cps){
      const a = S.lg;
      while(a.next < a.cps.length && now() >= a.cps[a.next]){
        if(!S.pending.includes(a.ev[a.next])) S.pending.push(a.ev[a.next]);
        a.next++; changed = true; events.push(L[a.id].name + ': neue Lage');
      }
      if(now() >= a.end && !a.exam){
        a.exam = true; S.pending.push('lgx_'+a.id); changed = true;
        events.push('Abschlussprüfung ' + L[a.id].name + ' wartet');
      }
    }
    if(S.einsatz){
      const a = S.einsatz;
      while(a.next < a.cps.length && now() >= a.cps[a.next]){
        if(!S.pending.includes(a.ev[a.next])) S.pending.push(a.ev[a.next]);
        a.next++; changed = true; events.push('Auslandseinsatz: neue Lage');
      }
      if(now() >= a.end && !a.fin){
        a.fin = true; S.pending.push(S.tsk==='marine' ? 'mx_heim' : 'ex_heim'); changed = true; events.push('Rückverlegung steht an');
      }
    }
    if(S.ausb && now() >= S.ausb.end && !S.ausb.cps){
      if(S.ausb.type === 'stat'){
        S.stats[S.ausb.id]++; G.addPoints(2);
        events.push(STAT_NAME[S.ausb.id] + ' jetzt auf Stufe ' + S.stats[S.ausb.id]);
      } else {
        S.lehrgaenge[S.ausb.id] = now(); G.addPoints(10);
        events.push(L[S.ausb.id].name + ' bestanden');
      }
      S.ausb = null; changed = true;
      { const ev = maybeEvent('ausb', .3); if(ev) events.push('Neue Meldung von ' + NPCS[ev.who].short); }
    }
    if(ordenCheck(events)) changed = true;
    if(changed) save();
    if(events.length) notifyEvents(events);
    return {changed, events};
  }
};

/* =========================================================
   HILFSFUNKTIONEN
   ========================================================= */
function eur(n){ return Math.round(n).toLocaleString('de-DE') + ' €'; }
function fmtMin(m){ m=Math.max(1,Math.round(m)); if(m<60) return m+' Min.'; const h=Math.floor(m/60), r=m%60; return h+' Std.'+(r?' '+r+' Min.':''); }
function fmtHours(h){ return h<1 ? fmtMin(h*60) : fmtMin(h*60); }
function fmtLeft(ms){ const s=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  const p=n=>String(n).padStart(2,'0'); return (h? h+':'+p(m) : m) + ':' + p(x); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function toast(msg){
  const host = document.getElementById('toastHost');
  host.innerHTML = '<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t = setTimeout(()=>host.innerHTML='', 2800);
}

function applyTheme(){
  const el = document.documentElement;
  if(S && S.theme && S.theme !== 'system') el.dataset.theme = S.theme; else delete el.dataset.theme;

  applyTsk();
}

/* Schulterklappe: eigene, vereinfachte Darstellung je Dienstgradgruppe */
function star(cx,cy,r){
  let d=''; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r; d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1); }
  return '<path d="'+d+'Z" fill="var(--mark)"/>';
}
function insignia(id, size=56){
  const r = R[id], list = RANKS.filter(x=>x.g===r.g), k = list.indexOf(r);
  let m = '';
  const stripe = (y,h=4) => '<rect x="13" y="'+y+'" width="30" height="'+h+'" rx="1" fill="var(--mark)"/>';
  const chev = y => '<path d="M17 '+y+' L28 '+(y+7)+' L39 '+y+'" fill="none" stroke="var(--mark)" stroke-width="3"/>';
  const frameOpen = '<path d="M9 86 V24 Q9 9 28 7 Q47 9 47 24 V86" fill="none" stroke="var(--mark)" stroke-width="2.5"/>';
  const frameClosed = frameOpen + '<path d="M9 84.5 H47" stroke="var(--mark)" stroke-width="2.5"/>';
  const leaf = '<path d="M17 76 Q28 62 39 76 Q28 71 17 76Z" fill="var(--mark)"/>';
  if(r.g==='M'){
    if(id==='korp'||id==='skorp'){ m += stripe(60,9); if(id==='skorp') m += stripe(50); }
    else for(let i=0;i<k;i++) m += stripe(72-i*8);
  } else if(r.g==='U'){ m += frameOpen; for(let i=0;i<k;i++) m += chev(62-i*9); }
  else if(r.g==='F'){ m += frameClosed; for(let i=0;i<=k;i++) m += chev(64-i*9); }
  else if(r.g==='A'){ m += frameClosed + '<circle cx="28" cy="70" r="4.5" fill="none" stroke="var(--mark)" stroke-width="2.5"/>'; for(let i=0;i<k;i++) m += chev(52-i*9); }
  else if(r.g==='O'){ const n = k<3 ? k+1 : k-2; if(k>=3) m += leaf; for(let i=0;i<n;i++) m += star(28, (k>=3?56:66)-i*15, 6); }
  else { m += '<path d="M9 86 V24 Q9 9 28 7 Q47 9 47 24 V86" fill="none" stroke="var(--signal)" stroke-width="3"/>' + leaf.replace('var(--mark)','var(--signal)');
         for(let i=0;i<=k;i++) m += star(28, 58-i*12, 5.5).replace('var(--mark)','var(--signal)'); }
  return '<svg viewBox="0 0 56 90" width="'+size+'" height="'+Math.round(size*90/56)+'" aria-hidden="true">'
    + '<path d="M4 88 V24 Q4 4 28 2 Q52 4 52 24 V88 Z" fill="var(--board)"/>'
    + '<circle cx="28" cy="15" r="3.5" fill="var(--mark)" opacity=".75"/>' + m + '</svg>';
}

    const dis = !!lock || !!S.dienst || S.stamina < G.dienstSt(d);
    const inner = '<p class="flv">'+esc(d.desc)+'</p>'
      + facts([['Dauer', fmtMin(G.dienstMin(d)/S.speed)], ['Ausdauer', G.dienstSt(d)], ['Verdienst', eur(G.dienstPay(d))], ['Punkte', d.bp]])
      + (running ? '<div class="small">Fertig in <span class="num" data-left="dienst"></span></div><div class="prog" style="margin:0"><i data-prog="dienst"></i></div>'
        : lock ? '<div class="lock">Gesperrt: '+esc(lock)+'</div>'
        : '<button class="btn wide" data-act="dienst" data-id="'+d.id+'" '+(dis?'disabled':'')+'>Antreten</button>');
    return acard(d.name, DIENST_ART[d.id], inner, running);
  }).join('') + '</div>';
  return h;
}

  h += '<h2>Lehrgänge</h2><div class="cards">' + LEHRGAENGE.map(l => {

    const running = S.lg && S.lg.id === l.id;
    let inner = '<p class="flv">'+esc(l.desc)+'</p>';
    if(done) inner += '<div class="stamp good small-stamp" style="margin:8px auto 2px;font-size:17px">BESTANDEN</div>'
      + (S.lgNote && S.lgNote[l.id] ? '<div class="small">Note '+S.lgNote[l.id]+' („'+NOTES[S.lgNote[l.id]]+'“)</div>' : '');

      + '<div class="small">'+(S.lg.exam ? 'Die Prüfung wartet in den Meldungen.' : 'Ende in <span class="num" data-left="lg"></span>')+'</div><div class="prog" style="margin:0"><i data-prog="lg"></i></div>';
    else inner += facts([['Dauer', fmtMin(l.min/S.speed)], ['Kosten', eur(lgCost(l))]])

function render(){
  applyTheme();
  const main = document.getElementById('main');
  if(!BOOTED){ main.innerHTML = '<p class="muted" style="margin-top:20vh;text-align:center">Melde mich zum Dienst …</p>'; renderNav(); return; }
  if(document.body && document.body.classList) document.body.classList.toggle('landing', !USER);
  if(!USER){ main.innerHTML = renderLogin(); renderNav(); renderRes(); return; }
  if(!S || !ONLINE.profile){ main.innerHTML = renderCreate(); }
  else {
    main.innerHTML = renderPage();
  }
  if(S && tutOn() && main.insertAdjacentHTML) main.insertAdjacentHTML('afterbegin', tutBox());
  renderNav(); renderRes(); live();
  if(typeof afterRender === "function") afterRender();
}

function live(){
  if(!S) return;
  for(const k of ['dienst','ausb','lg','einsatz','fa']){
    const a = S[k]; if(!a) continue;
    const pct = Math.min(100, (now()-a.start)/(a.end-a.start)*100);
    document.querySelectorAll('[data-prog="'+k+'"]').forEach(e=>e.style.width=pct+'%');
    document.querySelectorAll('[data-left="'+k+'"]').forEach(e=>e.textContent=(k==='einsatz' ? fmtRest : fmtLeft)(a.end-now()));
  }
}

const ACT = {
  tab(id){ goPage(id); render(); window.scrollTo(0,0); if(tab==='truppe') loadTruppe(); },

  sub(id){ SUB[tab]=id; render(); window.scrollTo(0,0); },
  async create(){

  },
  dienst(id){ const e=G.startDienst(id); if(e) toast(e); else { save(); toast(D[id].name+' angetreten'); } render(); },
  stat(id){ const e=G.startStat(id); if(e) toast(e); else { save(); toast('Ausbildung '+STAT_NAME[id]+' begonnen'); } render(); },
  lehrgang(id){ const e=G.startLehrgang(id); if(e) toast(e); else { save(); toast(L[id].name+' begonnen'); } render(); },

  close(){ document.getElementById('modalHost').innerHTML=''; curEvent = null; },

    document.getElementById('modalHost').innerHTML = '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="gt"><div class="sheet"><div class="stamp good">GELOBT</div>'

      + '<button class="btn wide" data-act="close">Wegtreten</button></div></div>';
  },
  verpflichten(k, ok){
    const v = DZ[k];
    if(!v || v.rang <= DZ[S.verpfl].rang || !G.dzReqs(k).every(x=>x.ok)) return;
    if(!ok) return ask('Als '+v.name+' verpflichten? Das lässt sich nicht rückgängig machen.', ()=>ACT.verpflichten(k, true), 'Verpflichten');
    S.verpfl = k; S.money += v.praemie; G.addPoints(5);
    if(!S.pflege && !S.pflegeFrist) S.pflegeFrist = now() + 3*864e5/S.speed;
    save();
    toast('Verpflichtet: '+v.short+', Prämie '+eur(v.praemie)); render();
  },
  ausscheiden(_, ok){
    if(!G.dzOver()) return;
    if(!ok) return ask('Wirklich ausscheiden? Du beginnst neu als Soldat und behältst deinen Wiedereinsteller-Bonus.', ()=>ACT.ausscheiden(null, true), 'Ausscheiden');
    const name = S.name, res = (S.res||0)+1, theme = S.theme, speed = S.speed, spar = S.spar;
    newGame(name, res, S.tsk); S.tut = {step:0, done:true}; S.theme = theme; S.speed = speed; if(spar) S.spar = spar; save(); tab = 'stube'; render();
    toast('Willkommen zurück, Wiedereinsteller.');
  },
  verw(id){
    if(S.verw || G.rank().t < 1 || !VERW[id] || (VERW[id].tsk||'heer') !== S.tsk) return;
    S.verw = id; save(); toast('Verwendung: ' + VERW[id].name); render();
  },
  umschulung(_, ok){
    const cost = 10*G.rank().sold;
    if(S.money < cost){ toast('Zu wenig Geld.'); return; }
    if(!ok) return ask('Umschulung für ' + eur(cost) + '? Danach wählst du eine neue Verwendung.', ()=>ACT.umschulung(null, true), 'Umschulen');
    if(S.dienst && D[S.dienst.id].verw){ toast('Erst den laufenden Fachdienst beenden.'); return; }
    S.money -= cost; S.verw = null; save(); render();
  },
  buy(id){
    const it = STUBE_I[id]; if(!it) return;
    const l = S.stube[id]; if(l >= it.cost.length) return;
    const c = it.cost[l];
    if(S.money < c){ toast('Zu wenig Geld.'); return; }
    S.money -= c; S.stube[id]++;
    const r = it.rel && it.rel[S.stube[id]]; if(r) applyFx({rel:r});
    save(); toast(it.name + ': ' + it.levels[S.stube[id]]); render();
  },
  standort(_, ok){
    const bl = document.getElementById('bl'), so = document.getElementById('so');
    if(!bl || !so || !STANDORTE[bl.value]) return;
    const neu = {bl:bl.value, ort:so.value};
    if(S.standort && S.standort.ort===neu.ort && S.standort.bl===neu.bl){ toast('Da bist du schon.'); return; }
    const cost = S.standort ? 5*G.rank().sold : 0;
    if(cost){
      if(S.money < cost){ toast('Zu wenig Geld für den Umzug.'); return; }
      if(!ok) return ask('Versetzung nach '+neu.ort+' für '+eur(cost)+' beantragen?', ()=>ACT.standort(null, true), 'Versetzen');
      S.money -= cost;
    }
    const first = !S.standort; S.standort = neu; save(); cloudPush(true).then(loadOnline).then(render);
    toast(first ? 'Heimatstandort: '+neu.ort : 'Versetzung genehmigt: '+neu.ort); render();
  },
  paket(){ openPaket(); },
  notif(){
    if(!window.Notification){ toast('Dein Browser unterstützt keine Benachrichtigungen.'); return; }
    if(S.notify && Notification.permission === 'granted'){ S.notify = false; save(); toast('Benachrichtigungen aus.'); render(); return; }
    Promise.resolve(Notification.requestPermission()).then(p => {
      if(p === 'granted'){ S.notify = true; save(); toast('Benachrichtigungen an. Brockmann meldet sich.'); }
      else toast('Benachrichtigungen wurden nicht erlaubt. Das lässt sich in den Browser-Einstellungen ändern.');
      render();
    }).catch(() => toast('Hier sind Benachrichtigungen nicht möglich.'));
  },
  kurz_open(){ kurzRender(); },
  kurz(opt){
    if(!S.ausb || S.ausb.type !== 'stat') return;
    const h = kurzStunden(opt), c = kurzKosten(h);
    if(!(h > 0) || !(c > 0)){ toast('Zu wenig Ausdauer.'); return; }
    S.stamina -= c; S.ausb.end -= h * 36e5 / S.speed;
    if(S.ausb.end <= now() + 500) S.ausb.end = now();
    const r = G.tick(); save(); render();
    if(!S.ausb || S.ausb.type !== 'stat'){ ACT.close(); r.events.forEach((m,i)=>setTimeout(()=>toast(m), i*1600)); if(!r.events.length) toast('Ausbildung abgeschlossen.'); }
    else { toast('Um '+fmtStd(h)+' verkürzt.'); kurzRender(); }
  },
  tut_next(){
    if(!tutOn()) return;
    const st = tutSteps(), s = st[S.tut.step];
    if(s.final){
      const first = !S.tut.again;
      S.tut.done = true; if(first){ S.money += 200; S.pakete = Math.min(9, (S.pakete||0) + 1); } save();
      toast(first ? 'Einführung abgeschlossen: +200 € und ein Paket.' : 'Einführung abgeschlossen.'); tab = 'stube'; render(); return;

  pf_run(id){ const e = pfStart(id); if(e){ toast(e); return; } save(); render(); },
  pf_auto(){
    fe(); const v = pfWert(); if(!v) return;
    S.money = ct(S.money + v); S.pfand.ew = 0; S.pfand.mw = 0; save(); toast('Der Automat rattert: '+eur2(v)+'.'); render();
  },
  pf_kalle(){

  car_insp(uid){

  const prof = await sb.from('profiles').select('*').eq('id', USER.id).maybeSingle();
  ONLINE.profile = prof.data || null;
  let st = row.data ? row.data.data : null;
  if(local && local.uid === USER.id && (!st || (local.savedAt||0) > (st.savedAt||0))) st = local;
  S = st;
  if(S){
    migrate();
    const r = G.tick(); r.events.forEach((m,i)=>setTimeout(()=>toast(m), i*1600));
    save();
  }
  await loadOnline();
  await loadKompanie();
  if(S) await abholen();
}

const SPLASH_TXT = ['Antrag auf Ladebildschirm wird bearbeitet …', 'Warte auf Freigabe durch den Spieß …', 'Stiefel werden geputzt …', 'Spind wird auf Kante gebracht …',
  'Formular 17b wird gesucht …', 'Kaffee für das Geschäftszimmer läuft durch …', 'Dienstweg wird eingehalten …'];
let splashT0 = Date.now(), splashIv = null;
function splashTick(){
  const el = document.getElementById('spsub'); if(!el) return;
  let i = 0; clearInterval(splashIv);
  splashIv = setInterval(() => { i = (i + 1) % SPLASH_TXT.length; el.textContent = SPLASH_TXT[i]; }, 1300);
}
function showSplash(txt){
  const sp = document.getElementById('splash'); if(!sp) return;
  splashT0 = Date.now(); sp.classList.remove('off');
  const el = document.getElementById('spsub'); if(el && txt) el.textContent = txt;
  splashTick();
}
function hideSplash(){
  const sp = document.getElementById('splash'); if(!sp) return;
  const wait = Math.max(0, 900 - (Date.now() - splashT0));
  setTimeout(() => { sp.classList.add('off'); clearInterval(splashIv); }, wait);
}
splashTick();
setTimeout(hideSplash, 12000); // Notbremse, falls der Server nicht antwortet

async function boot(){
  render();
  if(!sb){
    BOOTED = true; hideSplash();
    document.getElementById('main').innerHTML = '<div class="panel pad" style="margin-top:20vh"><p><b>Keine Verbindung zum Server.</b> Bitte prüfe deine Internetverbindung und lade die Seite neu.</p></div>';
    return;
  }
  const { data } = await sb.auth.getSession();
  USER = data && data.session ? data.session.user : null;
  if(USER){ try{ await afterLogin(); }catch(e){ toast('Laden fehlgeschlagen. Bitte Seite neu laden.'); } }
  BOOTED = true; render(); hideSplash();
  sb.auth.onAuthStateChange((ev, session) => {
    if(ev === 'SIGNED_OUT'){ USER = null; S = null; ONLINE.profile = null; render(); }
    else if(session) USER = session.user;
  });
}

async function authSubmit(mode){
  const em = (document.getElementById('em')||{}).value || '', pw = (document.getElementById('pw')||{}).value || '';
  if(!em.includes('@') || pw.length < 8){ toast('Bitte E-Mail und ein Passwort mit mindestens 8 Zeichen eingeben.'); return; }
  const res = mode === 'signup'
    ? await sb.auth.signUp({email:em.trim(), password:pw})
    : await sb.auth.signInWithPassword({email:em.trim(), password:pw});
  if(res.error){
    const m = res.error.message || '';
    toast(/invalid login/i.test(m) ? 'E-Mail oder Passwort falsch.' : /already registered/i.test(m) ? 'Für diese E-Mail gibt es schon ein Konto.' : 'Fehler: '+m);
    return;
  }
  if(!res.data.session){ toast('Fast geschafft: Bitte bestätige deine E-Mail-Adresse über den Link im Postfach.'); return; }
  USER = res.data.session.user;
  showSplash('Melde mich zum Dienst …'); BOOTED = false; render();
  try{ await afterLogin(); }catch(e){ toast('Laden fehlgeschlagen.'); }
  BOOTED = true; tab = 'stube'; render(); hideSplash();
}

document.addEventListener('change', async e => {
  const n = e.target && e.target.dataset ? e.target.dataset.rolle : null;
  if(!n) return;
  const neu = e.target.value;
  if(neu === 'chef'){
    ask('Kommando an '+n+' übergeben? Du wirst dann Kompaniefeldwebel.', async () => {
      const { error } = await sb.rpc('kompanie_rolle_setzen', {p_name:n, p_rolle:'chef'});
      if(error) toast(error.message); else toast('Kommando übergeben.');
      loadTruppe();
    }, 'Übergeben');

function kpBedarf(g){

    + '<p class="small muted" style="margin:0 0 8px">Was du findest, geht direkt ins Kompanielager. Diese Woche: '+L2.woche+' von '+L2.limit+' Rohstoffen. Das Limit steigt mit deinem Dienstgrad. Wer abbricht, bringt nichts mit.</p>';

    const end = new Date(a.ende).getTime(), start = new Date(a.start).getTime(), pct = Math.min(100, (Date.now()-start)/(end-start)*100);
    h += '<div class="small">Du räumst auf ('+a.menge+' Rohstoffe). Fertig in '+fmtRest(end - Date.now())+'.</div><div class="prog"><i style="width:'+pct+'%"></i></div>'

    h += '<details class="small" style="margin-top:12px"><summary>Lagerbuch</summary><ul class="rl">' + L2.log.map(l => {
      const t = l.art==='aufraeumen' ? esc(l.von||'?')+' hat '+l.menge+' Rohstoffe vom Kasernenhof geholt'
        : l.art==='tausch' ? esc(l.von||'?')+' hat '+(3*l.menge)+' '+esc(ROH[l.details.von] ? ROH[l.details.von].name : '')+' gegen '+l.menge+' '+esc(ROH[l.details.nach] ? ROH[l.details.nach].name : '')+' getauscht'
        : esc(l.von||'?')+' hat Rohstoffe für einen Ausbau verbraucht';
      return '<li><span class="who">'+t+'<br><span class="muted">'+new Date(l.created_at).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})+'</span></span></li>';
    }).join('') + '</ul></details>';
  }
  return h + '</div>';
}

  for(const [key, m] of Object.entries(MARKERS)){
    const d = ONLINE.karte[key], a = d ? d.ausbau : 0;
    const fill = a >= 25 ? '#E3B23C' : a >= 10 ? '#3B7436' : a > 0 ? '#7F9450' : '#A9B09C';
    const hot = key === own || key === ONLINE.sel;
    m.setStyle({radius: 5 + Math.min(9, a/3), fillColor: fill, color: key === own ? '#B3261E' : (key === ONLINE.sel ? '#1C2217' : '#3B4524'), weight: hot ? 3 : 1.5});
    if(hot) m.bringToFront();
  }
}
async function loadKarte(){
  if(!sb) return;
  const { data, error } = await sb.rpc('standort_karte');
  if(error) return;
  ONLINE.karte = {}; (data || []).forEach(r => ONLINE.karte[r.standort] = r);
  styleMarkers();
}
async function selectStandort(key){
  ONLINE.sel = key; ONLINE.selGeb = null; styleMarkers();
  if(tab === 'truppe') render();
  const { data } = await sb.from('kaserne_gebaeude').select('*').eq('standort', key);
  ONLINE.selGeb = {}; (data || []).forEach(r => ONLINE.selGeb[r.gebaeude] = r);
  if(tab === 'truppe') render();
}
function afterRender(){
  const slot = document.getElementById('mapslot');
  if(!slot) return;
  ensureMap();
  if(!MAPWRAP){ slot.innerHTML = '<p class="small muted" style="padding:12px 0">Die Karte konnte nicht geladen werden.</p>'; return; }
  slot.appendChild(MAPWRAP);
  setTimeout(() => MAP.invalidateSize(), 0);
}
function kasernenPlatz(key){
  const d = ONLINE.karte[key]; if(!d || !d.ausbau) return null;
  return Object.values(ONLINE.karte).filter(r => r.ausbau > d.ausbau).length + 1;
}
function renderKarteInfo(){
  const key = ONLINE.sel;
  if(!key) return '<p class="small muted" style="margin-top:8px">Tippe auf einen Standort für Details. Rot umrandet ist dein eigener, je größer und kräftiger der Punkt, desto weiter ist die Kaserne ausgebaut.</p>';
  const [bl, ort] = key.split('/'), d = ONLINE.karte[key], own = key === standortKey(), platz = kasernenPlatz(key);
  let h = '<div class="panel pad" style="margin-top:10px"><div style="font-weight:700;font-size:19px">'+esc(ort)+(own ? ' <span class="tag">dein Standort</span>' : '')+'</div><div class="small muted">'+esc(bl)+'</div>'
    + '<p class="small" style="margin:8px 0">Ausbau gesamt: <b>'+(d ? d.ausbau : 0)+'</b>'+(platz ? ', Platz '+platz+' unter den Kasernen' : '')
    + '. Aktive Spieler: '+(d && d.spieler ? d.spieler : 'unter 3')+'.</p>';
  if(ONLINE.selGeb) h += '<div class="small" style="margin-bottom:10px">' + GEB.map(g => esc(g.name)+': Stufe '+((ONLINE.selGeb[g.id] && ONLINE.selGeb[g.id].stufe) || 0)).join('<br>') + '</div>';
  if(!own){
    const cost = S.standort ? 5*G.rank().sold : 0;
    h += '<button class="btn wide" data-act="versetzen" data-id="'+esc(key)+'" '+(S.money < cost ? 'disabled' : '')+'>Hierhin versetzen lassen'+(cost ? ' ('+eur(cost)+')' : '')+'</button>';
  }
  return h + '</div>';
}

/* =========================================================
   SPIELOTHEK „Zum goldenen Spaten“
   Nur Spielgeld, Auszahlungsquote rund 93 %, höchstens SL_MAX Spiele am Tag.
   Wichtig für später: Diese Maschine darf nie mit Echtgeld oder einer
   kaufbaren Währung bespielbar werden.
   ========================================================= */
const SL_SYM = [
  {id:'epa',     icon:'🥫', name:'EPa-Dose',       w:7},
  {id:'stiefel', icon:'🥾', name:'Kampfstiefel',   w:6},
  {id:'bier',    icon:'🍺', name:'Feierabendbier', w:5},
  {id:'helm',    icon:'🪖', name:'Gefechtshelm',   w:4},
  {id:'orden',   icon:'🎖️', name:'Orden',          w:2},
  {id:'stern',   icon:'⭐', name:'Generalsstern',  w:1},
];
const SYMI = Object.fromEntries(SL_SYM.map(s=>[s.id,s]));
const SL_P3 = {epa:8, stiefel:12, bier:18, helm:25, orden:80, stern:400};
const SL_P2 = {bier:2, helm:2, orden:4, stern:20};
const SL_MAX = 100;
const SL_NIETE = ['Nix. Der Automat grinst dich an.', 'Daneben. Kalle am Nachbarautomaten hat schon wieder gewonnen.',
  'Nichts. So leer wie die Kantine am Freitagnachmittag.', 'Leider nur Schrott. Die EPa-Dose lacht dich aus.'];
const SL = {spinning:false, reels:['helm','stern','helm'], msg:'', bet:1};

function slPick(){ const t = SL_SYM.reduce((a,s)=>a+s.w, 0); let x = Math.random()*t; for(const s of SL_SYM){ x -= s.w; if(x < 0) return s.id; } return 'epa'; }
function slPay(r){ const [a,b,c] = r; if(a===b && b===c) return SL_P3[a]; if(a===b && SL_P2[a]) return SL_P2[a]; return r.includes('stern') ? 1 : 0; }
function slBets(){ const s = G.rank().sold; return [.1, .5, 1, 5].map(f => Math.max(1, Math.round(s*f))); }
function slLeft(){ return (!S.sl || S.sl.day !== dateStr()) ? SL_MAX : SL_MAX - S.sl.n; }
function slOpen(){ return !S.dienst && !S.einsatz; }

function renderSpielothek(){
  let h = '<h2>Spielothek „Zum goldenen Spaten“</h2><div class="panel pad slot">';
  if(!slOpen()) return h + '<p style="margin:0">' + (S.einsatz
    ? 'Im Feldlager gibt es keine Spielothek. Die Daddelkiste im Betreuungscontainer ist seit Wochen kaputt.'
    : 'Erst Dienstschluss, dann Spielothek. Brockmann sieht alles.') + '</p></div>';
  const left = slLeft(), bets = slBets(), bet = bets[SL.bet];
  h += '<div class="reels">' + SL.reels.map((r,i)=>'<div class="reel" id="reel'+i+'" aria-label="'+SYMI[r].name+'">'+SYMI[r].icon+'</div>').join('') + '</div>'
    + '<p class="slmsg" id="slmsg" aria-live="polite">' + esc(SL.msg || 'Drei Gleiche gewinnen. Ein Stern gibt den Einsatz zurück.') + '</p>'
    + '<div class="seg" role="group" aria-label="Einsatz">' + bets.map((b,i)=>'<button data-act="sl_bet" data-id="'+i+'" aria-pressed="'+(SL.bet===i)+'">'+eur(b)+'</button>').join('') + '</div>'
    + '<button class="btn wide" style="margin-top:10px" data-act="sl_spin" '+((SL.spinning || left<=0 || S.money<bet) ? 'disabled' : '')+'>'
    + (left > 0 ? 'Hebel ziehen ('+eur(bet)+')' : 'Für heute geschlossen') + '</button>'
    + '<p class="small muted" style="margin:10px 0 0">Noch '+left+' von '+SL_MAX+' Spielen heute. Gespielt wird nur mit Spielgeld.</p>'
    + '<details class="small" style="margin-top:8px"><summary>Gewinntabelle</summary><ul class="req" style="margin:6px 0 0">'
    + SL_SYM.slice().reverse().map(s => '<li class="ok"><b>'+s.icon+'</b><span>3× '+s.name+': '+SL_P3[s.id]+'-fach'+(SL_P2[s.id] ? ', 2× von links: '+SL_P2[s.id]+'-fach' : '')+'</span></li>').join('')
    + '<li class="ok"><b>⭐</b><span>Mindestens ein Stern: Einsatz zurück</span></li></ul></details>';
  return h + '</div>';
}

function slSpin(){
  if(SL.spinning || !slOpen() || slLeft() <= 0) return;
  const bet = slBets()[SL.bet];
  if(S.money < bet){ toast('Zu wenig Geld.'); return; }
  // Ergebnis wird vor der Animation gespeichert, damit Neuladen nichts ändert
  const res = [slPick(), slPick(), slPick()], x = slPay(res), win = bet * x;
  S.money += win - bet;
  if(!S.sl || S.sl.day !== dateStr()) S.sl = {day:dateStr(), n:0};
  S.sl.n++; save();
  SL.spinning = true; SL.msg = '…'; render(); renderRes();
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stops = reduce ? [0,0,0] : [700, 1100, 1500], t0 = Date.now();
  const iv = setInterval(() => {
    const t = Date.now() - t0;
    for(let i=0;i<3;i++){
      const el = document.getElementById('reel'+i); if(!el) continue;
      if(t < stops[i]){ el.textContent = SL_SYM[Math.floor(Math.random()*SL_SYM.length)].icon; el.classList.add('spin'); }
      else { el.textContent = SYMI[res[i]].icon; el.classList.remove('spin'); }
    }
    if(t >= stops[2]){
      clearInterval(iv); SL.spinning = false; SL.reels = res;
      SL.msg = x >= 400 ? 'JACKPOT! Drei Generalssterne: +'+eur(win)+'!'
        : x > 1 ? 'Gewonnen: '+eur(win)+'.'
        : x === 1 ? 'Einsatz zurück.' : pick(SL_NIETE);
      render(); renderRes();
    }
  }, 70);
}

// Als App installierbar machen
if('serviceWorker' in navigator && location.protocol === 'https:'){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }

/* =========================================================
   START
   ========================================================= */
boot();
setInterval(() => {
  if(!S || !USER || !ONLINE.profile) return;
  const before = S.stamina;
  const r = G.tick();
  if(r.changed){ render(); r.events.forEach((m,i)=>setTimeout(()=>toast(m), i*1600)); }
  else { if(S.stamina!==before) renderRes(); live(); }
}, 1000);
</script>
