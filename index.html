const CL_NOW = (CHANGELOG.find(c => clItems(c).length) || CHANGELOG[0]).v;
function clSeen(){ try{ return Number(localStorage.getItem('sg_cl_seen') || 0); }catch(e){ return CL_NOW; } }
function clMark(){ try{ localStorage.setItem('sg_cl_seen', String(CL_NOW)); }catch(e){} }
function clItems(c){
  const online = typeof renderChat === 'function';
  return c.p.filter(x => typeof x === 'string' || online).map(x => typeof x === 'string' ? x : x.x);
}
function clEntry(c, neu){
  return '<div class="cl' + (neu ? ' neu' : '') + '"><div class="clh"><b>' + esc(c.t) + '</b><span class="small muted">' + esc(c.d) + '</span></div>'
    + '<ul>' + clItems(c).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
}
function clShow(alle){
  const seen = clSeen();
  const list = (alle ? CHANGELOG : seen ? CHANGELOG.filter(c => c.v > seen) : CHANGELOG.slice(0, 1)).filter(c => clItems(c).length);   // ohne Eintrag nur das neueste Update
  clMark();
  document.getElementById('modalHost').innerHTML = '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="clt"><div class="sheet clsheet">'
    + '<div class="stamp good" style="font-size:15px">' + (alle ? 'ÄNDERUNGEN' : 'NEU') + '</div>'
    + '<h2 id="clt" style="margin:8px 0 2px;text-align:center">' + (alle ? 'Was sich geändert hat' : 'Neu im Dienst') + '</h2>'
    + '<p class="small muted" style="text-align:center;margin:0 0 12px">' + (alle ? 'Alle Updates im Überblick.' : 'Das hat sich seit deinem letzten Besuch geändert.') + '</p>'
    + '<div class="cllist">' + (list.length ? list : CHANGELOG.slice(0, 1)).map(c => clEntry(c, !alle || c.v > seen)).join('') + '</div>'
    + (alle ? '' : '<button class="linkbtn" data-act="changelog" data-id="alle" style="margin-top:10px">Alle Änderungen ansehen</button>')
    + '<button class="btn wide" data-act="close" style="margin-top:12px">Verstanden</button></div></div>';
}
function clAuto(){
  if(!S) return;
  if(tutOn()){ clMark(); return; }               // ganz neue Spieler kennen nichts Altes
  if(clSeen() >= CL_NOW) return;
  const host = document.getElementById('modalHost'); if(!host || host.innerHTML.trim()) return;
  clShow(false);
}

/* =========================================================
   STAMMAKTE: alles Persönliche an einem Ort
   ========================================================= */
function pkZiffer(){
  // Personenkennziffer im Stil der Bundeswehr: Datum des Diensteintritts, Anfangsbuchstabe, Prüfnummer
  const d = new Date(S.start), p = n => String(n).padStart(2, '0');
  let h = 7; for(const c of String(S.name) + S.start) h = (h * 31 + c.charCodeAt(0)) % 99991;
  return p(d.getDate()) + p(d.getMonth() + 1) + String(d.getFullYear()).slice(2) + '-' + String(S.name || 'X')[0].toUpperCase() + '-' + String(h).padStart(5, '0');
}
function akteFacts(rows){
  return '<dl class="akfacts">' + rows.filter(Boolean).map(([k, v]) => '<dt>' + k + '</dt><dd>' + v + '</dd>').join('') + '</dl>';
}
function renderAkte(){
  const r = G.rank(), TSKN = {heer:'Heer', lw:'Luftwaffe', marine:'Marine'};
  const fs = FAHRSCHULE.filter(x => S.fsDone && S.fsDone[x.id]);
  const lg = LEHRGAENGE.filter(l => S.lehrgaenge[l.id]);
  const orden = ORDEN.filter(o => S.orden && S.orden[o.id]);
  const album = ITEMS.filter(i => S.album[i.id]).length;
  let h = '<h2>Personalien</h2><div class="panel akte">'
    + '<div class="aktab">STAMMAKTE</div><div class="akstamp">Nur für den Dienstgebrauch</div>'
    + '<div class="akkopf">' + insignia(S.rank, 70) + '<div><div class="small muted">' + esc(TSKN[S.tsk || 'heer'] || 'Heer') + ' · ' + esc(GROUPS[r.g]) + '</div>'
    + '<div class="akrank">' + esc(r.name) + '</div><div class="akname">' + esc(S.name) + '</div>'
    + (ordenCount() ? '<div class="spange" title="Ordensspange">' + orden.map(o => ribbon(o)).join('') + '</div>' : '') + '</div></div>'
    + akteFacts([
        ['Personenkennziffer', '<span class="num">' + pkZiffer() + '</span>'],
        ['Verwendung', S.verw ? esc(VERW[S.verw].name) : '<span class="muted">noch offen</span>'],
        ['Standort', S.standort ? esc(S.standort.ort) + (S.standort.bl ? ', ' + esc(S.standort.bl) : '') : '<span class="muted">noch offen</span>'],
        ['Dienstverhältnis', esc(DZ[S.verpfl].name)],
        ['Dienstzeit', fmtDZ(G.weeks())],
        isFinite(G.dzLeft()) ? ['Dienstzeitende', G.dzOver() ? 'erreicht' : 'in ' + fmtDZ(G.dzLeft())] : null,
        ['Tagessold', eur(r.sold)],
        ['Diensteintritt', new Date(S.start).toLocaleDateString('de-DE')],
        S.res ? ['Wiedereinsteller', (S.res + 1) + '. Dienstzeit'] : null,
        ['Beurteilung', G.note() + ' („' + NOTES[G.note()] + '“)'],
      ])
    + '</div>';
  h += '<h2>Statistik</h2><div class="panel pad"><div class="akstats">' + [
      ['Dienste', S.dienstCount || 0], ['Auslandseinsätze', S.einsaetze.length], ['Lehrgänge', lg.length + ' / ' + LEHRGAENGE.length],
      ['Scheine', fs.length + ' / ' + FAHRSCHULE.filter(x => !x.tsk || x.tsk === S.tsk).length], ['Leistungsabzeichen', medalCount()], ['Orden', orden.length + ' / ' + ORDEN.length],
      ['Sammelalbum', album + ' / ' + ITEMS.length], ['Vermögen', eur(S.money)],
    ].concat(typeof punkte === 'function' ? [['Ranglistenpunkte', punkte().toLocaleString('de-DE')]] : [])
     .map(([k, v]) => '<div><b>' + v + '</b><span>' + k + '</span></div>').join('') + '</div></div>';
  h += '<h2>Qualifikationen</h2><div class="panel pad">'
    + '<p class="akh">Führerscheine</p>' + (fs.length ? '<div class="pfchips">' + fs.map(x => '<span class="tag">' + esc(x.name) + '</span>').join('') + '</div>' : '<p class="small muted" style="margin:0">Noch keine. <button class="linkbtn" data-act="tab" data-id="fahrschule">Zur Fahrschule</button></p>')
    + '<p class="akh">Lehrgänge</p>' + (lg.length ? '<div class="pfchips">' + lg.map(l => '<span class="tag">' + esc(l.name) + (S.lgNote && S.lgNote[l.id] ? ' · Note ' + S.lgNote[l.id] : '') + '</span>').join('') + '</div>' : '<p class="small muted" style="margin:0">Noch keine. <button class="linkbtn" data-act="tab" data-id="lehrgaenge">Zu den Lehrgängen</button></p>')
    + '<p class="akh">Ausbildungsstand</p>' + STATS.map(s => '<div class="pfbar"><span>' + s.name + '</span><i><b style="width:' + Math.min(100, S.stats[s.id] / STAT_MAX * 100) + '%"></b></i><span class="num">' + S.stats[s.id] + (mstZahl(s.id) ? '<span class="mststar" title="Meisterstufen">' + '★'.repeat(mstZahl(s.id)) + '</span>' : '') + '</span></div>').join('')
    + '</div>';
  if(typeof profilZeigen === 'function' && USER)
    h += '<h2>Steckbrief</h2><div class="panel pad"><p class="small" style="margin:0 0 10px">So sehen dich andere Spieler, wenn sie dich in der Personensuche, der Rangliste oder im Chat antippen. Standort und Anmeldedaten sind nie sichtbar.</p>'
      + '<button class="btn ghost wide" data-act="profil" data-id="' + esc(S.name) + '">Meinen Steckbrief ansehen</button></div>';
  if(typeof fbCard === 'function' && USER) h += fbCard();
  return h;
}
// Übersicht: alles, was zu tun ist, in einer Liste statt vieler einzelner Kästen
function todoList(){
  const t = [];
  for(const a of (typeof lkFragen === 'function' ? lkFragen() : [])) t.push(['🚨', '<b>Entscheidung nötig:</b> ' + esc(LK_TYP.find(x => x.id === a.typ).name + ' · ' + a.ort), 'Entscheiden', 'lk_open', a.id, 'warn']);
  for(const id of (NEXT[S.rank] || [])) if(S.gaDone && G.promoReqs(id).every(x => x.ok)){ t.push(['⭐', '<b>Beförderung möglich:</b> ' + esc(R[id].name), 'Beantragen', 'tab', 'laufbahn', 'gold']); break; }
  if(S.pakete) t.push(['📦', '<b>Feldpost:</b> ' + (S.pakete === 1 ? 'ein Paket wartet' : S.pakete + ' Pakete warten'), 'Öffnen', 'paket', '', 'gold']);
  if(G.dzOver()) t.push(['📋', '<b>Dienstzeit zu Ende.</b> Weiterverpflichten oder ausscheiden', 'Entscheiden', 'tab', 'dv', 'warn']);
  else if(G.dzLeft() <= 6) t.push(['📋', 'Dienstzeitende in ' + fmtDZ(G.dzLeft()), 'Ansehen', 'tab', 'dv', '']);
  if(pflegePflicht() && !S.pflege){ S.ui = S.ui || {}; S.ui['f:Pflegepflichtversicherung'] = true; }
  if(pflegePflicht() && !S.pflege) t.push(['🛡️', '<b>Pflegepflichtversicherung fehlt</b>' + (S.pflegeFrist && now() < S.pflegeFrist ? ', Frist ' + fmtRest(S.pflegeFrist - now()).replace(/\.$/, '') : ', Frist abgelaufen'), 'Abschließen', 'tab', 'vorsorge', 'warn']);
  if(!S.standort) t.push(['📍', 'Heimatstandort festlegen', 'Wählen', 'tab', 'dv', '']);
  if(!S.verw && G.rank().t >= 1) t.push(['🎯', 'Verwendung wählen', 'Wählen', 'tab', 'dv', '']);
  if(!t.length) return '';
  return '<h2>Zu erledigen</h2><div class="panel todo">' + t.map(([ic, txt, btn, act, id, cls]) =>
    '<div class="row' + (cls === 'warn' ? ' warn' : '') + '"><span class="tdi" aria-hidden="true">' + ic + '</span><span class="tdt">' + txt + '</span><button class="btn mini' + (cls === 'gold' ? ' gold' : '') + '" data-act="' + act + '"' + (id ? ' data-id="' + id + '"' : '') + '>' + btn + '</button></div>').join('') + '</div>';
}

/* =========================================================
   ÜBUNGSPLATZ: Minispiele Schießstand, Basis-Fitness-Test, Spindkontrolle
   Pro Spiel und Tag zählt der erste Lauf als Wertungslauf mit Belohnung,
   danach ist freies Training. Abbrechen zählt als Wertungslauf.
   ========================================================= */
const MG_GAMES = {
  schiess:{name:'Schießstand', art:'range', tiers:[140, 220, 300], max:520, unit:'Ringe',
    desc:'30 Sekunden, Magazin mit 8 Schuss. Ziele treffen, bevor sie verschwinden. Zivilisten nicht treffen!',
    rules:['Mitte trifft 10 Ringe, außen 6. Daneben kostet 2.', 'Entkommene Ziele kosten 3, ein getroffener Zivilist kostet 15.', 'Nachladen dauert über eine Sekunde. Die Ziele werden kleiner und schneller.']},
  bft:{name:'Basis-Fitness-Test', art:'run', tiers:[150, 205, 250], max:300, unit:'Punkte',
    desc:'Drei Stationen wie beim echten BFT: Sprint, Klimmhang und 1000-Meter-Lauf.',
    rules:['Sprint: abwechselnd links und rechts tippen, am Bahnende rechtzeitig wenden. Zweimal dieselbe Seite bringt dich ins Stolpern.', 'Klimmhang: Halten drücken und loslassen, um im grünen Bereich zu bleiben. Der Bereich wird enger, die Kraft lässt nach.', '1000 m: Tippen, wenn der Zeiger im grünen Feld ist. Daneben stolperst du.']},
  spind:{name:'Spindkontrolle', art:'locker', tiers:[100, 150, 185], max:215, unit:'Punkte',
    desc:'Der Spieß kommt in 30 Sekunden. Finde die 6 Fehler im Spind.',
    rules:['Fehler antippen: schiefe Kleidung, schmutzige Stiefel, falsch gefaltete Wäsche, Dinge, die nicht in den Spind gehören.', 'Falsch getippt kostet 3 Sekunden.', 'Wer alle 6 findet, bekommt Bonuspunkte für die restliche Zeit.']},
};
const MG_TIER = ['Keine Stufe', 'Bronze', 'Silber', 'Gold'];
const MG_REW = [null, {money:1, bp:3}, {money:2, bp:6}, {money:3.5, bp:10}];
function mgState(){
  const d = dateStr();
  if(!S.mini) S.mini = {day:d, rew:{}, res:{}, best:{}, gold:{}};
  if(S.mini.day !== d){ S.mini.day = d; S.mini.rew = {}; S.mini.res = {}; }
  return S.mini;
}
function mgTier(g, sc){ const t = MG_GAMES[g].tiers; return sc >= t[2] ? 3 : sc >= t[1] ? 2 : sc >= t[0] ? 1 : 0; }

let MG = null;
function mgOpen(g, ranked){
  const st = mgState();
  if(ranked && st.rew[g]) ranked = false;
  const G0 = MG_GAMES[g];
  const W = Math.min(window.innerWidth - 24, 440), H = Math.max(300, Math.min(window.innerHeight - 250, 520));
  MG = {g, ranked, phase:'intro', W, H, s:{}, raf:0};
  document.getElementById('modalHost').innerHTML = '<div class="overlay mgov" role="dialog" aria-modal="true" aria-labelledby="mgt"><div class="mg">'
    + '<div class="mgtop"><b id="mgt">' + esc(G0.name) + (ranked ? ' · Wertungslauf' : ' · Training') + '</b><span id="mgInfo" class="num"></span><button class="mgx" data-act="mg_close" aria-label="Schließen">✕</button></div>'
    + '<div class="mgstage" style="width:' + W + 'px;height:' + H + 'px"><canvas id="mgC" width="' + W * 2 + '" height="' + H * 2 + '" style="width:' + W + 'px;height:' + H + 'px"></canvas><div class="mgmsg" id="mgMsg"></div></div>'
    + '<div class="mgctl" id="mgCtl"></div></div></div>';
  mgIntro();
}
function mgIntro(){
  const G0 = MG_GAMES[MG.g], st = mgState();
  document.getElementById('mgMsg').innerHTML = '<div class="mgcard"><p>' + esc(G0.desc) + '</p><ul>' + G0.rules.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul>'
    + '<p class="small">Stufen: Bronze ab ' + G0.tiers[0] + ', Silber ab ' + G0.tiers[1] + ', Gold ab ' + G0.tiers[2] + ' ' + G0.unit + '.' + (st.best[MG.g] ? ' Dein Bestwert: ' + st.best[MG.g] + '.' : '') + '</p>'
    + (MG.ranked ? '<p class="small"><b>Wertungslauf:</b> Nur dieser Lauf zählt heute für die Belohnung. Abbrechen zählt mit.</p>' : '<p class="small">Training: keine Belohnung, aber der Bestwert zählt für die Wochenbestenliste.</p>')
    + '<button class="btn gold wide" data-act="mg_go">Los geht’s</button></div>';
  document.getElementById('mgCtl').innerHTML = '';
}
function mgGo(){
  if(!MG || MG.phase !== 'intro') return;
  if(MG.ranked){ const st = mgState(); st.rew[MG.g] = true; st.res[MG.g] = 0; save(); }
  MG.phase = 'count'; const msg = document.getElementById('mgMsg');
  let n = 3; msg.innerHTML = '<div class="mgcount">3</div>';
  const iv = setInterval(() => { n--; if(!MG){ clearInterval(iv); return; } if(n > 0) msg.innerHTML = '<div class="mgcount">' + n + '</div>'; else { clearInterval(iv); msg.innerHTML = ''; mgStart(); } }, 700);
}
function mgStart(){
  const c = document.getElementById('mgC'); if(!c || !MG) return;
  MG.ctx = c.getContext('2d'); MG.ctx.setTransform(2, 0, 0, 2, 0, 0);
  MG.phase = 'run'; MG.t0 = performance.now(); MG.last = MG.t0;
  MG_IMPL[MG.g].init(MG.s, MG);
  c.onpointerdown = e => { e.preventDefault(); if(MG && MG.phase === 'run'){ const r = c.getBoundingClientRect(); MG_IMPL[MG.g].down(MG.s, e.clientX - r.left, e.clientY - r.top, MG); } };
  c.onpointerup = c.onpointercancel = c.onpointerleave = () => { if(MG && MG.phase === 'run' && MG_IMPL[MG.g].up) MG_IMPL[MG.g].up(MG.s, MG); };
  const loop = now2 => {
    if(!MG || MG.phase !== 'run' || !document.getElementById('mgC')) return;
    const dt = Math.min(.05, (now2 - MG.last) / 1000); MG.last = now2;
    const el = now2 - MG.t0;
    const done = MG_IMPL[MG.g].frame(MG.s, el, dt, MG);
    MG_IMPL[MG.g].draw(MG.s, MG.ctx, MG, el);
    if(done) return mgEnd();
    MG.raf = requestAnimationFrame(loop);
  };
  MG.raf = requestAnimationFrame(loop);
}
// Steuerknöpfe unter dem Spielfeld (reagieren sofort beim Antippen)
function mgButtons(list){
  const box = document.getElementById('mgCtl'); if(!box) return;
  box.innerHTML = list.map(b => '<button class="btn ' + (b.cls || '') + '" data-mg="' + b.id + '" style="flex:' + (b.flex || 1) + '">' + b.label + '</button>').join('');
  box.querySelectorAll('[data-mg]').forEach(el => {
    el.onpointerdown = e => { e.preventDefault(); if(MG && MG.phase === 'run') MG_IMPL[MG.g].btn(MG.s, el.dataset.mg, true, MG); };
    el.onpointerup = el.onpointercancel = el.onpointerleave = e => { if(MG && MG.phase === 'run' && MG_IMPL[MG.g].btnUp) MG_IMPL[MG.g].btnUp(MG.s, el.dataset.mg, MG); };
    el.onclick = e => e.preventDefault();
  });
}
function mgInfo(t){ const i = document.getElementById('mgInfo'); if(i) i.textContent = t; }
function mgEnd(abort){
  if(!MG) return;
  cancelAnimationFrame(MG.raf);
  const g = MG.g, G0 = MG_GAMES[g], st = mgState();
  const sc = abort ? 0 : Math.max(0, Math.min(G0.max, Math.round(MG_IMPL[g].score(MG.s))));
  const tier = mgTier(g, sc), neuBest = sc > (st.best[g] || 0);
  if(neuBest) st.best[g] = sc;
  let rew = '';
  if(MG.ranked){
    st.res[g] = sc;
    if(tier){ const r = MG_REW[tier], m = Math.round(r.money * G.rank().sold); S.money += m; G.addPoints(r.bp); rew = eur(m) + ', ' + r.bp + ' Punkte'; if(tier === 3) st.gold[g] = (st.gold[g] || 0) + 1; }
    if(typeof waAdd === 'function') try{ waAdd('mini', 1); }catch(e){}
  }
  save(); if(typeof mgMelden === 'function' && !abort && sc > 0) mgMelden(g, sc);
  MG.phase = 'end';
  const det = abort ? '' : (MG_IMPL[g].detail ? MG_IMPL[g].detail(MG.s) : '');
  const msg = document.getElementById('mgMsg');
  if(msg) msg.innerHTML = '<div class="mgcard mgres"><div class="stamp ' + (tier ? 'good' : '') + '">' + (abort ? 'ABGEBROCHEN' : MG_TIER[tier].toUpperCase()) + '</div>'
    + '<div class="mgscore">' + sc + ' <small>' + G0.unit + '</small></div>' + (det ? '<p class="small" style="text-align:center">' + det + '</p>' : '')
    + (neuBest && sc ? '<p style="text-align:center"><b>Neuer Bestwert!</b></p>' : '<p class="small muted" style="text-align:center">Bestwert: ' + (st.best[g] || 0) + '</p>')
    + (MG.ranked ? (rew ? '<p style="text-align:center">Belohnung: <b>' + rew + '</b></p>' : '<p class="small" style="text-align:center">Keine Stufe erreicht. Morgen gibt es einen neuen Wertungslauf.</p>') : '')
    + '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn ghost" data-act="mg_close" style="flex:1">Wegtreten</button><button class="btn gold" data-act="mg_again" style="flex:1">Training</button></div></div>';
  const box = document.getElementById('mgCtl'); if(box) box.innerHTML = '';
  if(typeof render === 'function') setTimeout(() => { renderNav(); renderRes(); }, 0);
}

/* ---------- Schießstand ---------- */
const MG_IMPL = {};
MG_IMPL.schiess = {
  init(s, M){ Object.assign(s, {dur:30000, tg:[], next:500, mag:8, rel:0, sc:0, fx:[], hits:0, shots:0, zivil:0, weg:0, el:0}); mgButtons([{id:'reload', label:'Nachladen', cls:'ghost'}]); },
  frame(s, el, dt, M){
    s.el = el; const p = Math.min(1, el / s.dur);
    if(el >= s.next){
      const kind = Math.random() < .16 ? 'zivil' : 'ziel', r = (33 - 13 * p) * (.85 + Math.random() * .3);
      let x, y, k = 0;
      do { x = r + 6 + Math.random() * (M.W - 2 * r - 12); y = r + 6 + Math.random() * (M.H - 2 * r - 12); k++; } while(k < 10 && s.tg.some(t => Math.hypot(t.x - x, t.y - y) < t.r + r + 6));
      s.tg.push({x, y, r, kind, born:el, life:1150 - 500 * p});
      s.next += 740 - 250 * p + (Math.random() * 220 - 110);
    }
    for(const t of s.tg.slice()) if(el - t.born > t.life){ s.tg.splice(s.tg.indexOf(t), 1); if(t.kind === 'ziel'){ s.sc -= 3; s.weg++; s.fx.push({x:t.x, y:t.y, t:'−3', c:'#E57373', at:el}); } }
    if(s.rel && el >= s.rel){ s.rel = 0; s.mag = 8; }
    s.fx = s.fx.filter(f => el - f.at < 700);
    mgInfo(Math.max(0, Math.ceil((s.dur - el) / 1000)) + ' s · ' + Math.max(0, s.sc) + ' Ringe');
    return el >= s.dur;
  },
  down(s, x, y, M){
    const el = s.el;
    if(s.rel) return;
    if(s.mag <= 0){ s.fx.push({x, y, t:'Klick! Nachladen', c:'#E3B23C', at:el}); return; }
    s.mag--; s.shots++;
    let hit = null, best = 9;
    for(const t of s.tg){ const cr = t.r * (1 - .35 * (el - t.born) / t.life), d = Math.hypot(t.x - x, t.y - y) / cr; if(d <= 1 && d < best){ best = d; hit = t; } }
    if(!hit){ s.sc -= 2; s.fx.push({x, y, t:'−2', c:'#E57373', at:el}); return; }
    s.tg.splice(s.tg.indexOf(hit), 1);
    if(hit.kind === 'zivil'){ s.sc -= 15; s.zivil++; s.fx.push({x, y, t:'ZIVILIST −15', c:'#FF5252', at:el}); return; }
    const pts = best < .2 ? 10 : best < .4 ? 9 : best < .6 ? 8 : best < .8 ? 7 : 6;
    s.sc += pts; s.hits++; s.fx.push({x, y, t:'+' + pts, c:pts >= 9 ? '#FFD54F' : '#C5E1A5', at:el});
  },
  btn(s, id){ if(id === 'reload' && !s.rel && s.mag < 8) s.rel = s.el + 1150; },
  draw(s, c, M, el){
    c.fillStyle = '#2B3322'; c.fillRect(0, 0, M.W, M.H);
    c.strokeStyle = 'rgba(255,255,255,.06)'; for(let x = 0; x < M.W; x += 40){ c.beginPath(); c.moveTo(x, 0); c.lineTo(x, M.H); c.stroke(); }
    for(const t of s.tg){
      const a = (el - t.born) / t.life, cr = t.r * (1 - .35 * a);
      c.globalAlpha = a > .8 ? 1 - (a - .8) * 4 : 1;
      if(t.kind === 'ziel'){
        for(let i = 5; i >= 1; i--){ c.beginPath(); c.arc(t.x, t.y, cr * i / 5, 0, 7); c.fillStyle = i % 2 ? '#F2F0E6' : '#1E1E1E'; c.fill(); }
        c.beginPath(); c.arc(t.x, t.y, cr * .2, 0, 7); c.fillStyle = '#C62828'; c.fill();
      } else {
        c.beginPath(); c.arc(t.x, t.y, cr, 0, 7); c.fillStyle = '#8EC5E8'; c.fill();
        c.fillStyle = '#1F4E79'; c.beginPath(); c.arc(t.x, t.y - cr * .28, cr * .25, 0, 7); c.fill();
        c.beginPath(); c.ellipse(t.x, t.y + cr * .38, cr * .42, cr * .32, 0, Math.PI, 0); c.fill();
      }
      c.globalAlpha = 1;
    }
    c.font = '700 15px Barlow, sans-serif'; c.textAlign = 'center';
    for(const f of s.fx){ c.globalAlpha = 1 - (el - f.at) / 700; c.fillStyle = f.c; c.fillText(f.t, f.x, f.y - 14 - (el - f.at) / 25); }
    c.globalAlpha = 1;
    // Magazin
    for(let i = 0; i < 8; i++){ c.fillStyle = i < s.mag ? '#E3B23C' : 'rgba(255,255,255,.15)'; c.fillRect(10 + i * 11, M.H - 22, 7, 14); }
    if(s.rel){ c.fillStyle = '#E3B23C'; c.textAlign = 'left'; c.fillText('Lädt nach …', 104, M.H - 10); }
    else if(!s.mag){ c.fillStyle = '#FF8A65'; c.textAlign = 'left'; c.fillText('Magazin leer!', 104, M.H - 10); }
  },
  score(s){ return s.sc; },
  detail(s){ return s.hits + ' Treffer bei ' + s.shots + ' Schuss' + (s.weg ? ', ' + s.weg + ' Ziele entkommen' : '') + (s.zivil ? ', ' + s.zivil + '× Zivilist getroffen' : ''); },
};

/* ---------- Basis-Fitness-Test ---------- */
MG_IMPL.bft = {
  init(s, M){ Object.assign(s, {st:0, el:0, pts:[0, 0, 0], res:['', '', ''], pause:0}); this.stage(s, 0, 0); },
  stage(s, n, el){
    s.st = n; s.t0 = el; s.pause = el + 1300;
    if(n === 0){ Object.assign(s, {lane:0, step:0, side:'', frz:0, turn:0, pen:0}); mgButtons([{id:'L', label:'Links'}, {id:'W', label:'Wende', cls:'ghost'}, {id:'R', label:'Rechts'}]); }
    if(n === 1){ Object.assign(s, {p:.6, v:0, hold:false, kraft:2.5, gust:0, gv:0}); mgButtons([{id:'H', label:'Halten', flex:1}]); }
    if(n === 2){ Object.assign(s, {ph:0, hit:0, frz:0, m:0}); mgButtons([{id:'S', label:'Schritt', flex:1}]); }
  },
  frame(s, el, dt, M){
    s.el = el;
    if(el < s.pause){ mgInfo('Station ' + (s.st + 1) + ' / 3'); return false; }
    const t = (el - s.pause) / 1000;
    if(s.st === 0){
      mgInfo('Sprint ' + t.toFixed(1) + ' s · Bahn ' + Math.min(11, s.lane + 1) + ' / 11');
      if(s.turn && el - s.turn > 900){ s.pen += 1; s.turn = 0; s.lane++; s.step = 0; s.side = ''; s.late = el; }
      if(t + s.pen > 48 && s.lane < 11){ s.pts[0] = 0; s.res[0] = 'zu langsam'; this.stage(s, 1, el); return false; }
      if(s.lane >= 11){ const tt = t + s.pen; s.pts[0] = Math.max(0, Math.min(100, Math.round(100 - (tt - 15) * 3))); s.res[0] = tt.toFixed(1) + ' s'; this.stage(s, 1, el); }
    } else if(s.st === 1){
      const lim = .15 - Math.min(.1, t * .0022), gAmp = .5 + Math.min(1.3, t * .03);
      s.gv += (Math.random() - .5) * gAmp * 9 * dt; s.gv *= .96;
      s.v += ((s.hold ? 1.5 : -1.25) + s.gv) * dt; s.v *= .985; s.p += s.v * dt;
      if(s.p < 0){ s.p = 0; s.v = 0; } if(s.p > 1){ s.p = 1; s.v = 0; }
      s.lim = lim; if(Math.abs(s.p - .6) > lim) s.kraft -= dt;
      mgInfo('Klimmhang ' + t.toFixed(1) + ' s');
      if(s.kraft <= 0 || t >= 60){ s.pts[1] = Math.max(0, Math.min(100, Math.round(t * 2))); s.res[1] = t.toFixed(1) + ' s'; this.stage(s, 2, el); }
    } else {
      const sp = 2.4 + .1 * s.hit; s.ph += dt * sp; s.m = (Math.sin(s.ph) + 1) / 2; s.w = Math.max(.14, .26 - .006 * s.hit);
      mgInfo('1000 m · ' + (s.hit * 50) + ' m · ' + t.toFixed(1) + ' s');
      if(s.hit >= 20){ s.pts[2] = Math.max(0, Math.min(100, Math.round(100 - (t - 18) * 4))); s.res[2] = t.toFixed(1) + ' s'; return true; }
      if(t > 45){ s.pts[2] = 0; s.res[2] = 'abgebrochen'; return true; }
    }
    return false;
  },
  btn(s, id){
    const el = s.el; if(el < s.pause) return;
    if(s.st === 0){
      if(el < s.frz) return;
      if(id === 'W'){ if(s.turn){ if(el - s.turn > 450) s.pen += .4; s.turn = 0; s.lane++; s.step = 0; s.side = ''; } else s.frz = el + 350; return; }
      if(s.turn) return;
      if(id === s.side){ s.frz = el + 380; s.stol = el; return; }
      s.side = id; s.step++; if(s.step >= 8) s.turn = el;
    } else if(s.st === 1){ if(id === 'H') s.hold = true; }
    else if(id === 'S'){ if(el < s.frz) return; if(Math.abs(s.m - .5) <= s.w / 2) s.hit++; else { s.frz = el + 700; s.stol = el; } }
  },
  btnUp(s, id){ if(s.st === 1 && id === 'H') s.hold = false; },
  down(s, x, y){ if(s.st === 1) s.hold = true; },
  up(s){ if(s.st === 1) s.hold = false; },
  draw(s, c, M, el){
    c.fillStyle = '#2B3322'; c.fillRect(0, 0, M.W, M.H);
    c.textAlign = 'center'; c.fillStyle = '#F2F5EA';
    if(el < s.pause){
      c.font = "400 26px 'Black Ops One', sans-serif"; c.fillText(['Sprint 11 × 10 m', 'Klimmhang', '1000-m-Lauf'][s.st], M.W / 2, M.H / 2 - 8);
      c.font = '600 15px Barlow, sans-serif'; c.fillText(['Links und rechts abwechselnd, am Ende wenden', 'Im grünen Bereich bleiben', 'Im grünen Feld tippen'][s.st], M.W / 2, M.H / 2 + 22);
      return;
    }
    if(s.st === 0){
      const top = 40, bot = M.H - 40, lanes = 11;
      c.fillStyle = '#8B5A3C'; c.fillRect(30, top, M.W - 60, bot - top);
      c.strokeStyle = 'rgba(255,255,255,.5)'; c.setLineDash([6, 6]); for(let i = 1; i < lanes; i++){ const y = top + (bot - top) * i / lanes; c.beginPath(); c.moveTo(30, y); c.lineTo(M.W - 30, y); c.stroke(); } c.setLineDash([]);
      const ln = Math.min(10, s.lane), y = top + (bot - top) * (ln + .5) / lanes, prog = s.step / 8, dir = ln % 2 ? -1 : 1;
      const x = dir > 0 ? 40 + prog * (M.W - 80) : M.W - 40 - prog * (M.W - 80);
      c.fillStyle = s.stol && el - s.stol < 380 ? '#FF7043' : '#E3B23C'; c.beginPath(); c.arc(x, y, 9, 0, 7); c.fill();
      if(s.turn){ c.fillStyle = '#FFD54F'; c.font = '700 22px Barlow, sans-serif'; c.fillText('WENDE!', M.W / 2, 28); }
      else if(s.stol && el - s.stol < 380){ c.fillStyle = '#FF7043'; c.font = '700 18px Barlow, sans-serif'; c.fillText('Gestolpert!', M.W / 2, 28); }
    } else if(s.st === 1){
      const bx = M.W / 2 - 30, by = 30, bh = M.H - 90;
      c.fillStyle = '#1A1F15'; c.fillRect(bx, by, 60, bh);
      const zy = by + bh * (1 - .6 - s.lim), zh = bh * s.lim * 2; c.fillStyle = 'rgba(102,187,106,.45)'; c.fillRect(bx, zy, 60, zh);
      const py = by + bh * (1 - s.p); c.fillStyle = Math.abs(s.p - .6) > s.lim ? '#FF7043' : '#E3B23C'; c.fillRect(bx - 12, py - 4, 84, 8);
      c.fillStyle = '#F2F5EA'; c.font = '600 14px Barlow, sans-serif'; c.fillText('Kraft', M.W / 2, M.H - 40);
      c.fillStyle = '#1A1F15'; c.fillRect(M.W / 2 - 80, M.H - 32, 160, 10); c.fillStyle = s.kraft > .8 ? '#66BB6A' : '#FF7043'; c.fillRect(M.W / 2 - 80, M.H - 32, 160 * Math.max(0, s.kraft) / 2.5, 10);
    } else {

MG_IMPL.spind = {
  init(s, M){
    const W = M.W, H = M.H, x0 = 14, w = W - 28;
    const colL = w * .38, shelfX = x0 + colL + 8, shelfW = w - colL - 8, y0 = 14, hh = H - 28;
    const slots = [];
    for(let i = 0; i < 3; i++) slots.push({x:x0 + 4 + i * (colL - 8) / 3, y:y0 + 26, w:(colL - 8) / 3 - 4, h:hh * .52, zone:'hang'});
    const rows = 3, sh = hh * .7 / rows;
    for(let r = 0; r < rows; r++) for(let k = 0; k < 3; k++) slots.push({x:shelfX + k * shelfW / 3 + 3, y:y0 + r * sh + 6, w:shelfW / 3 - 6, h:sh - 14, zone:'fach'});
    for(let k = 0; k < 4; k++) slots.push({x:x0 + k * w / 4 + 4, y:y0 + hh * .78, w:w / 4 - 8, h:hh * .2, zone:'boden'});
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const shuf = a => a.sort(() => Math.random() - .5);
    const fach = shuf(['hemden', 'hemden', 'handtuch', 'handtuch', 'socken', 'socken', 'barett', 'guertel', 'tshirts']);
    for(const sl of slots){ sl.type = sl.zone === 'hang' ? pick(['jacke', 'hemd', 'hose']) : sl.zone === 'boden' ? pick(['stiefel', 'stiefel', 'sport']) : fach.pop(); }
    shuf(slots.slice()).slice(0, 6).forEach((sl, i) => { sl.err = true; if(i === 0 && sl.zone === 'fach') sl.type = pick(['chips', 'dose']); sl.v = Math.random(); });
    Object.assign(s, {dur:30000, slots, found:0, pen:0, fx:[], el:0, x0, y0, w, hh, colL});
    mgButtons([]);
  },
  frame(s, el){ s.el = el; const rest = s.dur - el - s.pen; s.fx = s.fx.filter(f => el - f.at < 600); mgInfo(Math.max(0, Math.ceil(rest / 1000)) + ' s · ' + s.found + ' / 6 Fehler'); return rest <= 0 || s.found >= 6; },
  down(s, x, y){
    const sl = s.slots.find(q => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
    if(sl && sl.err && !sl.ok){ sl.ok = true; s.found++; return; }
    if(sl && sl.ok) return;
    s.pen += 3000; s.fx.push({x, y, at:s.el});
  },
  draw(s, c, M, el){
    c.fillStyle = '#4A4F45'; c.fillRect(0, 0, M.W, M.H);
    c.fillStyle = '#6E7466'; c.fillRect(s.x0, s.y0, s.w, s.hh); c.strokeStyle = '#33372F'; c.lineWidth = 3; c.strokeRect(s.x0, s.y0, s.w, s.hh);
    c.fillStyle = '#5B6154'; c.fillRect(s.x0 + s.colL, s.y0, 8, s.hh * .74);
    c.strokeStyle = '#9EA394'; c.lineWidth = 3; c.beginPath(); c.moveTo(s.x0 + 6, s.y0 + 22); c.lineTo(s.x0 + s.colL - 4, s.y0 + 22); c.stroke();
    const sh = s.hh * .7 / 3; c.fillStyle = '#3E433A'; for(let r = 1; r <= 3; r++) c.fillRect(s.x0 + s.colL + 8, s.y0 + r * sh - 4, s.w - s.colL - 8, 4);
    c.fillRect(s.x0, s.y0 + s.hh * .76, s.w, 4);
    for(const sl of s.slots) this.item(c, sl);
    for(const sl of s.slots) if(sl.ok){ c.strokeStyle = '#66BB6A'; c.lineWidth = 3; c.strokeRect(sl.x + 1, sl.y + 1, sl.w - 2, sl.h - 2); c.fillStyle = '#66BB6A'; c.font = '700 18px Barlow'; c.textAlign = 'center'; c.fillText('✓', sl.x + sl.w - 10, sl.y + 18); }
    for(const f of s.fx){ c.globalAlpha = 1 - (el - f.at) / 600; c.fillStyle = '#FF5252'; c.font = '700 22px Barlow'; c.textAlign = 'center'; c.fillText('✗ −3 s', f.x, f.y); c.globalAlpha = 1; }
  },
  item(c, sl){
    const {x, y, w, h, type, err, v} = sl, cx = x + w / 2;

    c.save();
    if(type === 'jacke' || type === 'hemd' || type === 'hose'){
      c.translate(cx, y); if(err) c.rotate((v > .5 ? 1 : -1) * .14);
      c.strokeStyle = '#2A2A2A'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -4); c.lineTo(0, 6); c.stroke();
      c.fillStyle = type === 'hemd' ? '#7D8A5A' : fl;
      if(type === 'hose'){ c.fillRect(-w * .3, 8, w * .6, h * .2); c.fillRect(-w * .3, 8 + h * .18, w * .27, h * .7); c.fillRect(w * .03, 8 + h * .18, w * .27, h * .7); }
      else { c.beginPath(); c.moveTo(-w * .42, 14); c.lineTo(w * .42, 14); c.lineTo(w * .38, h * (type === 'jacke' ? .95 : .8)); c.lineTo(-w * .38, h * (type === 'jacke' ? .95 : .8)); c.closePath(); c.fill(); c.fillStyle = fd; c.fillRect(-1.5, 14, 3, h * .7); }
    } else if(type === 'hemden' || type === 'tshirts'){
      const n = 4, lh = Math.min(10, h / 5), col = type === 'hemden' ? '#7D8A5A' : '#3D4630';
      for(let i = 0; i < n; i++){ const off = err && i === (v > .5 ? 1 : 2) ? w * .16 : 0; c.fillStyle = col; c.fillRect(x + 6 + off, y + h - (i + 1) * (lh + 2), w - 12, lh); c.fillStyle = 'rgba(0,0,0,.2)'; c.fillRect(x + 6 + off, y + h - (i + 1) * (lh + 2) + lh - 2, w - 12, 2); }
    } else if(type === 'handtuch'){
      c.fillStyle = '#C9C3B0'; const th = Math.min(h * .6, 30); c.fillRect(x + 6, y + h - th, w - 12, th); c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(x + 6, y + h - th / 2, w - 12, 2);
      if(err){ c.fillStyle = '#C9C3B0'; c.beginPath(); c.moveTo(x + w - 6, y + h - th); c.lineTo(x + w + 2, y + h - th - 10); c.lineTo(x + w - 14, y + h - th); c.fill(); }
    } else if(type === 'socken'){
      for(let i = 0; i < 3; i++){ const px = x + 8 + i * (w - 16) / 3 + (w - 16) / 6; c.fillStyle = '#2E3226'; c.beginPath(); c.arc(px, y + h - 9, Math.min(8, w / 9), 0, 7); c.fill(); if(err && i === 1){ c.fillStyle = '#5B5E63'; c.beginPath(); c.arc(px + 3, y + h - 9, Math.min(8, w / 9) * .75, 0, 7); c.fill(); } }
    } else if(type === 'barett'){
      c.translate(cx, y + h - 10); if(err) c.rotate(.5);
      c.fillStyle = '#7A1F2B'; c.beginPath(); c.ellipse(0, 0, w * .32, 9, 0, 0, 7); c.fill(); c.fillStyle = '#C9A44A'; c.beginPath(); c.arc(-w * .12, -2, 3, 0, 7); c.fill();
    } else if(type === 'guertel'){
      c.strokeStyle = '#2A2A2A'; c.lineWidth = 4;
      if(err){ c.beginPath(); c.moveTo(x + 6, y + h - 8); c.bezierCurveTo(x + w * .4, y + h - 30, x + w * .6, y + h, x + w + 6, y + h - 20); c.stroke(); }
      else { c.beginPath(); c.ellipse(cx, y + h - 12, w * .28, 8, 0, 0, 7); c.stroke(); }
      c.fillStyle = '#B0B4A8'; c.fillRect(cx - 4, y + h - 16, 8, 8);
    } else if(type === 'stiefel' || type === 'sport'){
      for(let i = 0; i < 2; i++){ const bx = x + 6 + i * (w - 12) / 2; c.fillStyle = type === 'stiefel' ? '#151515' : '#D8D8D0'; c.fillRect(bx + 2, y + h * .2, (w - 12) / 2 - 8, h * .65); c.fillRect(bx + 2, y + h * .72, (w - 12) / 2 - 2, h * .16);
        if(err && i === (v > .5 ? 0 : 1)){ c.fillStyle = '#7A5230'; for(const [dx, dy] of [[.3, .5], [.6, .7], [.4, .8], [.7, .4]]){ c.beginPath(); c.arc(bx + 2 + ((w - 12) / 2 - 6) * dx, y + h * dy, 2.6, 0, 7); c.fill(); } } }
    } else if(type === 'chips'){
      c.fillStyle = '#E53935'; c.fillRect(cx - w * .2, y + h - 30, w * .4, 28); c.fillStyle = '#FFD54F'; c.fillRect(cx - w * .14, y + h - 22, w * .28, 8);
    } else if(type === 'dose'){

    }

  },
  score(s){ const rest = Math.max(0, s.dur - s.el - s.pen) / 1000; return s.found * 25 + (s.found >= 6 ? Math.round(rest * 2.6) : 0); },
  detail(s){ return s.found + ' von 6 Fehlern gefunden' + (s.pen ? ', ' + s.pen / 3000 + '× falsch getippt' : ''); },

   desc:'Mit eigener Werkstatt wartest du nicht mehr drei Wochen auf einen Termin beim Vertragspartner.', fx:s => s ? 'Instandsetzung ' + (15 * s) + ' % günstiger und ' + (18 * s) + ' % schneller' : 'Instandsetzung nur bei der zivilen Vertragswerkstatt: teuer und langsam'},
  {id:'tank', name:'Betriebsstofflager', ic:'⛽', max:3, kosten:[2500, 8000, 20000], zeit:[90, 240, 480],
   desc:'Eigene Zapfsäule. Die Tankkarte bleibt endlich im Spind.', fx:s => s ? 'Sprit ' + (15 * s) + ' % billiger' : 'Sprit zum vollen Preis an der zivilen Tankstelle'},
  {id:'funk', name:'Funkzentrale', ic:'📡', max:3, kosten:[4000, 12000, 30000], zeit:[120, 360, 720],
   desc:'Mehr Antennen, mehr Reichweite, mehr Leute, die anrufen.', fx:s => 'Einsatzradius ' + (70 + 25 * s) + ' km, bis zu ' + (5 + s) + ' offene Aufträge'},
  {id:'bereit', name:'Bereitschaftsraum', ic:'☕', max:2, kosten:[10000, 35000], zeit:[360, 960],
   desc:'Feldbetten, Kaffeemaschine, Bereitschaft rund um die Uhr.', fx:s => s ? s + (s === 1 ? ' Auftrag' : ' Aufträge') + ' mehr gleichzeitig, Besatzungen rücken auch ohne dich aus' : 'Unterhalb Feldwebel fährst du jeden Auftrag selbst mit'},
];
const FP_BAU_I = Object.fromEntries(FP_BAU.map(b => [b.id, b]));

function fpMs(min){ return min * 60000 / S.speed; }
function fpKz(){ const z = () => Math.floor(Math.random() * 10); return 'Y-' + z() + z() + z() + ' ' + z() + z() + z(); }
function fpState(){
  if(!S.lk) S.lk = {offen:[], aktiv:[], next:0, n:0};
  const lk = S.lk;
  if(!lk.fp){
    // Bestandsübernahme: die Fahrzeuge, die man bisher über Scheine und Dienstgrad hatte, gehören jetzt fest zum Fuhrpark
    const g = G.rank().g, n = g === 'F' || g === 'A' ? 2 : g === 'O' || g === 'G' ? 3 : 1, liste = [];
    for(const t of LK_FZ){ if(t.fs && !fsHas(t.fs)) continue; for(let i = 1; i <= n; i++) liste.push({uid:t.id + i, typ:t.id, kz:fpKz(), zust:100, km:0}); }
    let halle = 1; while(halle < 6 && FP_PLAETZE[halle] < liste.length) halle++;
    lk.fp = {liste, bau:{halle, werkstatt:0, tank:0, funk:0, bereit:0}, baut:null, td:'', seq:0};
  }
  return lk.fp;
}
function fpBau(id){ return (fpState().bau[id]) || 0; }
function fpPlaetze(){ return FP_PLAETZE[fpBau('halle')] || 3; }
function lkRadius(){ return 70 + 25 * fpBau('funk'); }
function lkAufMax(){ return lkBefehl().auf + fpBau('bereit') + (mst('fuehrung', 50) ? 1 : 0); }
function lkFzT(uid){
  const f = S && S.lk && S.lk.fp ? S.lk.fp.liste.find(x => x.uid === uid) : null;
  if(f) return LK_FZ.find(t => t.id === f.typ);
  return LK_FZ.filter(t => String(uid).startsWith(t.id)).sort((a, b) => b.id.length - a.id.length)[0] || LK_FZ[0];
}
// Fahrzeuge, die ausrücken können (alle = auch Werkstatt und kaputte, ohne Lieferungen)
function lkFuhrpark(alle){
  return fpState().liste.filter(f => !f.liefer && (alle || (!f.ws && f.zust >= 25))).map(f => ({uid:f.uid, t:LK_FZ.find(t => t.id === f.typ), f})).filter(x => x.t);
}
function fpStatus(f, belegt){
  if(f.liefer) return {k:'liefer', txt:'In Lieferung', end:f.liefer};
  if(f.ws) return {k:'ws', txt:'In der Werkstatt', end:f.ws};
  if(belegt.has(f.uid)) return {k:'weg', txt:'Im Einsatz'};
  if(f.zust < 25) return {k:'kaputt', txt:'Nicht einsatzbereit'};
  return {k:'bereit', txt:'Einsatzbereit'};
}
function fpPreis(typ){ return Math.round((FP_PREIS[typ] || 1000) * (mst('vitaminb', 40) ? .85 : 1)); }
function fpBauzeit(b, s){ return b.zeit[s] * (mst('vitaminb', 60) ? .5 : 1); }
function fpTdPlus(){ return mst('fachwissen', 60) ? 20 : 12; }
function fpWert(f){ return Math.round((FP_PREIS[f.typ] || 1000) * .35 * f.zust / 100); }
function fpRepKosten(f){ const w = fpBau('werkstatt'); return Math.max(20, Math.round((FP_PREIS[f.typ] || 1000) * .0012 * (100 - f.zust) * (w ? 1 - .15 * w : 1.3) * (mst('fachwissen', 40) ? .8 : 1))); }
function fpRepZeit(f){ const w = fpBau('werkstatt'); return Math.max(10, (100 - f.zust) * 3 * (w ? 1 - .18 * w : 1.5)); }
function fpLiefer(typ){ return Math.min(1440, 60 + (FP_PREIS[typ] || 1000) / 100) * (mst('vitaminb', 50) ? .5 : 1); }
function fpVerschleiss(f, a){
  const t = LK_FZ.find(x => x.id === f.typ), schwer = t.cap.includes('schutz') || t.cap.includes('pionier') ? 1.4 : t.cap.includes('luft') || t.cap.includes('jet') ? 1.2 : 1;
  return Math.round((3 + a.km * 2 * .03) * schwer * ((a.erg || 1) < 1 ? 1.4 : 1) * (mst('fachwissen', 50) ? .75 : 1) + Math.random() * 3);
}
// Lieferungen, Werkstatt und Bau abschließen
function fpTick(events){
  if(!S || !S.lk) return false;
  const fp = fpState(); let ch = false;
  for(const f of fp.liste){
    if(f.liefer && now() >= f.liefer){ delete f.liefer; ch = true; events.push('Lieferung eingetroffen: ' + lkFzT(f.uid).name + ' ' + f.kz + '. Das Beschaffungsamt hat Wort gehalten!'); }
    if(f.ws && now() >= f.ws){ delete f.ws; f.zust = 100; ch = true; events.push(lkFzT(f.uid).name + ' ' + f.kz + ' ist aus der Werkstatt zurück. Wie neu.'); }
  }
  if(fp.baut && now() >= fp.baut.ende){ const b = FP_BAU_I[fp.baut.id]; fp.bau[b.id] = (fp.bau[b.id] || 0) + 1; events.push(b.name + ' fertig ausgebaut: Stufe ' + fp.bau[b.id] + '.'); fp.baut = null; ch = true; if(typeof LKFIT !== 'undefined') LKFIT = ''; }
  return ch;
}
function fpNachEinsatz(a, events){
  const fp = fpState();
  for(const uid of a.fz){
    const f = fp.liste.find(x => x.uid === uid); if(!f) continue;
    f.km = (f.km || 0) + a.km * 2;
    const vor = f.zust; f.zust = Math.max(5, f.zust - fpVerschleiss(f, a));
    if(vor >= 25 && f.zust < 25) events.push(lkFzT(uid).name + ' ' + f.kz + ' ist nicht mehr einsatzbereit. Ab in die Werkstatt!');
  }
}

function fpKaufen(typ){
  const t = LK_FZ.find(x => x.id === typ), fp = fpState(), preis = FP_PREIS[typ] ? fpPreis(typ) : 0;
  if(!t || !preis) return 'Unbekanntes Fahrzeug.';
  if(t.fs && !fsHas(t.fs)) return 'Dafür fehlt dir der Schein.';
  if(fp.liste.length >= fpPlaetze()) return 'Kein Stellplatz frei. Baue die Fahrzeughalle aus.';
  if(S.money < preis) return 'Dafür reicht dein Geld nicht.';
  S.money -= preis; fp.seq = (fp.seq || 0) + 1;
  fp.liste.push({uid:typ + '_' + fp.seq, typ, kz:fpKz(), zust:100, km:0, liefer:now() + fpMs(fpLiefer(typ))});
  return null;
}
function fpBauen(id){
  const b = FP_BAU_I[id], fp = fpState(), s = fpBau(id);
  if(!b) return 'Unbekanntes Gebäude.';
  if(fp.baut) return 'Es wird schon gebaut. Ein Bauvorhaben nach dem anderen.';
  if(s >= b.max) return 'Schon voll ausgebaut.';
  const k = b.kosten[s]; if(S.money < k) return 'Dafür reicht dein Geld nicht.';
  S.money -= k; fp.baut = {id, start:now(), ende:now() + fpMs(fpBauzeit(b, s))};
  return null;
}
function fpReparieren(uids){
  const fp = fpState(), belegt = lkBelegt(), l = fp.liste.filter(f => uids.includes(f.uid) && !f.liefer && !f.ws && !belegt.has(f.uid) && f.zust < 100);
  if(!l.length) return 'Nichts instand zu setzen.';
  const k = l.reduce((s, f) => s + fpRepKosten(f), 0);
  if(S.money < k) return 'Dafür reicht dein Geld nicht (' + eur(k) + ').';
  S.money -= k; for(const f of l) f.ws = now() + fpMs(fpRepZeit(f));
  return null;
}
function fpTD(){
  const fp = fpState(), heute = dateStr(), belegt = lkBelegt();
  if(fp.td === heute) return 'Technischer Dienst ist heute schon erledigt.';
  const l = fp.liste.filter(f => !f.liefer && !f.ws && !belegt.has(f.uid) && f.zust < 100);
  if(!l.length) return 'Alle Fahrzeuge in der Halle sind top in Schuss.';
  const kost = mst('fitness', 60) ? 0 : 10;
  if(S.stamina < kost) return 'Zu wenig Ausdauer (10 nötig).';
  if(kost){ S.stamina -= kost; S.staminaTs = now(); } fp.td = heute;
  for(const f of l) f.zust = Math.min(100, f.zust + fpTdPlus());
  G.addPoints(5);
  return null;
}
function fpAusmustern(uid){
  const fp = fpState(), f = fp.liste.find(x => x.uid === uid);
  if(!f) return 'Fahrzeug nicht gefunden.';
  if(f.liefer || f.ws || lkBelegt().has(uid)) return 'Das Fahrzeug ist gerade nicht in der Halle.';
  if(fp.liste.length <= 1) return 'Ohne Fahrzeug geht es nicht. Eins bleibt.';
  S.money += fpWert(f); fp.liste = fp.liste.filter(x => x !== f);
  return null;
}

/* ---------- Ansicht ---------- */
function fpBalken(z){ const c = z >= 60 ? 'var(--ok)' : z >= 25 ? 'var(--signal)' : 'var(--bad)'; return '<span class="fpbar" aria-label="Zustand ' + z + ' Prozent"><i style="width:' + z + '%;background:' + c + '"></i></span>'; }

    + '<div class="fpkat">' + kann.map(t => '<div class="fpk"><span class="lkbig">' + t.ic + '</span><span class="fpi"><b>' + esc(t.name) + '</b><span class="small muted">' + t.cap.map(c => LK_CAP[c]).join(', ') + ' · ' + t.v + ' km/h · ' + (t.sp || .35).toFixed(2).replace('.', ',') + ' €/km · Unterhalt ' + eur(ukFz(t.id)) + '/Tag · Lieferung ' + fmtMin(fpLiefer(t.id) / S.speed) + '</span></span>'

function fpOpen(uid){

function maybeEvent(ctx, chance){
  if(S.einsatz || S.pending.length >= 3 || Math.random() > chance) return null;
  const t = R[S.rank].t;
  storyEnsure();
  const ok = EVENTS.filter(e => !e.story && !S.pending.includes(e.id)
    && (!e.minT || t >= e.minT)
    && (!e.groups || e.groups.includes(R[S.rank].g))
    && (!e.tsk || e.tsk === S.tsk)
    && (!e.ctx || e.ctx.includes(ctx))
    && (!e.need || S.flags[e.need])
    && (!e.blockIf || !S.flags[e.blockIf])
    && (!e.when || inWindow(e.when))
    && e.id !== S.lastEvent);
  if(!ok.length) return null;
  const follow = ok.filter(e=>e.need), normal = ok.filter(e=>!e.need);
  const pool = (follow.length && (Math.random() < .7 || !normal.length)) ? follow : normal;
  // Erst alles Ungesehene; Gesehenes frühestens nach 10 Tagen wieder, sonst lieber keine Meldung
  const fresh = pool.filter(e => !S.seen[e.id]);
  const cool = 10*864e5/(S.speed||1);
  const old = pool.filter(e => S.seen[e.id] && now() - (S.seenAt[e.id]||0) > cool).sort((a,b)=>(S.seenAt[a.id]||0)-(S.seenAt[b.id]||0));
  const use = fresh.length ? fresh : old.slice(0, 3);
  if(!use.length) return null;
  const sea = use.filter(x => x.when), pl = sea.length && Math.random() < .5 ? sea : use;
  const e = pl[Math.floor(Math.random()*pl.length)];
  S.pending.push(e.id); S.lastEvent = e.id;
  return e;
}
function rollChance(r){ return Math.min(95, r.base + 4*S.stats[r.stat]); }
function applyFx(fx){
  const chips = [];
  if(fx.money){ S.money = Math.max(0, S.money+fx.money); chips.push((fx.money>0?'+':'−')+eur(Math.abs(fx.money))); }
  if(fx.bp){ if(fx.bp>0) G.addPoints(fx.bp); else S.log.push({ts:now(), p:fx.bp}); chips.push((fx.bp>0?'+':'−')+Math.abs(fx.bp)+' Beurteilung'); }
  if(fx.st){ G.normStamina(); S.stamina = Math.max(0, Math.min(G.maxStamina(), S.stamina+fx.st)); chips.push((fx.st>0?'+':'−')+Math.abs(fx.st)+' Ausdauer'); }
  for(const [k,v0] of Object.entries(fx.rel||{})){ const v = (v0>0 && vb()==='koch') ? Math.round(v0*1.5) : v0; S.rel[k] = Math.max(-100, Math.min(100, S.rel[k]+v)); chips.push(NPCS[k].short+' '+(v>0?'+':'−')+Math.abs(v)); }
  if(fx.lg && S.lg){
    let v = fx.lg; if(v>0 && rel('krueger')>=30) v += 1;
    S.lg.score = (S.lg.score||0) + v; chips.push('Lehrgang '+(v>0?'+':'−')+Math.abs(v));
  }
  if(fx.ep && S.einsatz){ S.einsatz.score += fx.ep; chips.push('Einsatz '+(fx.ep>0?'+':'−')+Math.abs(fx.ep)); }
  if(fx.fs){ S.fsDone = S.fsDone || {}; S.fsDone[fx.fs] = now(); if(S.fsRetry) delete S.fsRetry[fx.fs]; chips.push('Führerschein ' + FS_I[fx.fs].name); }
  if(fx.fsFail){ S.fsRetry = S.fsRetry || {}; S.fsRetry[fx.fsFail] = 1; chips.push('Nicht bestanden'); }
  if(fx.flag) S.flags[fx.flag] = 1;
  if(fx.unflag) delete S.flags[fx.unflag];
  return chips;
}

function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function save(){
  if(!S) return;
  S.savedAt = now(); if(typeof USER !== 'undefined' && USER) S.uid = USER.id;
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(typeof cloudDirty !== 'undefined') cloudDirty = true;
}
const now = () => Date.now();

function dateStr(d=new Date()){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/864e5); }

function newGame(name, res=0, tsk){
  S = {
    v:1, name, rank:'sdt', money:150,
    stats:{fitness:0,schiessen:0,fachwissen:0,fuehrung:0,vitaminb:0},
    lehrgaenge:{}, stamina:100, staminaTs:now(),
    dienst:null, ausb:null, log:[],
    lastPromo:now(), lastPay:dateStr(), speed:1, theme:'system',
    history:[{rank:'sdt', ts:now()}], dienstCount:0,
    rel:{spiess:0,chef:0,kalle:0,lena:0,dennis:0,krueger:0}, flags:{}, pending:[], seen:{}, lgNote:{}, lgRetry:{},
    tsk: tsk || CREATE_TSK, tut:{step:0, done:false}, verw:null, stube:{bett:0,spind:0,kaffee:0,kuehl:0,hantel:0},
    start:now(), gaDone:false, verpfl:'FWD', dc:{}, gear:{}, einsatz:null, einsaetze:[], album:{}, pakete:1, sr:null, res
  };
  save();
}

/* =========================================================
   SPIELLOGIK (später 1:1 auf den Server verlagerbar)
   ========================================================= */
const G = {
  rank(){ return R[S.rank]; },
  weeks(){ return (now()-S.start)/864e5*S.speed; },
  dzLeft(){ const j = DZ[S.verpfl].jahre; return j ? j*52 - G.weeks() : Infinity; },
  dzOver(){ return G.dzLeft() <= 0; },
  gaReqs(){ return GA_STEPS.map(x => ({label:x.label, ok:!!x.ok(), rw:rewText(x.rew)})); },
  dzReqs(k){
    const r = G.rank(), out = [];
    if(k==='SaZ4') out.push({label:'Grundausbildung abgeschlossen', ok:!!S.gaDone});
    if(k==='SaZ8'){ out.push({label:'Dienstgrad mindestens Hauptgefreiter', ok:r.t>=3}); out.push({label:'Beurteilung mindestens „befriedigend“', ok:G.note()<=3}); }
    if(k==='SaZ13'){ out.push({label:'Dienstgrad mindestens Stabsgefreiter oder Unteroffizier', ok:r.t>=4}); out.push({label:'Führung Stufe 5', ok:S.stats.fuehrung>=5}); out.push({label:'Beurteilung mindestens „gut“', ok:G.note()<=2}); }
    if(k==='BS'){ out.push({label:'Dienstgrad Oberfeldwebel oder Leutnant und höher', ok:(r.g==='F'&&r.t>=7)||r.g==='O'||r.g==='G'}); out.push({label:'Beurteilung mindestens „gut“', ok:G.note()<=2}); }
    return out;
  },
  maxStamina(){ return 100 + pflegeBonus() + 5*S.stats.fitness + 10*S.stube.kaffee + (vb()==='san' ? 20 : 0) + (hasGear('rucksack') ? 15 : 0) + (albumSet('s') ? 10 : 0) + albumSt() + 2*kStufe('truppenkueche') + 3*kpStufe('kantine'); },
  regenMs(){ return 180000 / lageF('regen') / (mst('fitness', 40) ? 1.1 : 1) / S.speed / (rel('dennis')>=30 ? 1.15 : 1) / (1 + .05*S.stube.bett) / (hasGear('wagen') ? 1.2 : 1) / (1 + .02*kStufe('sanbereich')) / (rekrut() ? 2 : 1); }, // 1 Ausdauer alle 3 Minuten, im Dienst keine Erholung
  normStamina(){
    if(S.dienst && S.dienst.start){ // Während des Dienstes erholt man sich nicht
      if(S.staminaTs >= S.dienst.start && now() <= S.dienst.end){ S.staminaTs = now(); return; }
      if(now() > S.dienst.end && S.staminaTs >= S.dienst.start && S.staminaTs < S.dienst.end) S.staminaTs = S.dienst.end;
    }
    const max = G.maxStamina(), rg = G.regenMs();
    if(S.stamina >= max){ S.stamina = Math.min(S.stamina, max); S.staminaTs = now(); return; }
    const gained = Math.floor((now() - S.staminaTs)/rg);
    if(gained > 0){
      S.stamina = Math.min(max, S.stamina + gained);
      S.staminaTs = S.stamina >= max ? now() : S.staminaTs + gained*rg;
    }
  },
  payMult(){ return (1 + .01*ordenCount()) * (G.rank().sold/40) * (1 + .03*S.stats.fachwissen) * (1 + .02*S.stats.vitaminb) * (vb()==='inst' ? 1.1 : 1) * (1 + .05*Math.min(5, S.res||0)) * (hasGear('stander') ? 1.1 : 1) * (albumSet('g') ? 1.05 : 1) * (albumSet('l') ? 1.1 : 1) * albumPay() * (1 + .01*kStufe('betreuung') + .02*kpStufe('mannschaftsheim')); },
  bpMult(){ return (mst('schiessen', 60) ? 1.1 : 1) * lageF('bp') * Math.max(.2, 1 + .01*medalCount() + .03*S.stats.vitaminb + .02*S.stats.fuehrung + rel('spiess')/500 + Math.max(0,rel('chef'))/1000 + .04*S.stube.spind + (vb()==='fm' ? .1 : 0) + (hasGear('kalender') ? .05 : 0) + (albumSet('e') ? .05 : 0) + albumBp() + .02*kpStufe('geschaeftszimmer')); },
  dienstPay(d){ return Math.round(rtF(d) * wxF(d,'pay') * lagePay(d) * d.pay * G.payMult() * ((vb()==='inf' && (d.id==='gelaende'||d.id==='uebung')) ? 1.15 : 1)); },
  dienstSt(d){ return Math.round(wxF(d,'st') * lageF('st') * d.st * (vb()==='kfz' ? .8 : 1) * (hasGear('stiefel') ? .95 : 1) * (1 - .02*kpStufe('fahrzeughalle')) * (rekrut() ? .7 : 1)); },
  dienstMin(d){ return d.min * (hasGear('uhr') ? .95 : 1) * lageF('dur') * wxF(d,'dur'); },
  addPoints(p){ S.log.push({ts:now(), p: p>0 ? Math.round(p*G.bpMult()*10)/10 : p}); },
  points(){
    const cut = now() - 7*864e5/S.speed;
    S.log = S.log.filter(x => x.ts >= cut);
    const cap = noteTag(), tage = {};
    for(const x of S.log){ const k = noteTagKey(x.ts); tage[k] = (tage[k] || 0) + x.p; }
    const eff = Object.values(tage).reduce((a, v) => a + (v > cap ? cap + (v - cap) * NOTE_REST : v), 0);
    return Math.round(eff*10)/10;
  },
  pointsRoh(){ G.points(); return Math.round(S.log.reduce((a,x)=>a+x.p,0)*10)/10; },
  pointsTage(){ G.points(); const cap = noteTag(), heute = noteTagKey(now()), out = [];
    for(let i = 6; i >= 0; i--){ const k = heute - i, v = S.log.filter(x => noteTagKey(x.ts) === k).reduce((a, x) => a + x.p, 0); out.push({v:Math.round(v), q:Math.max(0, Math.min(1, v / cap)), heute:i === 0}); }
    return out; },
  note(){ const p = G.points(); for(let n=1;n<=4;n++) if(p >= noteMin(n)) return n; return 5; },
  dienstLock(d){
    const r = G.rank();
    if(!d.einsatz && lkMitAktiv()) return 'du bist mit einem Auftrag unterwegs';
    if(d.xmas && !xmasDienstOk(d)) return 'nur an den Feiertagen';
    if(S.einsatz && !d.einsatz) return 'im Auslandseinsatz';
    if(d.einsatz && !S.einsatz) return 'nur im Auslandseinsatz';
    if(d.fs && !fsHas(d.fs)) return 'nur mit Führerschein ' + FS_I[d.fs].name;
    if(d.statReq) for(const [k, v] of Object.entries(d.statReq)) if(S.stats[k] < v) return 'erst ab ' + STAT_NAME[k] + ' Stufe ' + v;
    if(d.q && dqUsed(d.id) >= d.q) return 'heute keine Fahrzeuge mehr frei';
    { const wl = wxLock(d); if(wl) return wl; }
    if(d.tsk && d.tsk !== S.tsk) return 'nur '+TSK[d.tsk].name;
    if(d.verw && S.verw !== d.verw) return 'nur für ' + VERW[d.verw].name;
    if(G.dzOver()) return 'Dienstzeitende';
    if(d.ga && S.gaDone) return 'nur in der Grundausbildung';
    if(d.spec) return r.spec ? null : 'nur für Korporale';
    if(d.groups && !d.groups.includes(r.g)) return 'ab ' + R[{U:'uffz',F:'fw',A:'fj',O:'lt',G:'bg'}[d.groups[0]]].name;
    if(d.minT && r.t < d.minT) return 'ab ' + (RANKS.find(x => d.groups.includes(x.g) && x.t >= d.minT) || r).name;
    if(d.groups) return null;
    if(r.t < d.t) return 'ab ' + RANKS.find(x=>x.g==='M' && x.t===d.t).name;
    return null;
  },
  statCost(id){ const l=S.stats[id]; return Math.round(25*(l+1)**2 * (rel('kalle')>=30 ? .9 : 1)); },
  statMin(id){
    const l = S.stats[id]; let f = rel('lena')>=30 ? .9 : 1;
    if(id==='fitness') f *= (1 - .08*S.stube.hantel) * (1 - .03*kStufe('sporthalle'));
    if(id==='schiessen') f *= 1 - .03*kStufe('schiessanlage');
    f *= 1 - .02*kpStufe('trainingsraum');
    if((id==='schiessen' && vb()==='inf') || (id==='fachwissen' && vb()==='inst')) f *= .8;
    if(id==='fuehrung' && hasGear('pfeife')) f *= .9;
    f *= lageTrain(id);
    return Math.max(1, Math.round(4*(l+1)**1.7 * f));
  },

  startDienst(id){
    const d = D[id];
    if(S.dienst) return 'Du bist schon im Dienst.';
    if(S.fa) return 'Du bist gerade im Feierabend beschäftigt.';
    if(lkMitAktiv()) return 'Du bist mit einem Auftrag der Lagekarte unterwegs.';
    if(G.dienstLock(d)) return 'Dieser Dienst ist noch gesperrt.';
    G.normStamina();
    if(S.stamina < G.dienstSt(d)) return 'Zu wenig Ausdauer.';
    S.stamina -= G.dienstSt(d); S.staminaTs = now();
    S.dienst = {id, start:now(), end:now()+G.dienstMin(d)*60000/S.speed, pay:G.dienstPay(d), bp:Math.round(d.bp*wxF(d,'bp'))};
    if(d.q) dqAdd(d.id);
    return null;
  },
  startStat(id){
    if(S.ausb) return 'Es läuft schon eine Ausbildung.';
    if(S.stats[id] >= STAT_MAX) return 'Höchststufe erreicht.';
    const c = G.statCost(id);
    if(S.money < c) return 'Zu wenig Geld.';
    S.money -= c; lottoAdd(c);
    S.ausb = {type:'stat', id, start:now(), end:now()+G.statMin(id)*60000/S.speed};
    return null;
  },
  lehrgangReqs(l){
    const out = [{label:'Dienstgrad: ' + l.ranks.map(x=>R[x].name).join(' oder '), ok:l.ranks.includes(S.rank)}];
    for(const [k,v] of Object.entries(l.stats)) out.push({label:STAT_NAME[k]+' Stufe '+v, ok:S.stats[k]>=v});
    out.push({label:'Kosten: '+eur(lgCost(l))+(lgCost(l)<l.cost ? ' (Wiederholung)' : ''), ok:S.money>=lgCost(l)});
    return out;
  },
  startLehrgang(id){
    const l = L[id];
    if(S.einsatz) return 'Im Auslandseinsatz gibt es keine Lehrgänge.';
    if(S.lg) return 'Es läuft schon ein Lehrgang.';
    if(S.lehrgaenge[id]) return 'Lehrgang schon abgeschlossen.';
    if(!G.lehrgangReqs(l).every(r=>r.ok)) return 'Voraussetzungen fehlen.';
    lottoAdd(lgCost(l)); S.money -= lgCost(l);
    const dur = l.min*60000/S.speed, ev = LG_EV[id].slice();
    S.lg = {type:'lehrgang', id, start:now(), end:now()+dur, cps:ev.map((_,i)=>now()+dur*(i+1)/(ev.length+1)), ev, next:0, score:0, exam:false};
    return null;
  },
  einstand(targetId){ return R[targetId].einstand * G.rank().sold; },
  // Beginn der Mindestdienstzeit. Beim Laufbahnwechsel zählt die Zeit, seit der Wechsel ohne Unterbrechung möglich ist,
  // damit eine Beförderung in der alten Laufbahn (z. B. HG zu SG) die Wartezeit nicht wieder auf null setzt.
  promoStart(targetId){
    const t = R[targetId], r = G.rank(), h = S.history || [];
    if((t.g === r.g && !!t.spec === !!r.spec) || !h.length || h[h.length - 1].rank !== S.rank) return S.lastPromo;
    let start = S.lastPromo;
    for(let i = h.length - 1; i >= 0; i--){
      if(!(NEXT[h[i].rank] || []).includes(targetId) || !h[i].ts) break;
      start = Math.min(start, h[i].ts);
    }
    return start;
  },
  promoReqs(targetId){
    const t = R[targetId], out = [];
    const start = G.promoStart(targetId), needMs = t.minH*3600000/S.speed, done = now()-start;
    out.push({label: 'Mindestdienstzeit: ' + fmtHours(t.minH/S.speed) + (start < S.lastPromo ? ' seit ' + R[(S.history.find(x => x.ts === start) || {}).rank || S.rank].name : '') + (done<needMs ? ' (noch ' + fmtLeft(needMs-done) + ')' : ''), ok: done>=needMs});
    out.push({label: 'Beurteilung mindestens „' + NOTES[t.note] + '“', ok: G.note() <= t.note});
    for(const [k,v] of Object.entries(t.stats||{})) out.push({label: STAT_NAME[k]+' Stufe '+v, ok: S.stats[k]>=v});
    if(t.ga) out.push({label:'Grundausbildung mit Gelöbnis abgeschlossen', ok:!!S.gaDone});
    if(t.dz) out.push({label:'Dienstverhältnis mindestens '+DZ[t.dz].short, ok: DZ[S.verpfl].rang >= DZ[t.dz].rang});
    if(t.lehrgang) out.push({label: L[t.lehrgang].name + ' abgeschlossen', ok: !!S.lehrgaenge[t.lehrgang]});
    out.push({label: 'Einstand für die Kompanie: ' + eur(G.einstand(targetId)), ok: S.money >= G.einstand(targetId)});
    return out;
  },
  promote(targetId){
    if(!(NEXT[S.rank]||[]).includes(targetId)) return 'Dieser Dienstgrad ist von hier aus nicht erreichbar.';
    if(!G.promoReqs(targetId).every(r=>r.ok)) return 'Voraussetzungen fehlen.';
    S.money -= G.einstand(targetId);
    S.rank = targetId; S.lastPromo = now();
    S.history.push({rank:targetId, ts:now()});
    G.addPoints(5);
    return null;
  },
  tick(){
    let events = [], changed = false;
    if(!TESTMODE && ONLINE.adminKnown && !ONLINE.admin && S.speed !== 1) S.speed = 1;
    sparZinsen();
    fe(); ntgTick(events); if(events.length) changed = true;
    if(S.fa && now() >= S.fa.end){
      const a = S.fa; S.fa = null;
      if(a.type === 'pfand') pfFinish(a, events); else if(a.type === 'fix') fixFinish(a, events);
      changed = true;
    }
    G.normStamina();
    // Sold
    const today = dateStr();
    if(S.lastPay !== today){
      const days = Math.max(1, Math.min(7, daysBetween(S.lastPay, today)));
      const amount = Math.round(G.rank().sold*days*(1+.02*S.stats.vitaminb)*(1+.05*S.stube.kuehl));
      S.money += amount - earnCut(amount); S.lastPay = today; changed = true;
      if(S.pflege && PFLEGE[S.pflege.tarif]){
        const b = Math.round(G.rank().sold * days * PFLEGE[S.pflege.tarif].rate);
        S.money -= b; events.push('Beitrag Pflegepflichtversicherung: '+eur(b));
      } else if(pflegePflicht() && now() > (S.pflegeFrist || 0)){
        const f = 2 * G.rank().sold; S.money -= f; S.log.push({ts:now(), p:-3});
        events.push('Brockmann: „Wo ist Ihr Nachweis der Pflegepflichtversicherung?“ Säumniszuschlag '+eur(f)+'.');
      }
      events.push('Sold ist da: ' + eur(amount));
    }
    if(S.dienst && now() >= S.dienst.end){
      const d = D[S.dienst.id];
      if(typeof kpBonusAdd === 'function') kpBonusAdd(S.dienst.pay);
      S.money += S.dienst.pay - earnCut(S.dienst.pay); G.addPoints(S.dienst.bp); S.dienstCount++; rtAdd(S.dienst.id); if(typeof xmasQ === 'function') xmasQ(); S.dc[S.dienst.id] = (S.dc[S.dienst.id]||0) + 1;
      if(D[S.dienst.id].einsatz && S.einsatz) S.einsatz.score += 1;
      if(Math.random() < (D[S.dienst.id].einsatz ? .25 : .12)){ S.pakete = Math.min(9, (S.pakete||0)+1); events.push('Feldpost ist da!'); }
      events.push(d.name + ' beendet: +' + eur(S.dienst.pay));
      { const ev = maybeEvent(d.id, .55); if(ev) events.push('Neue Meldung von ' + NPCS[ev.who].short); }
      storyEnsure(); S.story.d++; storyTick(events); funkTick(events); waAdd('dienst', 1, d.id); waAdd('pay', S.dienst.pay);
      S.dienst = null; changed = true;
    }
    if(S.lg && S.lg.cps){
      const a = S.lg;
      while(a.next < a.cps.length && now() >= a.cps[a.next]){
        if(!S.pending.includes(a.ev[a.next])) S.pending.push(a.ev[a.next]);
        a.next++; changed = true; events.push(L[a.id].name + ': neue Lage');
      }
      if(now() >= a.end && !a.exam){
        a.exam = true; S.pending.push('lgx_'+a.id); changed = true;
        events.push('Abschlussprüfung ' + L[a.id].name + ' wartet');
      }
    }
    if(S.einsatz){
      const a = S.einsatz;
      while(a.next < a.cps.length && now() >= a.cps[a.next]){
        if(!S.pending.includes(a.ev[a.next])) S.pending.push(a.ev[a.next]);
        a.next++; changed = true; events.push('Auslandseinsatz: neue Lage');
      }
      if(now() >= a.end && !a.fin){
        a.fin = true; S.pending.push(S.tsk==='marine' ? 'mx_heim' : 'ex_heim'); changed = true; events.push('Rückverlegung steht an');
      }
    }
    if(S.ausb && now() >= S.ausb.end && !S.ausb.cps){
      if(S.ausb.type === 'stat'){
        S.stats[S.ausb.id]++; G.addPoints(2);
        events.push(STAT_NAME[S.ausb.id] + ' jetzt auf Stufe ' + S.stats[S.ausb.id]); waAdd('ausb');
      } else {
        S.lehrgaenge[S.ausb.id] = now(); G.addPoints(10);
        events.push(L[S.ausb.id].name + ' bestanden');
      }
      S.ausb = null; changed = true;
      { const ev = maybeEvent('ausb', .3); if(ev) events.push('Neue Meldung von ' + NPCS[ev.who].short); }
    }
    if(fsTick(events)) changed = true;
    if(dgTick(events)) changed = true;
    if(gaCheck(events)) changed = true;
    if(lkTick(events)) changed = true;
    if(ordenCheck(events)) changed = true;
    if(changed) save();
    if(events.length) notifyEvents(events);
    return {changed, events};
  }
};

/* =========================================================
   HILFSFUNKTIONEN
   ========================================================= */
function eur(n){ return Math.round(n).toLocaleString('de-DE') + ' €'; }
function fmtMin(m){ m=Math.max(1,Math.round(m)); if(m<60) return m+' Min.'; const h=Math.floor(m/60), r=m%60; return h+' Std.'+(r?' '+r+' Min.':''); }
function fmtHours(h){ return h<1 ? fmtMin(h*60) : fmtMin(h*60); }
function fmtLeft(ms){ const s=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  const p=n=>String(n).padStart(2,'0'); return (h? h+':'+p(m) : m) + ':' + p(x); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function toast(msg){
  const host = document.getElementById('toastHost');
  host.innerHTML = '<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t = setTimeout(()=>host.innerHTML='', 2800);
}

// Schutz vor Fehlklicks: Springt die Leiste (z. B. weil die Browserleiste am Handy ein- oder ausfährt)
// und der Finger landet danach auf einem Knopf darunter, wird dieser Klick verworfen.
(function(){
  let navDown = 0, shift = 0, lastTop = null, feldZeit = 0;
  // Tastatur auf- oder zuklappen verschiebt die Ansicht ebenfalls; das soll keine Klicks blockieren
  const istFeld = el => el && el.matches && el.matches('input, textarea, select');
  document.addEventListener('focusin', e => { if(istFeld(e.target)) feldZeit = Date.now(); });
  document.addEventListener('focusout', e => { if(istFeld(e.target)) feldZeit = Date.now(); });
  const nav = () => document.getElementById('nav');
  const merke = () => { const n = nav(); if(!n) return; const t = Math.round(n.getBoundingClientRect().top); if(lastTop !== null && Math.abs(t - lastTop) > 2) shift = Date.now(); lastTop = t; };
  if(window.visualViewport){ visualViewport.addEventListener('resize', () => { shift = Date.now(); merke(); }); visualViewport.addEventListener('scroll', merke); }
  window.addEventListener('resize', () => { shift = Date.now(); merke(); });
  window.addEventListener('scroll', merke, {passive:true});
  document.addEventListener('pointerdown', e => { merke(); navDown = e.target.closest && e.target.closest('#nav') ? Date.now() : 0; }, true);
  document.addEventListener('click', e => {
    const inNav = e.target.closest && e.target.closest('#nav, .subnav');
    const tippte = navDown && Date.now() - navDown < 800;
    if(!inNav && (tippte || (Date.now() - shift < 400 && Date.now() - feldZeit > 1500)) && e.target.closest && e.target.closest('main [data-act], main button, main a')){
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); navDown = 0;
    }
  }, true);
})();
// Beim Tippen am Handy die Leiste ausblenden, damit sie über der Tastatur kein Textfeld verdeckt
(function(){
  const touch = () => window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const feld = el => el && el.matches && el.matches('input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=button]), textarea, select') && !el.closest('#nav');
  document.addEventListener('focusin', e => {
    if(!touch() || !feld(e.target)) return;
    document.body.classList.add('tippen');
    setTimeout(() => { try{ if(document.activeElement === e.target) e.target.scrollIntoView({block:'center', behavior:'smooth'}); }catch(x){} }, 350);
  });
  document.addEventListener('focusout', () => { setTimeout(() => { if(!feld(document.activeElement)) document.body.classList.remove('tippen'); }, 120); });
})();

  el.dataset.tsk = (S && S.tsk) || CREATE_TSK;
  applyTsk();
}

/* Schulterklappe: eigene, vereinfachte Darstellung je Dienstgradgruppe */
function star(cx,cy,r){
  let d=''; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r; d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1); }
  return '<path d="'+d+'Z" fill="var(--mark)"/>';
}
let INS_N = 0;
// Marine: blaue Schulterklappen mit goldenen Abzeichen (Anwärter-Beispiele wie MA/BA/OA nicht enthalten)
function insigniaMarine(id, size){
  const gold = '#E8B923', u = 'mar' + (++INS_N);
  const slash = (y, w) => '<path d="M20 ' + (y + 13) + ' L36 ' + (y - 1) + '" stroke="' + gold + '" stroke-width="' + (w || 4) + '"/>';
  const tresse = closed => '<path d="M15 ' + (closed ? 82 : 88) + ' V30 Q15 18 28 17 Q41 18 41 30 V' + (closed ? 82 : 88) + (closed ? ' Z' : '') + '" fill="none" stroke="' + gold + '" stroke-width="4.6" stroke-linejoin="round"/>';
  const chev = y => '<path d="M21 ' + (y + 6) + ' L28 ' + (y - 1) + ' L35 ' + (y + 6) + '" fill="none" stroke="' + gold + '" stroke-width="3.6"/>';
  const kopf = y => '<path d="M23 ' + (y + 9) + ' L35.5 ' + (y - 3.5) + ' L28 ' + (y - 11) + ' L20.5 ' + (y - 3.5) + ' L33 ' + (y + 9) + '" fill="none" stroke="' + gold + '" stroke-width="3.6" stroke-linejoin="miter" stroke-miterlimit="6"/>';   // Kopfwinkel („Fisch“)
  const stern = y => { const s = 6.5, k = 2.6; let p = ''; for(let i = 0; i < 5; i++){ const a = -Math.PI/2 + i*2*Math.PI/5, b = a + Math.PI/5; p += (i ? 'L' : 'M') + (28 + s*Math.cos(a)).toFixed(1) + ' ' + (y + s*Math.sin(a)).toFixed(1) + 'L' + (28 + k*Math.cos(b)).toFixed(1) + ' ' + (y + k*Math.sin(b)).toFixed(1); } return '<path d="' + p + 'Z" fill="' + gold + '"/>'; };
  // Ärmelstreifen als waagerechte Balken von unten nach oben: m = mittelbreit, s = schmal, b = handbreit
  const balken = list => { let y = 84, p = ''; for(const t of list){ const h = t === 'b' ? 10 : t === 'm' ? 4.5 : 1.8; y -= h; p += '<rect x="8.5" y="' + y.toFixed(1) + '" width="39" height="' + h + '" fill="' + gold + '"/>'; y -= 3; } return p; };
  let m = '';
  switch(id){
    case 'gefr': m = slash(66); break;
    case 'ogefr': m = slash(66) + slash(58); break;
    case 'hgefr': m = slash(66) + slash(58) + slash(50); break;
    case 'sgefr': m = slash(66) + slash(58) + slash(50) + slash(42); break;
    case 'osgefr': m = slash(66) + slash(58) + slash(50) + slash(42) + slash(34); break;
    case 'korp': m = slash(62, 9); break;
    case 'skorp': m = slash(64, 9) + slash(52); break;
    case 'uffz': m = tresse(false); break;                       // Maat
    case 'stuffz': m = tresse(true); break;                      // Obermaat
    case 'fj': m = tresse(false) + stern(50); break;             // Seekadett
    case 'fw': m = tresse(true) + chev(70); break;               // Bootsmann
    case 'ofw': m = tresse(true) + chev(70) + chev(62); break;   // Oberbootsmann
    case 'fhr': m = tresse(true) + stern(48) + chev(70); break;  // Fähnrich zur See
    case 'hfw': m = tresse(true) + kopf(62); break;              // Hauptbootsmann
    case 'sfw': m = tresse(true) + kopf(52) + chev(70); break;   // Stabsbootsmann
    case 'osfw': m = tresse(true) + kopf(46) + chev(64) + chev(72); break; // Oberstabsbootsmann
    case 'ofhr': m = stern(48) + balken(['s']); break;           // Oberfähnrich zur See
    case 'lt': m = balken(['m']); break;
    case 'olt': m = balken(['m','m']); break;
    case 'hptm': m = balken(['m','s','m']); break;               // Kapitänleutnant
    case 'shptm': m = balken(['m','s','s','m']); break;          // Stabskapitänleutnant
    case 'maj': m = balken(['m','m','m']); break;                // Korvettenkapitän
    case 'oberstlt': m = balken(['m','m','s','m']); break;       // Fregattenkapitän
    case 'oberst': m = balken(['m','m','m','m']); break;         // Kapitän zur See
    case 'bg': m = balken(['b','s']); break;                     // Flottillenadmiral
    case 'gm': m = balken(['b','m']); break;                     // Konteradmiral
    case 'gl': m = balken(['b','m','m']); break;                 // Vizeadmiral
    case 'gen': m = balken(['b','m','m','m']); break;            // Admiral
  }
  return '<svg viewBox="0 0 56 90" width="' + size + '" height="' + Math.round(size*90/56) + '" aria-hidden="true">'
    + '<defs><linearGradient id="' + u + 'g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26385A"/><stop offset="1" stop-color="#1A2840"/></linearGradient></defs>'
    + '<path d="M7 88 L9 18 Q9 6 28 5 Q47 6 47 18 L49 88 Z" fill="url(#' + u + 'g)"/>'
    + '<circle cx="28" cy="11" r="2.6" fill="#0F1828" opacity=".7"/>'
    + m + '<path d="M7 88 L9 18 Q9 6 28 5 Q47 6 47 18 L49 88 Z" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="1"/></svg>';
}
function insignia(id, size=56){
  const r = R[id]; if(!r) return '';
  if(typeof S !== 'undefined' && S && S.tsk === 'marine') return insigniaMarine(id, size);
  const u = 'ins' + (++INS_N), dark = '#141B0E', gold = '#E8C33A', silver = '#C9CDD2';
  const camo = (y0, y1) => '<g clip-path="url(#' + u + 'c)"><rect x="0" y="' + y0 + '" width="56" height="' + (y1 - y0) + '" fill="#6E7B4C"/>'
    + '<ellipse cx="14" cy="' + (y0+6) + '" rx="9" ry="5" fill="#8C6A43"/><ellipse cx="36" cy="' + (y0+10) + '" rx="10" ry="6" fill="#3E4B2B"/>'
    + '<ellipse cx="26" cy="' + (y0+3) + '" rx="6" ry="3.5" fill="#2A2F22"/><ellipse cx="44" cy="' + (y0+18) + '" rx="7" ry="4" fill="#8C6A43"/>'
    + '<ellipse cx="18" cy="' + (y0+17) + '" rx="8" ry="4" fill="#A2AC7E"/>'
    + (y1 - y0 > 30 ? '<ellipse cx="34" cy="' + (y0+32) + '" rx="10" ry="6" fill="#8C6A43"/><ellipse cx="16" cy="' + (y0+40) + '" rx="9" ry="6" fill="#3E4B2B"/><ellipse cx="38" cy="' + (y0+52) + '" rx="8" ry="5" fill="#2A2F22"/><ellipse cx="20" cy="' + (y0+62) + '" rx="10" ry="5" fill="#A2AC7E"/><ellipse cx="40" cy="' + (y0+74) + '" rx="9" ry="6" fill="#8C6A43"/><ellipse cx="14" cy="' + (y0+80) + '" rx="7" ry="4" fill="#3E4B2B"/>' : '')
    + '</g>';
  // Schrägstreifen „/“ von unten links nach oben rechts
  const slash = (y, w) => '<path d="M20 ' + (y + 13) + ' L36 ' + (y - 1) + '" stroke="' + dark + '" stroke-width="' + (w || 4) + '" stroke-linecap="butt"/>';
  // Tresse: offen (Unteroffizier, Fahnenjunker) oder geschlossen
  const tresse = closed => '<path d="M15 ' + (closed ? 82 : 86) + ' V33 Q15 24 28 23 Q41 24 41 33 V' + (closed ? 82 : 86) + (closed ? ' Z' : '') + '" fill="none" stroke="' + dark + '" stroke-width="4.6" stroke-linejoin="round"/>';
  const chev = y => '<path d="M21 ' + (y + 6) + ' L28 ' + (y - 1) + ' L35 ' + (y + 6) + '" fill="none" stroke="' + dark + '" stroke-width="3.6"/>';
  // Kopfwinkel („Fisch“): Schlaufe oben, darunter gekreuzte Enden
  const raute = y => '<path d="M23 ' + (y + 9) + ' L35.5 ' + (y - 3.5) + ' L28 ' + (y - 11) + ' L20.5 ' + (y - 3.5) + ' L33 ' + (y + 9) + '" fill="none" stroke="' + dark + '" stroke-width="3.6" stroke-linejoin="miter" stroke-miterlimit="6"/>';
  const cord = '<rect x="9" y="82.5" width="38" height="4" fill="' + silver + '"/><path d="M11 86.5l3-4M15 86.5l3-4M19 86.5l3-4M23 86.5l3-4M27 86.5l3-4M31 86.5l3-4M35 86.5l3-4M39 86.5l3-4M43 86.5l3-4" stroke="#8A8F95" stroke-width="1"/>';
  const star = (x, y, c, s) => { s = s || 6.5; const k = s * .32;
    return '<path d="M' + x + ' ' + (y - s) + ' L' + (x + k) + ' ' + (y - k) + ' L' + (x + s) + ' ' + y + ' L' + (x + k) + ' ' + (y + k) + ' L' + x + ' ' + (y + s) + ' L' + (x - k) + ' ' + (y + k) + ' L' + (x - s) + ' ' + y + ' L' + (x - k) + ' ' + (y - k) + 'Z" fill="' + c + '"/>'
      + '<path d="M' + (x - s*.62) + ' ' + (y - s*.62) + ' L' + x + ' ' + (y - k*.7) + ' L' + (x + s*.62) + ' ' + (y - s*.62) + ' L' + (x + k*.7) + ' ' + y + ' L' + (x + s*.62) + ' ' + (y + s*.62) + ' L' + x + ' ' + (y + k*.7) + ' L' + (x - s*.62) + ' ' + (y + s*.62) + ' L' + (x - k*.7) + ' ' + y + 'Z" fill="' + c + '" opacity=".85"/>'; };
  const kranz = c => {
    // Eichenlaub: zwei Zweige, die sich unten kreuzen und seitlich nach oben laufen
    let p = '';
    for(const side of [-1, 1]){
      const P0 = [28 - side*4, 82], P1 = [28 + side*16, 80], P2 = [28 + side*14, 54];
      for(let n = 0; n < 8; n++){
        const t = .08 + n * .13, x = (1-t)*(1-t)*P0[0] + 2*(1-t)*t*P1[0] + t*t*P2[0], y = (1-t)*(1-t)*P0[1] + 2*(1-t)*t*P1[1] + t*t*P2[1];
        const dx = 2*(1-t)*(P1[0]-P0[0]) + 2*t*(P2[0]-P1[0]), dy = 2*(1-t)*(P1[1]-P0[1]) + 2*t*(P2[1]-P1[1]);
        const ang = Math.atan2(dy, dx) * 180 / Math.PI, off = (n % 2 ? 2.4 : -2.4), len = Math.hypot(dx, dy) || 1;
        const lx = x + off * (-dy/len), ly = y + off * (dx/len);
        p += '<ellipse cx="' + lx.toFixed(1) + '" cy="' + ly.toFixed(1) + '" rx="3.4" ry="1.7" transform="rotate(' + (ang + (n % 2 ? 35 : -35)).toFixed(0) + ' ' + lx.toFixed(1) + ' ' + ly.toFixed(1) + ')" fill="' + c + '"/>';
      }
      p += '<path d="M' + P0[0] + ' ' + P0[1] + ' Q' + P1[0] + ' ' + P1[1] + ' ' + P2[0] + ' ' + P2[1] + '" stroke="' + c + '" stroke-width="1.2" fill="none"/>';
    }
    return p;
  };
  let m = '';
  switch(id){
    case 'gefr': m = slash(66); break;
    case 'ogefr': m = slash(66) + slash(58); break;
    case 'hgefr': m = slash(66) + slash(58) + slash(50); break;
    case 'sgefr': m = slash(66) + slash(58) + slash(50) + slash(42); break;
    case 'osgefr': m = slash(66) + slash(58) + slash(50) + slash(42) + slash(34); break;
    case 'korp': m = slash(62, 9); break;
    case 'skorp': m = slash(64, 9) + slash(52); break;
    case 'uffz': m = tresse(false); break;
    case 'stuffz': m = tresse(true); break;
    case 'fw': m = tresse(true) + chev(68); break;
    case 'ofw': m = tresse(true) + chev(68) + chev(60); break;
    case 'hfw': m = tresse(true) + raute(64); break;
    case 'sfw': m = tresse(true) + raute(52) + chev(70); break;
    case 'osfw': m = tresse(true) + raute(46) + chev(64) + chev(72); break;
    case 'fj': m = tresse(false) + cord; break;
    case 'fhr': m = tresse(true) + chev(68) + cord; break;
    case 'ofhr': m = tresse(true) + raute(64) + cord; break;
    case 'lt': m = star(28, 74, dark); break;
    case 'olt': m = star(28, 74, dark) + star(28, 58, dark); break;
    case 'hptm': m = star(28, 74, dark) + star(28, 58, dark) + star(28, 42, dark); break;
    case 'shptm': m = star(20, 74, dark) + star(36, 74, dark) + star(28, 58, dark) + star(28, 42, dark); break;
    case 'maj': m = kranz(dark) + star(28, 68, dark); break;
    case 'oberstlt': m = kranz(dark) + star(28, 68, dark) + star(28, 52, dark); break;
    case 'oberst': m = kranz(dark) + star(28, 68, dark) + star(28, 52, dark) + star(28, 36, dark); break;
    case 'bg': m = kranz(gold) + star(28, 68, gold); break;
    case 'gm': m = kranz(gold) + star(28, 68, gold) + star(28, 54, gold); break;
    case 'gl': m = kranz(gold) + star(28, 68, gold) + star(28, 54, gold) + star(28, 40, gold); break;
    case 'gen': m = kranz(gold) + star(28, 68, gold, 6) + star(28, 55, gold, 6) + star(28, 42, gold, 6) + star(28, 29, gold, 6); break;
  }
  const soldat = id === 'sdt';
  return '<svg viewBox="0 0 56 90" width="' + size + '" height="' + Math.round(size*90/56) + '" aria-hidden="true">'
    + '<defs><clipPath id="' + u + 'c"><path d="M7 88 L9 22 Q9 4 28 3 Q47 4 47 22 L49 88 Z"/></clipPath></defs>'
    + '<path d="M7 88 L9 22 Q9 4 28 3 Q47 4 47 22 L49 88 Z" fill="#5E6A4B"/>'
    + (soldat ? camo(0, 90) : camo(0, 22))
    + '<path d="M9 22 H47" stroke="rgba(0,0,0,.25)" stroke-width="1"/>'
    + m + '<path d="M7 88 L9 22 Q9 4 28 3 Q47 4 47 22 L49 88 Z" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1"/></svg>';
}

    + '</div></div>' + gsStats() + gsDock();

  if(S.pending.length){
    h += '<h2>Meldungen</h2><div class="panel">' + S.pending.map(id => { const e = EV[id], n = NPCS[e.who];
      return '<div class="row"><div style="display:flex;gap:12px;align-items:center;min-width:0;flex:1">'+npcBadge(e.who,36)
        + '<div class="info"><div class="title">Meldung von '+esc(n.short)+'</div><div class="meta">'+esc(n.role)+'</div></div></div>'
